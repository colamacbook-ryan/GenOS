[project]
name = "gen-harness-browser"
version = "0.1.0"
description = "browser-worker của Gen-Harness: Playwright + Chromium, chỉ nói chuyện với Redis (không DB, không khoá master)"
requires-python = ">=3.11"
dependencies = [
  # Cùng phiên bản với ảnh gốc mcr.microsoft.com/playwright/python:v1.56.0-noble (deploy/images/browser.Dockerfile)
  # — thư viện và Chromium đi kèm phải khớp nhau.
  "playwright==1.56.0",
  "redis>=5.0",
  "cryptography>=43",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
