name: Staging smoke (dựng từ mã nguồn)

# Gen (AI làm việc từ xa, không có máy riêng) "vừa làm vừa test thật": dựng GenOS TỪ MÃ NGUỒN của commit/nhánh được chọn
# trên ubuntu-24.04 bằng ĐÚNG đường dev của repo (`make up` = make secrets + docker compose build + up; không mock),
# đợi các dịch vụ healthy, gọi health qua proxy, thiết lập lần đầu (tạo Sếp + PIN giả), đăng nhập, chụp ảnh Console ở khổ máy tính
# 1440 px (scripts/staging-smoke/shots.mjs) rồi upload artifact `staging-smoke-<run_number>` cho Gen tải về xem.
# CHỈ chạy tay (workflow_dispatch). Không đẩy ảnh lên GHCR, không tạo Release, không dùng secret thật: mọi khoá/mật khẩu
# sinh ngẫu nhiên trong job như trình cài làm.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Nhánh/tag/SHA cần dựng (để trống = ref đang chọn khi bấm Run workflow)"
        required: false
        default: ""
        type: string

concurrency:
  group: staging-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OUT: ${{ github.workspace }}/staging-smoke-out
    steps:
      - name: Kiểm định dạng ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
          DEFAULT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-$DEFAULT_REF}"
          if ! [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::ref không hợp lệ (chỉ cho phép chữ, số, . _ / -)" >&2
            exit 1
          fi
          echo "value=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.ref.outputs.value }}
          persist-credentials: false

      - name: Ghi commit đang dựng
        run: |
          mkdir -p "$OUT/logs"
          { echo "sha=$(git rev-parse HEAD)"; echo "VERSION=$(tr -d '[:space:]' < VERSION)"; } | tee "$OUT/build-info.txt"

      # Khoá/mật khẩu ngẫu nhiên như trình cài (genh) làm; `make secrets` sinh secrets/* + .env từ .env.example (Makefile:20-33).
      - name: Sinh khoá + .env ngẫu nhiên (make secrets)
        run: |
          set -euo pipefail
          make secrets
          hex() { python3 -c "import secrets;print(secrets.token_hex(16))"; }
          pg="$(hex)"; app="$(hex)"; tok="$(hex)"
          echo "::add-mask::$pg"; echo "::add-mask::$app"; echo "::add-mask::$tok"
          sed -i \
            -e "s|^GH_ENV=.*|GH_ENV=production|" \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$pg|" \
            -e "s|^GH_APP_DB_PASSWORD=.*|GH_APP_DB_PASSWORD=$app|" \
            -e "s|^GH_SETUP_TOKEN=.*|GH_SETUP_TOKEN=$tok|" .env
          echo "SETUP_TOKEN=$tok" >> "$GITHUB_ENV"
          # Hộp thư Console ↔ genh (GH_HOST_LINK_DIR mặc định ../run so với deploy/): genh tạo sẵn 0777 khi cài thật.
          mkdir -p run && chmod 0777 run

      # Dựng ảnh từ mã nguồn + chạy toàn bộ stack (Makefile:35-37 `make up` → docker compose -f deploy/compose.yaml up -d --build).
      - name: Dựng + chạy stack từ mã nguồn (make up)
        run: make up

      - name: Chờ các dịch vụ healthy (tối đa 10 phút)
        run: |
          set -uo pipefail
          compose="docker compose -f deploy/compose.yaml --env-file .env"
          deadline=$((SECONDS + 600))
          while true; do
            # Chưa xong = có container đang 'starting'/'unhealthy'/restart, hoặc migrate chưa thoát mã 0, hoặc /ready chưa 200.
            pending="$($compose ps -a --format json | jq -rs 'flatten | map(select(
                (.Service == "migrate" and (.State != "exited" or .ExitCode != 0))
                or (.Service != "migrate" and (.State != "running" or (.Health != "" and .Health != "healthy")))
              ) | "\(.Service)=\(.State)/\(.Health)") | join(" ")')"
            if [ -z "$pending" ] && curl -ksf -o /dev/null https://localhost:8443/api/v1/ready; then
              echo "Tất cả dịch vụ healthy."
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::dịch vụ chưa healthy sau 10 phút: ${pending:-chỉ /api/v1/ready chưa 200}" >&2
              $compose ps -a
              exit 1
            fi
            echo "Đang chờ: ${pending:-/api/v1/ready}"
            sleep 10
          done
          $compose ps -a

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        # Không dùng cache npm: workflow này chạy được trên ref tuỳ chọn, không được ghi cache mà ci.yml sẽ đọc lại.
        with: { node-version: "22" }
      - name: Cài phụ thuộc web (npm ci ở gốc repo)
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
      - name: Phiên bản Playwright (khoá cache trình duyệt)
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache trình duyệt Playwright
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          # Khoá riêng (tiền tố staging-smoke-) để ci.yml không bao giờ khôi phục cache do ref tuỳ chọn ghi.
          key: staging-smoke-ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Cài Chromium cho Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Smoke + thiết lập lần đầu + chụp ảnh Console (1440)
        run: node scripts/staging-smoke/shots.mjs

      - name: Thu trạng thái compose + log từng dịch vụ
        if: always()
        run: |
          compose="docker compose -f deploy/compose.yaml --env-file .env"
          mkdir -p "$OUT/logs"
          $compose ps -a > "$OUT/compose-ps.txt" 2>&1 || true
          $compose ps -a --format json > "$OUT/compose-ps.json" 2>&1 || true
          for svc in $($compose config --services 2>/dev/null); do
            $compose logs --no-color --tail=400 "$svc" > "$OUT/logs/$svc.log" 2>&1 || true
          done

      - name: Tóm tắt (GITHUB_STEP_SUMMARY)
        if: always()
        run: |
          {
            echo "## Staging smoke — $(grep '^sha=' "$OUT/build-info.txt" 2>/dev/null || echo 'chưa checkout')"
            echo
            echo "### Dịch vụ"
            if [ -s "$OUT/compose-ps.json" ] && jq -rs 'flatten | length' "$OUT/compose-ps.json" >/dev/null 2>&1; then
              echo "| Dịch vụ | Trạng thái | Health |"
              echo "|---|---|---|"
              jq -rs 'flatten | sort_by(.Service) | .[] | "| \(.Service) | \(.State) | \(if .Health == "" then "-" else .Health end) |"' "$OUT/compose-ps.json"
            else
              echo "Không lấy được trạng thái compose (stack chưa dựng xong?)."
            fi
            echo
            echo "### Smoke + ảnh"
            if [ -f "$OUT/summary.md" ]; then cat "$OUT/summary.md"; else echo "- Smoke chưa chạy tới (xem log các bước phía trên)."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging-smoke-${{ github.run_number }}
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: staging-smoke-${{ github.run_number }}
          path: staging-smoke-out
          retention-days: 7
          if-no-files-found: warn
