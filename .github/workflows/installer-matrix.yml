name: Installer matrix

# Chạy trên PUSH THƯỜNG (không đợi tag release) để bắt lỗi genh sớm trên cả
# 4 hệ điều hành của ma trận: `go vet ./...` + `go test ./...` (từ v0.1.33,
# F-13 — trước đó go test chỉ chạy tay trên Linux), rồi build binary và chạy
# thử `genh version`/`help` — xem docs/handoff/05-installer.md mục "Kiểm thử
# trình cài". File RIÊNG (không gộp vào ci.yml) để không đụng job api/web/
# images. Job tổng `installer-ok` ở cuối là required check duy nhất của tệp
# này (luôn chạy, không lọc đường dẫn).
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # v0.1.33 — release.yml gọi lại workflow này thành job `installer` và đưa
  # vào `needs` của job release: bản thử chỉ được tạo khi go vet/go test xanh
  # trên cả 4 hệ điều hành ở ĐÚNG commit sắp phát hành.
  workflow_call:
    inputs:
      from_release:
        type: boolean
        required: false
        default: false
        description: "true khi release.yml gọi"

# Như ci.yml: khi gọi qua workflow_call, `github.ref` là của release.yml (main)
# ⇒ trùng nhóm với lượt push main và hai bên huỷ nhau. Lượt từ Release có
# nhóm riêng theo sha + run_id và không huỷ ai; push/PR giữ hành vi cũ.
concurrency:
  group: ${{ inputs.from_release && format('installer-matrix-release-{0}-{1}', github.sha, github.run_id) || format('installer-matrix-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.from_release }}

# v0.1.48 (F-71): quyền tối thiểu cho mọi job (chỉ đọc mã nguồn).
permissions:
  contents: read

jobs:
  # Ma trận đúng tài liệu: Ubuntu 22.04/24.04, macOS 14 arm64, Windows 11
  # (runner GitHub-hosted gần nhất: windows-2022). Build genh TỪ SOURCE ngay
  # trong job này (không chờ release.yml) rồi xác nhận binary chạy được.
  build-and-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24.0"

      # v0.1.33 (F-13) — vet + test TRƯỚC khi build, trên đúng hệ điều hành
      # của runner: lỗi chỉ lộ trên Windows/macOS (đường dẫn, quyền tệp, CRLF…)
      # phải đỏ ở đây chứ không phải trên máy Owner.
      - name: go vet ./...
        working-directory: apps/genh
        shell: bash
        run: go vet ./...

      - name: go test ./...
        working-directory: apps/genh
        shell: bash
        run: go test -count=1 ./...

      # v0.1.48 (F-13) — quét bảo mật (báo cáo, không chặn), chỉ một ô để khỏi lặp. govulncheck v1.8.0 yêu cầu
      # Go 1.26 trong go.mod; GOTOOLCHAIN=auto để Go 1.24 tự tải toolchain phù hợp (không đổi bản Go dùng build genh).
      - name: Quét bảo mật govulncheck (báo cáo, không chặn)
        if: matrix.os == 'ubuntu-24.04'
        continue-on-error: true
        working-directory: apps/genh
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -format json ./... > govulncheck.json || true
          python3 ../../.github/scripts/scan_summary.py --kind govulncheck --title 'govulncheck (apps/genh)' govulncheck.json >> "$GITHUB_STEP_SUMMARY"

      - name: Build genh từ mã nguồn (native GOOS/GOARCH của runner)
        working-directory: apps/genh
        shell: bash
        run: |
          set -euo pipefail
          out="genh"
          if [ "${{ runner.os }}" = "Windows" ]; then out="genh.exe"; fi
          go build -o "$out" ./cmd/genh
          echo "GENH_BIN=$out" >>"$GITHUB_ENV"

      - name: genh version / help chạy được trên ${{ matrix.os }}
        working-directory: apps/genh
        shell: bash
        run: |
          set -euo pipefail
          ./"${GENH_BIN}" version
          ./"${GENH_BIN}" help

      # Docker chỉ có sẵn mặc định trên runner Ubuntu GitHub-hosted — macOS/
      # Windows KHÔNG có, nên chỉ thử cài đặt thật trên Linux, và vẫn chỉ
      # best-effort: deploy/compose.yaml hiện dùng "build:" cục bộ cho api/
      # web/bridge/db/migrate/worker (chưa build ở CI này — xem release.yml
      # job build-images), nên `genh install` THẬT SỰ sẽ dừng ở bước cần
      # image những service đó. Không coi lỗi ở bước đó là lỗi CI — chỉ xác
      # nhận binary chạy, đọc máy, sinh bí mật... không panic. "Cài đặt
      # đầu-cuối thật trên ma trận OS" (yêu cầu ảnh publish sẵn từ
      # release.yml) là việc tương lai, chưa làm ở đây.
      - name: (chỉ Linux, có Docker) genh install --yes best-effort
        if: runner.os == 'Linux'
        working-directory: apps/genh
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          docker version
          ./"${GENH_BIN}" install --install-dir /tmp/genh-installer-matrix --port 18443 --yes || \
            echo "genh install dừng giữa chừng (dự kiến — deploy/compose.yaml chưa có image publish sẵn cho api/web/bridge/db/migrate/worker ở nhánh này, xem release.yml job build-images/pin-compose). Đây là smoke-test best-effort, không chặn CI."

  # ── installer-ok ─────────────────────────────────────────────────────────
  # v0.1.33 (F-9/F-13) — job tổng: required check DUY NHẤT của tệp này. Luôn
  # chạy (if: always(), không lọc đường dẫn); đỏ khi ma trận build-and-smoke
  # không xanh trọn vẹn trên cả 4 hệ điều hành (failure/cancelled/skipped).
  installer-ok:
    name: installer-ok
    runs-on: ubuntu-latest
    needs: build-and-smoke
    if: always()
    steps:
      - name: Tổng hợp kết quả ma trận trình cài
        env:
          RESULT: ${{ needs.build-and-smoke.result }}
        run: |
          echo "build-and-smoke=$RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::Ma trận trình cài chưa xanh ($RESULT) — mở job hệ điều hành bị đỏ (go vet/go test/build), sửa lỗi rồi đẩy lại hoặc bấm Re-run." >&2
            exit 1
          fi
          echo "Ma trận trình cài xanh trên cả 4 hệ điều hành."
