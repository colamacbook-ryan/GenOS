name: E2E cài đặt thật

# Installer-matrix.yml chỉ smoke-test binary (genh version/help), KHÔNG cài
# dịch vụ thật (deploy/compose.yaml build cục bộ, không có ảnh publish sẵn ở
# nhánh thường — xem comment trong file đó). Workflow NÀY là lần kiểm THẬT
# duy nhất: cài toàn bộ Gen-Harness bằng Docker trên runner ubuntu-24.04
# (Docker có sẵn) — xem docs/handoff/05-installer.md mục "Kiểm thử trình
# cài": "Mỗi ô: cài sạch → /api/ready xanh → genh update → genh uninstall".
#
# CỔNG PHÁT HÀNH (v0.1.33, F-9/F-13): release.yml chỉ tạo BẢN THỬ
# (prerelease, không đổi latest). Workflow này cài thật ĐÚNG tag bản thử đó;
# e2e-install + e2e-upgrade xanh thì job `promote` mới nâng nó thành BẢN
# CHÍNH THỨC (latest) — lúc đó máy Owner (install.sh, genh tự cập nhật) mới
# thấy. E2E đỏ → bản thử nằm yên, bản chính thức không đổi. Promote ghi dấu
# `<!-- genh:promoted_at=… -->` vào ghi chú Release (cùng một lệnh
# gh release edit) — thời gian chín 24 giờ của lịch đêm tính từ dấu này, vì
# published_at là lúc tạo bản thử và promote không đổi nó. Sau promote, job
# `e2e-selfupdate` đi đúng đường máy Owner đi: genh CŨ tự tải genh mới qua
# releases/latest, re-exec, nâng cấp dịch vụ (đỏ ⇒ ::error kèm cách lùi bản).
#
# LƯỚI AN TOÀN CẬP NHẬT (v0.1.34, F-35; nghiệm thu thật F-10/F-11/F-33) —
# promote đòi THÊM job `e2e-rollback` xanh:
#   - e2e-install: `genh update --yes` khi đã mới nhất phải in "không cần cập
#     nhật", KHÔNG tạo bản sao lưu mới và KHÔNG tải ảnh nào (docker events).
#   - e2e-upgrade (release): nạp dữ liệu mẫu THẬT vào bản cũ (python -m
#     gh.seed_demo seed, script .github/scripts/e2e_data.sh), đếm số dòng các
#     bảng chính trước/sau nâng cấp — phải trùng; kéo sẵn ảnh của bản cũ hơn
#     nữa (PREV2) rồi kiểm genh dọn ảnh cũ: chỉ còn ảnh của bản hiện tại + bản
#     liền trước, mỗi repo gen-harness-* (và caddy, redis — ghim digest từ
#     v0.1.48) tối đa 2 digest. Từ v0.1.48 kéo thêm 1 digest caddy + 1 digest
#     redis CŨ không gắn tag (ghi vào prev2-refs.txt) — genh phải xoá chúng.
#     v0.1.37: job là MA TRẬN hai ô nâng cấp (output upgrade_from của resolve):
#     ô tags[1] = bản chính thức liền trước (máy Owner cập nhật đều mỗi đêm) và
#     ô tags[3] = bản chính thức cũ hơn 3 bậc — máy Owner tắt vài ngày rồi bật
#     lại, nhảy nhiều bản một lần (migration dồn, compose đổi nhiều lần). Chưa
#     đủ 3 bản chính thức cũ hơn ⇒ ô tags[3] vắng (ghi ở tóm tắt resolve,
#     không đỏ). fail-fast: false; ô nào đỏ ⇒ kết quả job = failure ⇒ KHÔNG
#     promote (check_release_gate.py giữ bất biến này).
#   - e2e-install (pr + release, genh v0.1.37+): khoá loại trừ <gốc cài>/
#     genh.lock đang bị giữ ⇒ `genh update` thoát 0, in "đang có một lần cập
#     nhật/khôi phục khác chạy", không đụng update-status.json; `genh status`
#     ghi run/autostart-status.json đúng hợp đồng (tự chạy lại khi bật máy).
#   - e2e-rollback (pr + release): build 3 genh từ mã đang xét — "tốt" (compose
#     đúng), "hỏng" (api `command: ["false"]` — không bao giờ lên), "sửa" (khác
#     byte, cùng cấu hình). Cài bằng genh tốt + dữ liệu mẫu → genh hỏng update
#     phải thoát khác 0, tự quay về bản cũ (compose cũ, api cũ chạy, số dòng
#     giữ nguyên) và ghi run/update-blocked.json; chạy lại như lịch đêm → "lịch
#     đêm không tự thử lại", không sao lưu/không tải ảnh; genh sửa update →
#     thành công, xoá update-blocked.json, dữ liệu vẫn nguyên.
#
# LỊCH ĐÊM THẬT (v0.1.53, F-100) — promote đòi THÊM job `e2e-nightly-real` xanh:
#   máy Owner kẹt ở v0.1.44 (lịch tự cập nhật đêm TẮT 10 ngày, nút "Cập nhật ngay" báo "Máy chủ chưa nhận yêu
#   cầu") mà mọi E2E vẫn xanh, vì các job khác cài bằng --no-auto-update hoặc trên runner không có
#   `systemctl --user` (genh rơi về crontab) — chưa từng có ai chạy timer/.path thật. Job này bật user manager
#   systemd thật + linger (tiến trình nền chạy cả khi không ai đăng nhập) rồi kiểm: `genh install` (KHÔNG
#   --no-auto-update) bật gen-harness-update.timer (enabled + active, lần kế tiếp trong 24 giờ 31 phút, unit
#   mang --install-dir/--port/GEN_HARNESS_HOME/GENH_COMPOSE_FILE); chạy thật gen-harness-update.service (Result=
#   success, log có dòng mới, timer còn lịch — bắt ứng viên H-b); nút Console ghi yêu cầu TỪ container api và
#   gen-harness-update-request.path nhận; tệp yêu cầu không xoá được ⇒ GH-E94C, .path không kích lặp vô hạn;
#   timer bị tắt ⇒ genh update tự lành ("đã bật lại"); Sếp đã chủ động tắt ⇒ không tự lành. Đỏ ⇒ KHÔNG promote.
#
# Job `resolve` quyết định mọi thứ (mode, tag, có chạy E2E/promote không):
#   - workflow_run (workflow "Release" xong) → CHẾ ĐỘ "release": tìm tag trỏ
#     ĐÚNG commit Release vừa chạy (head_sha). Không có tag (lượt Release bỏ
#     qua vì VERSION không đổi) hoặc Release không success → không làm gì.
#     Có tag và còn là bản thử → E2E rồi promote.
#   - workflow_dispatch → CHẾ ĐỘ "release": `tag` (bỏ trống = bản chính thức
#     hiện tại), `promote` (E2E xanh thì nâng tag thành latest), `skip_e2e`
#     (promote tay BỎ QUA E2E — chỉ khi E2E lỗi vì lý do ngoài mã).
#   - pull_request/push đổi các đường dẫn ở `paths` dưới → CHẾ ĐỘ "pr":
#     build genh TỪ SOURCE (đúng commit đang xét, bắt lỗi code genh sớm),
#     trỏ genh vào deploy/compose.yaml của checkout (build ảnh cục bộ — bắt
#     lỗi ảnh api/web trước khi phát hành), lấy compose.release.yaml của BẢN
#     CHÍNH THỨC mới nhất (releases/latest) để nhúng vào binary — giống bước
#     "Ghim compose.yaml đã publish vào binary" của release.yml.
#
# LƯU Ý: workflow này LỌC ĐƯỜNG DẪN (paths) nên KHÔNG được làm required check
# trong branch protection — PR không chạm các đường dẫn đó sẽ treo "Expected"
# mãi. Required check duy nhất là job tổng ci-ok / installer-ok.
#
# THÀNH THẬT: ở e2e-install, bước "tạo dữ liệu mẫu" (mục 4 trong kế hoạch)
# vẫn best-effort và chỉ gọi được
# `POST /api/v1/setup/steps/1` (bước 1 của trình thiết lập 12 bước, xem
# apps/api/gh/setup/routes.py — bước này là DUY NHẤT không cần tài khoản
# Owner, chỉ cần setup_token) ở chế độ mode=sample — các bước 2 trở đi cần
# tạo tài khoản Owner + PIN + tổ chức thật, kết nối kênh Zalo bằng QR (không
# tự động hoá được trong CI, cần con người quét mã) nên KHÔNG làm ở đây, xem
# ghi chú ngay tại bước đó bên dưới.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag bản phát hành để kiểm (bỏ trống = bản chính thức mới nhất, releases/latest)"
        required: false
        type: string
      promote:
        description: "E2E xanh thì nâng tag này thành latest"
        required: false
        type: boolean
        default: false
      skip_e2e:
        description: "Promote tay, BỎ QUA E2E — chỉ dùng khi E2E lỗi vì lý do ngoài mã (GitHub/mạng); bắt buộc có tag và promote=true"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "apps/genh/**"
      - "apps/api/**"
      - "apps/browser/**"
      - "apps/bridge/**"
      - "apps/web/Dockerfile"
      - "deploy/**"
      - "deploy/images/**"
      - "install.sh"
      - "VERSION"
      - ".github/workflows/e2e-install.yml"
      - ".github/scripts/e2e_data.sh"
      - ".github/scripts/e2e_agy_box.sh"
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/genh/**"
      - "apps/api/**"
      - "apps/browser/**"
      - "apps/bridge/**"
      - "apps/web/Dockerfile"
      - "deploy/**"
      - "deploy/images/**"
      - "install.sh"
      - "VERSION"
      - ".github/workflows/e2e-install.yml"
      - ".github/scripts/e2e_data.sh"
      - ".github/scripts/e2e_agy_box.sh"

# Nhóm theo ĐÚNG đối tượng được kiểm: workflow_run theo commit Release
# (head_sha), dispatch theo tag, pr/push theo ref. Chỉ pr/push được huỷ lượt
# cũ — một lượt Release bỏ qua (skip=true, commit khác) chạy sau KHÔNG được
# huỷ nhầm E2E của bản thử đang kiểm.
concurrency:
  group: e2e-install-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # ── resolve ──────────────────────────────────────────────────────────────
  # Nguồn duy nhất cho mode (pr|release), tag cần kiểm, có chạy E2E không,
  # có promote không, và bản chính thức liền trước (prev_tag) cho e2e-upgrade.
  # Mọi giá trị do người/sự kiện đưa vào (inputs.*, workflow_run.*) chỉ đi
  # qua env — không nội suy ${{ }} thẳng vào shell.
  resolve:
    name: xác định chế độ, tag cần kiểm, có promote không
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.r.outputs.mode }}
      tag: ${{ steps.r.outputs.tag }}
      run_e2e: ${{ steps.r.outputs.run_e2e }}
      promote: ${{ steps.r.outputs.promote }}
      skip_e2e: ${{ steps.r.outputs.skip_e2e }}
      prev_tag: ${{ steps.r.outputs.prev_tag }}
      broken_install: ${{ steps.r.outputs.broken_install }}
      # Ma trận ô nâng cấp của e2e-upgrade (JSON): ô tags[1] (= prev_tag) và
      # ô tags[3] (khi có đủ 3 bản chính thức cũ hơn tag). "[]" khi không có.
      upgrade_from: ${{ steps.r.outputs.upgrade_from }}
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      IN_TAG: ${{ inputs.tag }}
      IN_PROMOTE: ${{ inputs.promote }}
      IN_SKIP_E2E: ${{ inputs.skip_e2e }}
    steps:
      - name: Lấy mã nguồn (cần remote origin cho git ls-remote)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Xác định chế độ, tag, run_e2e, promote, prev_tag, upgrade_from
        id: r
        run: |
          set -euo pipefail
          # Bản chính thức (latest) hiện tại; rỗng nếu repo chưa có (404).
          # Không dùng `$(… || true)`: khi lỗi HTTP, gh api vẫn in thân JSON
          # lỗi ra stdout.
          latest_official() {
            local t
            if t="$(gh api "repos/$R/releases/latest" --jq .tag_name 2>/dev/null)"; then printf '%s' "$t"; fi
          }
          # Tag trỏ đúng commit $1 (tag nhẹ: "<sha> refs/tags/vX"; tag có chú
          # thích: thêm dòng "<sha> refs/tags/vX^{}") — đọc từ stdin là đầu ra
          # `git ls-remote --tags origin`. Không có → rỗng. Ưu tiên tag KHÔNG
          # hậu tố: `sort -V` của GNU xếp v0.1.33-rc.1 SAU v0.1.33, nên nếu cả
          # hai cùng trỏ một commit mà lấy tail thì chọn nhầm bản -rc (không
          # bao giờ promote) và bản thật không được promote.
          tag_at_sha() {
            local all
            all="$(awk -v s="$1" '$1==s{print $2}' | sed -e 's#^refs/tags/##' -e 's#\^{}$##' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' || true; } | sort -uV)"
            if printf '%s\n' "$all" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              printf '%s\n' "$all" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tail -n1
            else
              printf '%s\n' "$all" | sed '/^$/d' | tail -n1
            fi
          }

          mode=release
          tag=""
          run_e2e=true
          promote=false
          skip_e2e=false
          case "$EVENT" in
            pull_request | push)
              mode="pr"
              tag="$(latest_official)"
              if [ -z "$tag" ]; then
                echo "::error::Chưa có bản chính thức (releases/latest) nào để lấy compose.release.yaml — cần phát hành và promote ít nhất một bản (merge PR tăng VERSION, chờ E2E xanh) trước khi chế độ pr kiểm được." >&2
                exit 1
              fi
              ;;
            workflow_run)
              if [ "$RUN_CONCLUSION" != "success" ]; then
                echo "Release kết thúc '$RUN_CONCLUSION' (không phải success) — không có bản thử mới để kiểm, bỏ qua."
                run_e2e=false
              else
                # ls-remote chạy riêng để lỗi mạng làm job ĐỎ (không lặng lẽ
                # coi như "không có tag" rồi bỏ qua E2E của bản thử thật).
                refs="$(git ls-remote --tags origin)"
                tag="$(printf '%s\n' "$refs" | tag_at_sha "$RUN_SHA")"
                if [ -z "$tag" ]; then
                  echo "không có bản phát hành mới ở $RUN_SHA — bỏ qua (lượt Release bỏ qua vì VERSION không đổi)."
                  run_e2e=false
                else
                  if ! info="$(gh release view "$tag" --repo "$R" --json isPrerelease,isDraft --jq '"\(.isPrerelease) \(.isDraft)"')"; then
                    echo "::error::Tag $tag trỏ đúng commit $RUN_SHA nhưng không có GitHub Release tương ứng — kiểm lại job release của lượt Release vừa chạy (log bước softprops/action-gh-release)." >&2
                    exit 1
                  fi
                  is_pre="${info%% *}"
                  is_draft="${info##* }"
                  if [ "$is_draft" = "true" ]; then
                    echo "::error::Release $tag đang là bản nháp (draft) — install.sh không tải được. Bỏ nháp (gh release edit $tag --draft=false) rồi chạy tay workflow này với tag=$tag, promote=true." >&2
                    exit 1
                  fi
                  case "$tag" in
                    *-*) echo "$tag có hậu tố '-' — chỉ kiểm, KHÔNG bao giờ promote thành bản chính thức." ;;
                    *) if [ "$is_pre" = "true" ]; then promote=true; fi ;;
                  esac
                  echo "bản thử: $tag (prerelease=$is_pre) ở commit $RUN_SHA"
                fi
              fi
              ;;
            workflow_dispatch)
              tag="$IN_TAG"
              if [ -z "$tag" ]; then
                tag="$(latest_official)"
              fi
              promote="${IN_PROMOTE:-false}"
              skip_e2e="${IN_SKIP_E2E:-false}"
              if [ "$skip_e2e" = "true" ]; then
                if [ -z "$IN_TAG" ] || [ "$promote" != "true" ]; then
                  echo "::error::skip_e2e=true bắt buộc nhập tag cụ thể VÀ bật promote=true — chạy lại workflow với đủ cả hai, hoặc tắt skip_e2e để chạy E2E bình thường." >&2
                  exit 1
                fi
                run_e2e=false
                echo "::warning::PROMOTE TAY — sẽ bỏ qua E2E cho $tag. Chỉ dùng khi E2E lỗi vì lý do ngoài mã (GitHub/mạng); ghi lại lý do vào HANDOFF."
              fi
              if [ -z "$tag" ]; then
                echo "::error::Chưa có bản chính thức (releases/latest) nào — nhập tag cụ thể ở ô 'tag' khi chạy tay." >&2
                exit 1
              fi
              if ! gh release view "$tag" --repo "$R" --json tagName >/dev/null; then
                echo "::error::Không tìm thấy GitHub Release '$tag' — kiểm lại tên tag (dạng vMAJOR.MINOR.PATCH, vd v0.1.33)." >&2
                exit 1
              fi
              ;;
            *)
              echo "::error::sự kiện '$EVENT' không được hỗ trợ" >&2
              exit 1
              ;;
          esac

          if [ -n "$tag" ] && ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag '$tag' không đúng định dạng vMAJOR.MINOR.PATCH[-PRERELEASE] — nhập lại tag đúng (vd v0.1.33)." >&2
            exit 1
          fi

          # tags = [$tag, cũ1, cũ2, cũ3] — các bản CHÍNH THỨC cũ hơn $tag (bỏ bản
          # nháp + bản thử), mới→cũ theo sort -V. prev_tag (cho e2e-selfupdate
          # và ô tags[1] của e2e-upgrade) = tags[1] = cũ1 — chính là bản máy Owner
          # đang chạy. Ô tags[3] = cũ3 — máy Owner tắt vài ngày, nhảy nhiều bản
          # một lần. Tính cả khi promote tay skip_e2e (run_e2e=false):
          # e2e-selfupdate sau promote vẫn cần prev_tag.
          # Các bản genh ≤ v0.1.8 cài từ binary phát hành KHÔNG ghi Caddyfile
          # (≤v0.1.7) hoặc đụng nhau khi chép volume agy_state (≤v0.1.8) → không
          # lên (Docker tạo thư mục rỗng thay tệp). Với các bản đó (tính RIÊNG
          # từng ô), bước cài bản cũ được phép đỏ; bước `genh update` phía sau
          # phải TỰ SỬA máy cài lỗi đó rồi ready xanh.
          is_broken() {
            case "$1" in
              v0.1.[0-8]) echo true ;;
              *) echo false ;;
            esac
          }
          prev=""
          broken=false
          old3=""
          upgrade_from="[]"
          if [ "$mode" = "release" ] && { [ "$run_e2e" = "true" ] || [ "$promote" = "true" ]; }; then
            official="$(gh release list --repo "$R" --exclude-drafts --exclude-pre-releases --limit 20 --json tagName --jq '.[].tagName')"
            older="$(for t in $official; do
              [ "$t" != "$tag" ] || continue
              if [ "$(printf '%s\n%s\n' "$t" "$tag" | sort -V | head -n1)" = "$t" ]; then
                printf '%s\n' "$t"
              fi
            done | sort -rV -u)"
            prev="$(printf '%s\n' "$older" | sed -n 1p)"
            old3="$(printf '%s\n' "$older" | sed -n 3p)"
            if [ -n "$prev" ]; then
              broken="$(is_broken "$prev")"
              if [ "$broken" = "true" ]; then
                echo "tags[1] $prev thuộc nhóm cài lỗi Caddyfile — kiểm đường tự sửa khi update"
              fi
              upgrade_from="$(jq -nc --arg f "$prev" --arg b "$broken" '[{from: $f, slot: "tags[1]", broken: $b}]')"
            else
              echo "chưa có bản chính thức nào cũ hơn $tag — e2e-upgrade sẽ bỏ qua."
            fi
            if [ -n "$old3" ]; then
              broken3="$(is_broken "$old3")"
              if [ "$broken3" = "true" ]; then
                echo "tags[3] $old3 thuộc nhóm cài lỗi Caddyfile — kiểm đường tự sửa khi update"
              fi
              upgrade_from="$(printf '%s' "$upgrade_from" | jq -c --arg f "$old3" --arg b "$broken3" '. + [{from: $f, slot: "tags[3]", broken: $b}]')"
            else
              echo "tags[3]: bỏ qua — chưa đủ 3 bản chính thức cũ hơn $tag" >>"$GITHUB_STEP_SUMMARY"
              echo "tags[3]: bỏ qua — chưa đủ 3 bản chính thức cũ hơn $tag"
            fi
          fi

          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "run_e2e=$run_e2e"
            echo "promote=$promote"
            echo "skip_e2e=$skip_e2e"
            echo "prev_tag=$prev"
            echo "broken_install=$broken"
            echo "upgrade_from=$upgrade_from"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### E2E cài đặt thật — quyết định"
            echo "| mode | tag | run_e2e | promote | skip_e2e | prev_tag (tags[1]) | tags[3] |"
            echo "|---|---|---|---|---|---|---|"
            echo "| $mode | ${tag:--} | $run_e2e | $promote | $skip_e2e | ${prev:--} | ${old3:--} |"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "mode=$mode tag=${tag:-<rỗng>} run_e2e=$run_e2e promote=$promote skip_e2e=$skip_e2e prev_tag=${prev:-<rỗng>} upgrade_from=$upgrade_from"

  # ── e2e-install ──────────────────────────────────────────────────────────
  # Luồng chính (mục 1-10 trong kế hoạch bàn giao): cài sạch, chờ ready,
  # status, dữ liệu mẫu (best-effort), backup, export/import, update,
  # auto-update enable/status/disable, uninstall — log docker compose luôn
  # in ra dù bước nào lỗi (if: always()).
  e2e-install:
    name: cài đặt thật đầu-cuối (chế độ ${{ needs.resolve.outputs.mode }}${{ needs.resolve.outputs.mode == 'release' && format(', {0}', needs.resolve.outputs.tag) || '' }})
    needs: resolve
    if: needs.resolve.outputs.run_e2e == 'true'
    runs-on: ubuntu-24.04
    # Chạy ngoài checkout repo: genh tìm compose.yaml theo cwd trước — trong repo
    # nó sẽ dùng deploy/compose.yaml (build cục bộ) thay vì compose bản phát hành
    # nhúng trong binary như máy người dùng thật.
    defaults:
      run:
        working-directory: /tmp
    timeout-minutes: 45
    env:
      # GEN_HARNESS_HOME KHÔNG đặt bằng ${{ runner.temp }} ở đây — "runner"
      # không nằm trong danh sách context cho phép ở `env:` cấp job (kiểm
      # bằng actionlint, xem contexts#context-availability) — đặt qua
      # $GITHUB_ENV ở bước đầu tiên bên dưới, đọc $RUNNER_TEMP (biến môi
      # trường runner luôn có sẵn, tương đương giá trị của context đó).
      GH_PORT: "8443"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      # pr: bản chính thức lấy compose.release.yaml; release: tag cài đặt.
      TAG: ${{ needs.resolve.outputs.tag }}
      MODE: ${{ needs.resolve.outputs.mode }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Đặt GEN_HARNESS_HOME (thư mục cài đặt tạm của job này)
        run: echo "GEN_HARNESS_HOME=$RUNNER_TEMP/gh" >>"$GITHUB_ENV"

      - name: (pr) Trỏ genh vào deploy/compose.yaml của checkout
        if: needs.resolve.outputs.mode == 'pr'
        # Chế độ pr kiểm CODE của PR, kể cả ảnh api/worker/web/bridge/db:
        # trỏ genh vào deploy/compose.yaml của checkout (build: cục bộ) thay
        # vì ảnh đã publish — nếu không, lỗi trong ảnh (vd thiếu thư viện
        # Python) chỉ lộ ra SAU khi đã phát hành.
        run: echo "GENH_COMPOSE_FILE=$GITHUB_WORKSPACE/deploy/compose.yaml" >>"$GITHUB_ENV"

      # ── Chế độ "pr": build genh từ source, ghim compose.release.yaml đã
      # publish của bản chính thức mới nhất (releases/latest) ────────────────
      - name: (pr) Cài Go
        if: needs.resolve.outputs.mode == 'pr'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24.0"

      - name: (pr) Tải deploy/compose.release.yaml của bản chính thức ${{ needs.resolve.outputs.tag }}
        if: needs.resolve.outputs.mode == 'pr'
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$R" \
            --pattern 'compose.release.yaml' --dir "${{ runner.temp }}/pinned" --clobber

      - name: (pr) Ghim compose.yaml đã publish vào binary (giống bước cùng tên ở release.yml)
        if: needs.resolve.outputs.mode == 'pr'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cp "${{ runner.temp }}/pinned/compose.release.yaml" apps/genh/internal/compose/embedded_compose.yaml
          echo "đã ghi đè embedded_compose.yaml bằng compose.release.yaml của $TAG (digest thật):"
          grep '^\s*image:' apps/genh/internal/compose/embedded_compose.yaml || true

      - name: (pr) Build genh từ mã nguồn đang xét
        if: needs.resolve.outputs.mode == 'pr'
        working-directory: ${{ github.workspace }}/apps/genh
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          # KHÔNG gắn -ldflags -X main.version=... ở đây — giữ mặc định "dev"
          # (xem cmd/genh/main.go, biến version) để internal/selfupdate CHỦ
          # ĐỘNG bỏ qua tự cập nhật binary (current=="dev" ⇒ Skipped, xem
          # apps/genh/internal/selfupdate/selfupdate.go dòng ~165) — build
          # tuỳ ý một chuỗi version giả (vd "e2e-pr-<sha>") sẽ đi vào nhánh
          # so sánh semver thật với bản mới nhất trên GitHub Releases, không
          # phải điều `genh update --yes` ở bước "đã mới nhất → phải không
          # lỗi" của chế độ pr muốn kiểm (chế độ pr kiểm CODE genh hiện tại,
          # không kiểm cơ chế tự tải binary — cơ chế đó đã có test riêng ở
          # apps/genh/internal/selfupdate và được chế độ "release" ở trên
          # dùng thật với version thật của binary đã publish).
          go build -trimpath -ldflags "-s -w" -o "${{ runner.temp }}/genh" ./cmd/genh
          echo "GENH=${{ runner.temp }}/genh" >>"$GITHUB_ENV"

      # ── Chế độ "release": tải install.sh + asset THẬT của ĐÚNG tag (thường
      # là bản thử vừa tạo), chạy y hệt người dùng thật (curl … | sh) ───────
      - name: (release) Tải install.sh của bản phát hành ${{ needs.resolve.outputs.tag }}
        if: needs.resolve.outputs.mode == 'release'
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$R" \
            --pattern 'install.sh' --dir "$RUNNER_TEMP" --clobber
          chmod +x "$RUNNER_TEMP/install.sh"

      - name: (release) Cài sạch bằng install.sh thật của ${{ needs.resolve.outputs.tag }} (không tương tác)
        if: needs.resolve.outputs.mode == 'release'
        run: |
          set -euo pipefail
          # install.sh (xem file gốc): phát hiện OS/kiến trúc, tải đúng asset
          # genh-linux-amd64 + checksums.txt, kiểm SHA-256. Mặc định nó tải từ
          # /releases/latest/download — bản thử (prerelease) KHÔNG nằm ở đó,
          # nên đặt GEN_HARNESS_RELEASE_TAG để install.sh tải ĐÚNG tag đang
          # kiểm (biến chỉ dành cho CI/E2E). install.sh không nhận cờ, tự
          # `exec genh install` KHÔNG kèm cờ nào (máy sạch → không có
          # secrets.json). Không cần TTY: genh install tự chuyển "chế độ
          # dòng" khi stdout không phải terminal (xem tui.IsTerminal,
          # apps/genh/cmd/genh/main.go hàm runInstall) — CI không có TTY nên
          # đây CHÍNH LÀ phép kiểm "genh install có chế độ không TTY" mà kế
          # hoạch bàn giao yêu cầu, không cần thêm cờ gì ở installer.sh.
          # Docker Engine đã có sẵn ≥24 trên ubuntu-24.04 nên Bước 2 (runtime)
          # tự bỏ qua (StatusSkipped) — không cần --yes cho sudo/UAC gì cả;
          # thứ duy nhất bị ảnh hưởng là CA nội bộ không được tự tin cậy vào
          # hệ điều hành (StatusWarn, không chặn cài đặt) — vì vậy các bước
          # `curl` sau này đều dùng `-k`.
          GEN_HARNESS_RELEASE_TAG="$TAG" "$RUNNER_TEMP/install.sh"
          echo "GENH=${GEN_HARNESS_HOME}/bin/genh" >>"$GITHUB_ENV"

      - name: (release) Kiểm genh vừa cài đúng tag ${{ needs.resolve.outputs.tag }}
        if: needs.resolve.outputs.mode == 'release'
        run: |
          set -euo pipefail
          out="$("$GENH" version)"
          echo "$out"
          # So khớp NGUYÊN từ (v0.1.3 không được khớp nhầm v0.1.33).
          case " $out " in
            *" $TAG "*) echo "OK: genh đã cài đúng $TAG" ;;
            *)
              echo "::error::genh vừa cài báo '$out', không phải $TAG — install.sh đã tải nhầm bản (kiểm GEN_HARNESS_RELEASE_TAG trong install.sh của $TAG và asset genh-linux-amd64 của Release)." >&2
              exit 1
              ;;
          esac

      - name: In phiên bản genh vừa cài
        run: "$GENH version"

      # ── (pr) genh install trực tiếp bằng binary vừa build — install.sh
      # không dùng ở chế độ này vì nó tải BẢN ĐÃ PUBLISH, không phải bản
      # đang review ──────────────────────────────────────────────────────────
      - name: (pr) Cài sạch không tương tác bằng genh build từ source
        if: needs.resolve.outputs.mode == 'pr'
        run: |
          set -euo pipefail
          "$GENH" install --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-auto-update

      - name: Chờ /api/v1/ready xanh (tối đa 5 phút)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /tmp/ready.json "https://localhost:${GH_PORT}/api/v1/ready"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::/api/v1/ready không xanh sau 5 phút" >&2
              exit 1
            fi
            sleep 3
          done
          cat /tmp/ready.json
          echo

      - name: genh status (kiểm mọi dịch vụ healthy)
        run: |
          set -euo pipefail
          "$GENH" status --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" | tee /tmp/genh-status.txt
          # RunStatus (internal/ops/status.go) không tự fail khi có service
          # không healthy (chỉ IN bảng) — kiểm tay ở đây: không được có
          # "unhealthy" hay "exited"/"restarting" trong bảng docker compose ps.
          if grep -Eiq 'unhealthy|exited|restarting' /tmp/genh-status.txt; then
            echo "::error::genh status thấy dịch vụ không healthy — xem bảng ở trên" >&2
            exit 1
          fi

      # v0.1.63: hộp riêng Antigravity — cài mới phải tự sinh gh_agy_key, agy-box healthy, và trong box không có khoá master/
      # DB/Redis, không thấy mạng lõi (script tự bỏ qua tag < v0.1.63 khi chạy tay cho bản cũ).
      - name: agy-box (v0.1.63+) — khoá tự sinh, healthy, cô lập
        run: bash "$GITHUB_WORKSPACE/.github/scripts/e2e_agy_box.sh"

      # v0.1.46 (F-27/F-21): cổng mặc định chỉ nghe 127.0.0.1; `genh remote` đổi chế độ. Chỉ kiểm khi genh có lệnh
      # `genh remote` (genh help) — chạy tay workflow cho tag cũ không bị đỏ vì tính năng bản đó chưa có.
      - name: genh có lệnh remote chưa (v0.1.46+)
        id: v146
        run: |
          set -euo pipefail
          if "$GENH" help 2>&1 | grep -q 'genh remote'; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "genh có lệnh remote — kiểm 2 chế độ cổng (local mặc định, lan)."
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::notice::genh chưa có lệnh remote (< v0.1.46) — bỏ qua các bước kiểm cổng."
          fi

      - name: Cổng mặc định chỉ nghe 127.0.0.1 (v0.1.46+)
        if: steps.v146.outputs.run == 'true'
        run: |
          set -euo pipefail
          # Thư mục compose THẬT genh dùng: pr ⇒ GENH_COMPOSE_FILE (deploy/ của checkout); release ⇒ $GEN_HARNESS_HOME/deploy.
          if [ -n "${GENH_COMPOSE_FILE:-}" ]; then cdir="$(dirname "$GENH_COMPOSE_FILE")"; cfile="$GENH_COMPOSE_FILE"; else cdir="$GEN_HARNESS_HOME/deploy"; cfile="$cdir/compose.yaml"; fi
          echo "compose genh dùng: $cfile ; .env: $cdir/.env"
          if [ "$MODE" = "pr" ]; then
            emb="$GITHUB_WORKSPACE/apps/genh/internal/compose/embedded_compose.yaml"
            if ! grep -q 'GH_BIND_ADDR' "$emb"; then
              echo "::notice::Bước '(pr) Ghim compose.yaml đã publish vào binary' ghi đè compose nhúng bằng compose.release.yaml của $TAG (chưa có GH_BIND_ADDR). Không sao vì GENH_COMPOSE_FILE trỏ deploy/compose.yaml của checkout — kiểm trên compose thật genh dùng."
            fi
          fi
          grep -q 'GH_BIND_ADDR' "$cfile" || { echo "::error::compose genh đang dùng ($cfile) không có GH_BIND_ADDR — genh chạy compose cũ, cổng không thể chỉ nghe 127.0.0.1." >&2; exit 1; }
          proxy="$(docker ps --format '{{.Names}}' --filter label=com.docker.compose.project=gen-harness --filter label=com.docker.compose.service=proxy | head -1)"
          [ -n "$proxy" ] || { echo "::error::không thấy container proxy đang chạy" >&2; exit 1; }
          bind="$(docker port "$proxy" 8443/tcp)"
          echo "docker port $proxy 8443/tcp:"; echo "$bind"
          [ -n "$bind" ] || { echo "::error::proxy không công bố cổng 8443" >&2; exit 1; }
          if echo "$bind" | grep -vq "^127\.0\.0\.1:${GH_PORT}\$"; then
            echo "::error::cổng proxy phải CHỈ là 127.0.0.1:${GH_PORT} (đang: $bind)" >&2; exit 1
          fi
          ss -ltnH "sport = :${GH_PORT}" | tee "$RUNNER_TEMP/ss-local.txt"
          [ -s "$RUNNER_TEMP/ss-local.txt" ] || { echo "::error::ss không thấy ai nghe cổng ${GH_PORT}" >&2; exit 1; }
          if awk '{print $4}' "$RUNNER_TEMP/ss-local.txt" | grep -Eq '^(0\.0\.0\.0|\*|\[::\]):'; then
            echo "::error::cổng ${GH_PORT} đang nghe trên 0.0.0.0/[::] — phải chỉ 127.0.0.1" >&2; exit 1
          fi
          ip="$(hostname -I | awk '{print $1}')"
          [ -n "$ip" ] || { echo "::error::không lấy được IP của runner" >&2; exit 1; }
          if curl -k -sS --max-time 10 -o /dev/null "https://$ip:${GH_PORT}/api/v1/ready"; then
            echo "::error::kết nối tới https://$ip:${GH_PORT} (IP mạng của runner) THÀNH CÔNG — cổng đang mở cho cả mạng" >&2; exit 1
          fi
          echo "OK: https://$ip:${GH_PORT} bị từ chối như mong đợi."
          envf="$cdir/.env"
          [ -f "$envf" ] || { echo "::error::không thấy $envf (genh phải ghi GH_BIND_ADDR/GH_ACCESS_MODE)" >&2; exit 1; }
          grep -E '^GH_(BIND_ADDR|ACCESS_MODE|SITE_ADDRESS|PUBLIC_URL)=' "$envf" || true
          grep -qx 'GH_BIND_ADDR=127.0.0.1' "$envf" || { echo "::error::$envf thiếu GH_BIND_ADDR=127.0.0.1" >&2; exit 1; }
          grep -qx 'GH_ACCESS_MODE=local' "$envf" || { echo "::error::$envf thiếu GH_ACCESS_MODE=local" >&2; exit 1; }
          curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"
          echo "OK: cài mới ở chế độ local — chỉ nghe 127.0.0.1, localhost vẫn ready."

      - name: Profile seccomp của browser nằm cạnh compose + nhịp tim có trường sandbox (F-85)
        if: steps.v146.outputs.run == 'true'
        run: |
          set -uo pipefail
          if [ -n "${GENH_COMPOSE_FILE:-}" ]; then cdir="$(dirname "$GENH_COMPOSE_FILE")"; else cdir="$GEN_HARNESS_HOME/deploy"; fi
          # Chế độ auto lùi êm khi runner chặn user namespace — KHÔNG đỏ vì sandbox; chỉ kiểm tệp profile là TỆP (không phải thư mục Docker tự tạo).
          if grep -q 'chromium-seccomp.json' "$cdir/compose.yaml" 2>/dev/null || grep -q 'chromium-seccomp.json' "${GENH_COMPOSE_FILE:-/dev/null}" 2>/dev/null; then
            [ -f "$cdir/browser/chromium-seccomp.json" ] || { echo "::error::compose có seccomp=chromium-seccomp.json nhưng $cdir/browser/chromium-seccomp.json không phải tệp" >&2; exit 1; }
            echo "OK: $cdir/browser/chromium-seccomp.json có mặt"
          else
            echo "::notice::compose đang dùng chưa có profile seccomp (< v0.1.47) — bỏ qua."
          fi
          rc="$(docker ps --format '{{.Names}}' --filter label=com.docker.compose.project=gen-harness --filter label=com.docker.compose.service=browser-redis | head -1)"
          if [ -n "$rc" ]; then
            hb="$(docker exec "$rc" redis-cli get gh:browser:heartbeat 2>/dev/null || true)"
            echo "::notice::nhịp tim browser: ${hb:-<chưa có>}"
          fi
          exit 0

      # Mặc định `genh remote lan` (không --name) tự dò IPv4 LAN và đặt GH_SITE_ADDRESS = IP đó. Trình duyệt mở bằng IP
      # KHÔNG gửi SNI — curl cũng vậy khi URL là IP và không có --resolve: kiểm đúng đường điện thoại đi (Caddyfile cần
      # default_sni, genh phải bỏ qua docker0/br-*/veth*/virbr*).
      - name: genh remote lan (không --name) → mở bằng IP tự dò, không SNI (v0.1.46+)
        if: steps.v146.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ -n "${GENH_COMPOSE_FILE:-}" ]; then cdir="$(dirname "$GENH_COMPOSE_FILE")"; else cdir="$GEN_HARNESS_HOME/deploy"; fi
          "$GENH" remote lan --yes --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          ip="$(sed -n 's/^GH_SITE_ADDRESS=//p' "$cdir/.env" | tail -1)"
          echo "IP genh tự dò: $ip"
          echo "$ip" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::GH_SITE_ADDRESS sau remote lan không phải IPv4 ('$ip')" >&2; exit 1; }
          case "$ip" in 172.17.*) echo "::error::genh chọn nhầm IP docker0 ($ip)" >&2; exit 1 ;; esac
          code=""
          for _ in $(seq 1 20); do
            code="$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://${ip}:${GH_PORT}/api/v1/ready" || true)"
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { echo "::error::https://${ip}:${GH_PORT}/api/v1/ready (không SNI) trả '$code' (cần 200 — Caddyfile thiếu default_sni?)" >&2; exit 1; }
          echo "OK: remote lan không --name — mở bằng IP $ip (không SNI) vẫn ready."

      - name: genh remote --lan → 0.0.0.0 và vẫn qua ready (v0.1.46+)
        if: steps.v146.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ -n "${GENH_COMPOSE_FILE:-}" ]; then cdir="$(dirname "$GENH_COMPOSE_FILE")"; else cdir="$GEN_HARNESS_HOME/deploy"; fi
          "$GENH" remote --lan --name gh-e2e.local --yes --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          proxy="$(docker ps --format '{{.Names}}' --filter label=com.docker.compose.project=gen-harness --filter label=com.docker.compose.service=proxy | head -1)"
          bind="$(docker port "$proxy" 8443/tcp)"
          echo "$bind"
          echo "$bind" | grep -q "^0\.0\.0\.0:${GH_PORT}\$" || { echo "::error::sau remote --lan proxy phải nghe 0.0.0.0:${GH_PORT} (đang: $bind)" >&2; exit 1; }
          ip="$(hostname -I | awk '{print $1}')"
          [ -n "$ip" ] || { echo "::error::không lấy được IP của runner" >&2; exit 1; }
          code=""
          for _ in $(seq 1 20); do
            code="$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 10 --resolve "gh-e2e.local:${GH_PORT}:$ip" "https://gh-e2e.local:${GH_PORT}/api/v1/ready" || true)"
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { echo "::error::https://gh-e2e.local:${GH_PORT}/api/v1/ready trả '$code' (cần 200)" >&2; exit 1; }
          code="$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://localhost:${GH_PORT}/api/v1/ready" || true)"
          [ "$code" = "200" ] || { echo "::error::https://localhost:${GH_PORT}/api/v1/ready trả '$code' sau khi đặt GH_SITE_ADDRESS (cần 200 — Caddyfile phải giữ localhost)" >&2; exit 1; }
          python3 - "$GEN_HARNESS_HOME/run/network-status.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          print(d)
          assert d.get("mode") == "lan", "network-status.json mode=%r (cần lan)" % d.get("mode")
          assert d.get("bind_addr") == "0.0.0.0", "bind_addr=%r" % d.get("bind_addr")
          PY
          envf="$cdir/.env"
          grep -E '^GH_(BIND_ADDR|ACCESS_MODE|SITE_ADDRESS|PUBLIC_URL)=' "$envf" || true
          grep -qx 'GH_SITE_ADDRESS=gh-e2e.local' "$envf" || { echo "::error::$envf thiếu GH_SITE_ADDRESS=gh-e2e.local" >&2; exit 1; }
          grep -qx "GH_PUBLIC_URL=https://gh-e2e.local:${GH_PORT}" "$envf" || { echo "::error::$envf thiếu GH_PUBLIC_URL=https://gh-e2e.local:${GH_PORT}" >&2; exit 1; }
          pub=""
          for _ in $(seq 1 20); do
            api="$(docker ps --format '{{.Names}}' --filter label=com.docker.compose.project=gen-harness --filter label=com.docker.compose.service=api | head -1)"
            pub="$(docker exec "$api" printenv GH_PUBLIC_URL 2>/dev/null || true)"
            [ "$pub" = "https://gh-e2e.local:${GH_PORT}" ] && break
            sleep 3
          done
          [ "$pub" = "https://gh-e2e.local:${GH_PORT}" ] || { echo "::error::api chưa thấy GH_PUBLIC_URL mới (đang: '$pub')" >&2; exit 1; }
          echo "::notice::GH_SITE_ADDRESS=gh-e2e.local được GIỮ NGUYÊN cho các bước sau (genh update --yes, Cập nhật ngay, Khôi phục, gói chẩn đoán): chứng minh tự cập nhật vẫn xanh khi đã đặt GH_SITE_ADDRESS."
          echo "OK: chế độ lan — 0.0.0.0, ready qua gh-e2e.local và localhost, api thấy GH_PUBLIC_URL."

      # v0.1.45 (F-52): hộp thư run/ (+ run/request) phải là 2770 nhóm 10001 (chỉ genh + api ghi được), không còn 0777.
      # Chỉ kiểm khi genh.json có run_mode (genh v0.1.45+) — chạy tay workflow cho tag cũ không bị đỏ. Các bước
      # "Cập nhật ngay" / "Khôi phục" / "Gói chẩn đoán" phía sau kiểm genh vẫn nhận yêu cầu do api ghi.
      - name: Hộp thư run/ 2770 nhóm 10001 (v0.1.45+)
        run: |
          set -euo pipefail
          run="$GEN_HARNESS_HOME/run"
          mode="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('run_mode',''))" "$run/genh.json")"
          if [ -z "$mode" ]; then
            echo "::notice::genh chưa ghi run_mode (< v0.1.45) — bỏ qua."
            exit 0
          fi
          for d in "$run" "$run/request"; do
            perm="$(stat -c %a "$d")"; grp="$(stat -c %g "$d")"
            echo "$d: quyền $perm, nhóm $grp"
            if [ "$perm" != "2770" ] || [ "$grp" != "10001" ]; then
              ls -la "$run"
              echo "::error::$d phải là 2770 nhóm 10001 (đang $perm nhóm $grp, run_mode=$mode)" >&2
              exit 1
            fi
          done
          [ "$mode" = "restricted" ] || { echo "::error::run_mode=$mode, cần restricted" >&2; exit 1; }

      # v0.1.44 (F-6b/F-4b): trực canh máy chủ + gói chẩn đoán qua hộp thư. Chỉ chạy khi genh có lệnh
      # `watchdog` (genh help) — chạy tay workflow cho tag cũ không bị đỏ vì tính năng bản đó chưa có.
      - name: genh có trực canh máy chủ chưa (v0.1.44+)
        id: v144
        run: |
          set -euo pipefail
          if "$GENH" help 2>&1 | grep watchdog >/dev/null; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "genh có lệnh watchdog — kiểm trực canh máy chủ + gói chẩn đoán."
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::notice::genh chưa có trực canh máy chủ (< v0.1.44) — bỏ qua."
          fi

      - name: Trực canh máy chủ (v0.1.44+)
        if: steps.v144.outputs.run == 'true'
        run: |
          set -euo pipefail
          run="$GEN_HARNESS_HOME/run"
          st="$run/watchdog-status.json"
          python3 - "$run/genh.json" <<'PY'
          import json, sys
          i = json.load(open(sys.argv[1], encoding="utf-8"))
          assert "watchdog" in (i.get("requests") or []), "genh.json thiếu 'watchdog' trong requests: %s" % i
          PY
          # Lịch trực canh đã cài (systemd --user timer, hoặc crontab khi runner không có systemd --user).
          if systemctl --user is-enabled gen-harness-watchdog.timer >/dev/null 2>&1; then
            echo "lịch trực canh: systemd --user timer"
          elif crontab -l 2>/dev/null | grep gen-harness-watchdog >/dev/null; then
            echo "lịch trực canh: crontab"
          else
            echo "::error::genh install không cài lịch trực canh máy chủ (gen-harness-watchdog)" >&2; exit 1
          fi
          "$GENH" watchdog status --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          # Tắt lịch trong lúc kiểm để lượt tự động không chen ngang (bật lại khi xong); chờ lượt đang chạy (nếu có) xong.
          "$GENH" watchdog disable --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          # Bot API giả (không cần Telegram thật): ghi mọi POST ra tệp, luôn trả ok.
          cat >"$RUNNER_TEMP/tg_fake.py" <<'PY'
          import http.server, sys
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get("Content-Length") or 0)
                  self.rfile.read(n)
                  with open(sys.argv[2], "a", encoding="utf-8") as f:
                      f.write(self.path.split("/bot")[0] + "/bot***/sendMessage\n")
                  self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers()
                  self.wfile.write(b'{"ok":true,"result":{}}')
              def log_message(self, *a):
                  pass
          http.server.HTTPServer(("127.0.0.1", int(sys.argv[1])), H).serve_forever()
          PY
          python3 "$RUNNER_TEMP/tg_fake.py" 18765 "$RUNNER_TEMP/tg_posts.txt" &
          tgpid=$!
          cleanup() {
            kill "$tgpid" 2>/dev/null || true
            "$GENH" watchdog enable --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          export GENH_TELEGRAM_API_BASE=http://127.0.0.1:18765
          wd() {
            flock -w 300 "$GEN_HARNESS_HOME/watchdog.lock" true
            "$GENH" doctor --notify --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          }
          check() { # $1 = mốc giây unix trước lượt chạy; in incidents
            python3 - "$st" "$1" "$run/telegram.json" <<'PY'
          import json, os, sys, datetime
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          for k in ("schema", "last_run_at", "state", "incidents", "telegram", "telegram_error_code", "last_sent_at", "schedule", "test"):
              assert k in d, "watchdog-status.json thiếu khoá %r: %s" % (k, d)
          at = datetime.datetime.fromisoformat(d["last_run_at"].replace("Z", "+00:00")).timestamp()
          assert at >= float(sys.argv[2]) - 1, "last_run_at không mới: %s" % d["last_run_at"]
          if not os.path.exists(sys.argv[3]):
              assert d["telegram"] == "not_configured", "chưa cấu hình Telegram mà telegram=%r" % d["telegram"]
          print("state=%s telegram=%s incidents=%s" % (d["state"], d["telegram"], [i["key"] for i in d["incidents"]]))
          PY
          }
          # Lượt 1: máy khoẻ.
          t0=$(date -u +%s); wd; check "$t0"
          # Lượt 2: dừng api ⇒ api.down + tự khởi động lại api.
          api="$(docker ps --format '{{.Names}}' | grep -E '^gen-harness-api-[0-9]+$' | head -1)"
          [ -n "$api" ] || { echo "::error::không thấy container api" >&2; exit 1; }
          docker stop "$api" >/dev/null
          t1=$(date -u +%s); wd; check "$t1"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); ks=[i['key'] for i in d['incidents']]; assert 'api.down' in ks, 'api dừng mà không có api.down: %s' % ks" "$st"
          [ "$(docker inspect -f '{{.State.Running}}' "$api")" = "true" ] \
            || { echo "::error::trực canh không tự khởi động lại api" >&2; docker ps -a; exit 1; }
          echo "OK: api.down được ghi nhận và api đã tự khởi động lại."
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::/api/v1/ready không xanh lại sau khi trực canh khởi động lại api" >&2; exit 1; }
            sleep 3
          done
          # Lượt 3: đã ổn ⇒ không còn sự cố genh đo (api.down/docker.down/service.unhealthy:*).
          t2=$(date -u +%s); wd; check "$t2"
          python3 - "$st" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          bad = [i["key"] for i in d["incidents"] if i["key"] in ("api.down", "docker.down") or i["key"].startswith("service.unhealthy:")]
          assert not bad, "lượt sau khi api lên lại vẫn còn sự cố: %s" % bad
          other = [i["key"] for i in d["incidents"]]
          if other:
              print("::notice::sự cố khác đang mở (không do bước này): %s" % other)
          PY
          if [ -f "$run/telegram.json" ]; then
            echo "Bot API giả nhận $(wc -l <"$RUNNER_TEMP/tg_posts.txt" 2>/dev/null || echo 0) POST."
          else
            echo "Telegram chưa cấu hình — bỏ qua phần gửi tin (đã kiểm telegram=not_configured)."
          fi

      # v0.1.38 (F-22): phiên Claude Code ở volume claude_state riêng (/var/lib/gh/claude/.claude), không còn trong HOME
      # của Antigravity CLI (/var/lib/gh/agy, agy_state); agy chạy cô lập (canary offline phải "khong_lo").
      # v0.1.62: agy được mở cho mọi vai (Owner chọn 16/10/2026) nên phép thử cô lập này càng phải giữ — agy cùng container với khoá.
      - name: Cô lập agy — canary offline (F-22)
        run: |
          set -euo pipefail
          if [ "$MODE" != "pr" ]; then
            have="$("$GENH" version | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*' | head -n1 || true)"
            have="${have:-$TAG}"
            if [ "$(printf '%s\n%s\n' v0.1.38 "$have" | sort -V | head -n1)" != "v0.1.38" ]; then
              echo "::notice::$have cũ hơn v0.1.38 — chưa có volume claude_state / agy_canary, bỏ qua."; exit 0
            fi
          fi
          api="$(docker ps --format '{{.Names}}' | grep -E '^gen-harness-api-[0-9]+$' | head -1)"
          [ -n "$api" ] || { echo "::error::không thấy container api" >&2; exit 1; }
          docker exec "$api" sh -c 'test ! -e /var/lib/gh/agy/claude && test -d /var/lib/gh/claude/.claude' \
            || { echo "::error::phiên Claude Code vẫn nằm trong HOME của Antigravity CLI (/var/lib/gh/agy/claude) hoặc thiếu /var/lib/gh/claude/.claude (F-22)" >&2; exit 1; }
          echo "OK: /var/lib/gh/agy/claude không có, /var/lib/gh/claude/.claude có."
          # Canary offline (python -m gh.providers.agy_canary — hợp đồng do gói agy-co-lap-api viết): in ĐÚNG một dòng
          # JSON {result, checks, agy_version}; chỉ in lại result/checks/agy_version — không bao giờ in đầu ra agy thô.
          rc=0
          docker exec "$api" python -m gh.providers.agy_canary --offline >"$RUNNER_TEMP/agy-canary.json" 2>/dev/null || rc=$?
          python3 - "$RUNNER_TEMP/agy-canary.json" "$rc" <<'PY'
          import json, sys
          lines = [x for x in open(sys.argv[1], encoding="utf-8").read().splitlines() if x.strip()]
          try:
              d = json.loads(lines[-1]) if lines else {}
          except ValueError:
              d = {}
          d = d if isinstance(d, dict) else {}
          res = d.get("result")
          print("agy canary offline: result=%s rc=%s agy_version=%s" % (res, sys.argv[2], d.get("agy_version")))
          print("checks: %s" % json.dumps(d.get("checks"), ensure_ascii=False))
          if res != "khong_lo":
              print("::error::canary offline của Antigravity CLI báo %r (cần khong_lo) — agy có thể đọc bí mật/phiên Claude." % res,
                    file=sys.stderr)
              sys.exit(1)
          PY

      # v0.1.37 (F-34/F-73): hai bước dưới kiểm hành vi chỉ có từ genh v0.1.37.
      # Chế độ pr: genh build từ mã đang xét ⇒ luôn chạy. Chế độ release: chỉ
      # chạy khi genh vừa cài ≥ v0.1.37 (so sort -V) — chạy tay workflow cho
      # tag cũ hơn không bị đỏ vì tính năng bản đó chưa có.
      - name: genh có khoá loại trừ + tự chạy lại khi bật máy chưa (v0.1.37+)
        id: v137
        run: |
          set -euo pipefail
          if [ "$MODE" = "pr" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "chế độ pr — genh build từ mã đang xét, kiểm khoá loại trừ + tự chạy lại khi bật máy."
            exit 0
          fi
          out="$("$GENH" version)"
          have="$(printf '%s\n' "$out" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*' | head -n1 || true)"
          have="${have:-$TAG}"
          if [ "$(printf '%s\n%s\n' v0.1.37 "$have" | sort -V | head -n1)" = "v0.1.37" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "genh $have ≥ v0.1.37 — kiểm khoá loại trừ + tự chạy lại khi bật máy."
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::notice::genh $have cũ hơn v0.1.37 — bỏ qua kiểm khoá loại trừ và tự chạy lại khi bật máy."
          fi

      - name: Khoá loại trừ — genh update khi lần khác đang giữ khoá phải thoát 0, không đụng update-status.json
        if: steps.v137.outputs.run == 'true'
        run: |
          set -euo pipefail
          # Khoá ở <gốc cài>/genh.lock (KHÔNG ở run/ — run/ bind-mount vào container
          # api). util-linux flock dùng flock(2) như genh. -o: tiến trình flock giữ
          # khoá, lệnh con (sleep) không giữ fd ⇒ kill flock là nhả khoá ngay.
          lock="$GEN_HARNESS_HOME/genh.lock"
          st="$GEN_HARNESS_HOME/run/update-status.json"
          flock -o "$lock" sleep 60 &
          fpid=$!
          stop_lock() { pkill -P "$fpid" 2>/dev/null || true; kill "$fpid" 2>/dev/null || true; }
          trap stop_lock EXIT
          # Chờ flock nền thật sự giữ khoá (thăm dò không chặn bằng fd riêng).
          held=false
          for _ in $(seq 1 100); do
            if ! flock -n "$lock" true; then held=true; break; fi
            sleep 0.1
          done
          [ "$held" = true ] || { echo "::error::không giữ được $lock để giả lập lần cập nhật khác" >&2; exit 1; }
          if [ -f "$st" ]; then before="$(sha256sum <"$st")"; else before="(không có)"; fi
          rc=0
          timeout 50 "$GENH" update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-self-update \
            >"$RUNNER_TEMP/update-locked.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/update-locked.log"
          if [ "$rc" != 0 ]; then
            echo "::error::khoá đang bị giữ mà genh update thoát $rc (124 = treo chờ khoá) — phải thoát 0 và bỏ qua (lịch đêm bận ⇒ không báo lỗi)." >&2
            exit 1
          fi
          if ! grep -q "đang có một lần cập nhật/khôi phục khác chạy" "$RUNNER_TEMP/update-locked.log"; then
            echo "::error::khoá đang bị giữ mà genh update không in \"đang có một lần cập nhật/khôi phục khác chạy\" — có thể hai genh cùng cập nhật một máy." >&2
            exit 1
          fi
          if [ -f "$st" ]; then after="$(sha256sum <"$st")"; else after="(không có)"; fi
          if [ "$after" != "$before" ]; then
            echo "::error::genh bị khoá loại trừ chặn mà vẫn ghi run/update-status.json — Console sẽ hiện sai trạng thái của lần đang chạy." >&2
            exit 1
          fi
          stop_lock
          wait "$fpid" 2>/dev/null || true
          trap - EXIT
          flock -w 10 "$lock" true || { echo "::error::khoá $lock không được nhả sau khi dừng tiến trình giữ khoá" >&2; exit 1; }
          echo "OK: khoá loại trừ chặn lần cập nhật thứ hai (thoát 0, update-status.json không đổi)."

      - name: Tự chạy lại khi bật máy — genh status ghi run/autostart-status.json đúng hợp đồng
        if: steps.v137.outputs.run == 'true'
        run: |
          set -euo pipefail
          "$GENH" status --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          f="$GEN_HARNESS_HOME/run/autostart-status.json"
          [ -s "$f" ] || { echo "::error::genh status không ghi $f — Console không biết máy có tự chạy lại khi bật máy không." >&2; exit 1; }
          cat "$f"; echo
          # Chỉ kiểm hình dạng; giá trị linger/docker_enabled phụ thuộc cấu hình
          # runner nên chỉ in ra, không đỏ.
          python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          assert isinstance(d, dict), "autostart-status.json không phải object JSON"
          keys = ("os", "linger", "linger_required", "docker_enabled", "docker_mode", "checked_at")
          missing = [k for k in keys if k not in d]
          assert not missing, "autostart-status.json thiếu khoá: %s" % missing
          assert d["os"] == "linux", "os phải là linux trên ubuntu, có %r" % d["os"]
          assert isinstance(d["linger_required"], bool), "linger_required phải là bool"
          assert d["linger"] in ("yes", "no", "unknown", "not_applicable"), "linger lạ: %r" % d["linger"]
          assert d["docker_enabled"] in ("yes", "no", "unknown"), "docker_enabled lạ trên ubuntu: %r" % d["docker_enabled"]
          assert d["docker_mode"] in ("system", "rootless", "desktop", "unknown"), "docker_mode lạ: %r" % d["docker_mode"]
          assert isinstance(d["checked_at"], str) and d["checked_at"], "checked_at rỗng"
          print("tự chạy lại khi bật máy: linger=%s (cần: %s), docker_enabled=%s, docker_mode=%s"
                % (d["linger"], d["linger_required"], d["docker_enabled"], d["docker_mode"]))
          PY

      - name: Dữ liệu mẫu tối thiểu — best-effort, xem ghi chú đầu file
        continue-on-error: true
        run: |
          set -euo pipefail
          token="$(python3 -c "import json;print(json.load(open('${GEN_HARNESS_HOME}/config/secrets.json'))['setup_token'])")"
          curl -k -fsS -X POST "https://localhost:${GH_PORT}/api/v1/setup/steps/1" \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"${token}\",\"language\":\"vi\",\"mode\":\"sample\"}" \
            && echo "OK: bước 1/12 (mode=sample) đã gọi được — dữ liệu mẫu (nếu có) do backend tự sinh." \
            || echo "BỎ QUA: bước 1/12 gọi lỗi hoặc backend chưa hỗ trợ tạo mẫu qua API — không chặn CI (xem ghi chú đầu workflow, các bước 2-12 cần tài khoản Owner + QR Zalo, không tự động hoá được)."

      - name: genh backup
        run: $GENH backup --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"

      - name: genh export → genh import (bọc lại chính bản export)
        env:
          GH_BUNDLE_PASSWORD: e2e-install-test-password-not-a-secret
        run: |
          set -euo pipefail
          "$GENH" export --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --to "${{ runner.temp }}/p.ghbundle"
          ls -la "${{ runner.temp }}/p.ghbundle"
          # QUAN TRỌNG: mọi cờ (--install-dir/--port/--yes) PHẢI đứng TRƯỚC
          # đường dẫn tệp — package "flag" của Go dừng phân tích cờ ở đối số
          # KHÔNG-CỜ đầu tiên (xem cmd/genh/main.go hàm runImport, fs.NArg()
          # != 1 sẽ báo lỗi cách dùng nếu đặt --yes sau đường dẫn tệp).
          "$GENH" import --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes "${{ runner.temp }}/p.ghbundle"

      - name: Chờ /api/v1/ready xanh lại sau import (tối đa 5 phút)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::/api/v1/ready không xanh lại sau import" >&2
              exit 1
            fi
            sleep 3
          done

      - name: genh update --yes (đã mới nhất → phải không lỗi)
        # Chế độ release: genh đang là bản thử, releases/latest (bản chính thức)
        # CŨ hơn → selfupdate không hạ cấp (IsNewer=false), chỉ chạy phần dịch vụ.
        # v0.1.34 (F-10/F-11): compose genh quản lý đã khớp thì genh phải in
        # "không cần cập nhật" và KHÔNG sao lưu, KHÔNG tải ảnh (docker events
        # type=image pull). Chế độ pr: GENH_COMPOSE_FILE trỏ tệp NGOÀI — genh
        # không biết tệp đó đã dựng lên chưa nên PHẢI chạy đủ đường cập nhật
        # (gõ tay / "Cập nhật ngay" trên bản cài kiểu này không được im lặng).
        run: |
          set -euo pipefail
          data="$GITHUB_WORKSPACE/.github/scripts/e2e_data.sh"
          t0="$(date +%s)"
          n0="$("$data" backups)"
          echo "trước update: $n0 bản sao lưu, mốc t0=$t0"
          "$GENH" update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes 2>&1 | tee "$RUNNER_TEMP/update-noop.log"
          if [ "$MODE" = "pr" ]; then
            if grep -q "không cần cập nhật" "$RUNNER_TEMP/update-noop.log" || ! grep -q "Cập nhật xong" "$RUNNER_TEMP/update-noop.log"; then
              echo "::error::GENH_COMPOSE_FILE (compose ngoài) mà genh update không chạy đủ đường cập nhật (thiếu \"Cập nhật xong\") — gõ tay/\"Cập nhật ngay\" trên bản cài kiểu này sẽ không làm gì." >&2
              exit 1
            fi
            echo "OK: compose ngoài — genh chạy đủ đường cập nhật."
            exit 0
          fi
          if ! grep -q "không cần cập nhật" "$RUNNER_TEMP/update-noop.log"; then
            echo "::error::đã mới nhất mà genh update không in \"không cần cập nhật\" — genh vẫn chạy đường cập nhật đầy đủ (sao lưu/tải ảnh) mỗi đêm." >&2
            exit 1
          fi
          n1="$("$data" backups)"
          if [ "$n1" != "$n0" ]; then
            echo "::error::đã mới nhất mà genh update vẫn tạo bản sao lưu ($n0 → $n1) — tốn đĩa mỗi đêm vô ích." >&2
            exit 1
          fi
          pulls="$("$data" pulls-since "$t0")"
          if [ "$pulls" != "0" ]; then
            echo "::error::đã mới nhất mà genh update vẫn tải bản mới ($pulls lượt docker pull) — phải dừng trước khi tải." >&2
            exit 1
          fi
          echo "OK: đã mới nhất — không sao lưu ($n1 bản), không tải ảnh."

      - name: Nút "Cập nhật ngay" — api ghi yêu cầu, genh trên máy chủ tự nhận và cập nhật (tối đa 7 phút)
        run: |
          set -euo pipefail
          run="$GEN_HARNESS_HOME/run"
          cat "$run/genh.json"
          python3 -c "import json,sys; i=json.load(open(sys.argv[1])); assert i['updater'], 'genh chưa cài watcher nhận yêu cầu: %s' % i" "$run/genh.json"
          before="$(python3 -c "import json;print(json.load(open('$run/update-status.json')).get('started_at',''))" 2>/dev/null || true)"
          api="$(docker ps --format '{{.Names}}' | grep -E '^gen-harness-api-[0-9]+$' | head -1)"
          # Chính container api (uid 10001, khác người dùng máy chủ) ghi yêu cầu qua bind mount — đúng đường nút bấm
          # trong Console đi (gh/system_api/update.py).
          docker exec "$api" python -c "import json,datetime; open('/var/lib/gh/host/request/update.json','w').write(json.dumps({'requested_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}))"
          deadline=$((SECONDS + 420))
          while :; do
            st="$(python3 -c "import json;d=json.load(open('$run/update-status.json'));print(d.get('state',''), d.get('started_at',''))" 2>/dev/null || true)"
            state="${st%% *}"; started="${st#* }"
            if [ "$started" != "$before" ] && [ "$state" = "done" ] && [ ! -e "$run/request/update.json" ]; then break; fi
            if [ "$started" != "$before" ] && [ "$state" = failed ]; then
              cat "$run/update-status.json"; echo "::error::genh báo cập nhật lỗi" >&2; exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              ls -la "$run" "$run/request"; cat "$run/update-status.json" || true
              echo "::error::watcher trên máy chủ không nhận yêu cầu cập nhật trong 7 phút" >&2; exit 1
            fi
            sleep 5
          done
          cat "$run/update-status.json"
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do sleep 3; done

      - name: Nút "Khôi phục" — api ghi request/restore.json, genh trên máy chủ tự khôi phục (tối đa 7 phút)
        run: |
          set -euo pipefail
          run="$GEN_HARNESS_HOME/run"
          python3 -c "import json,sys; i=json.load(open(sys.argv[1])); assert 'restore' in (i.get('requests') or []), 'watcher chưa nhận yêu cầu khôi phục: %s' % i" "$run/genh.json"
          api="$(docker ps --format '{{.Names}}' | grep -E '^gen-harness-api-[0-9]+$' | head -1)"
          key="$(docker exec "$api" python -c "import asyncio; from gh.backup import list_backups; print(asyncio.run(list_backups())[0].key)")"
          echo "khôi phục $key"
          # Như nút trong Console (gh/system_api/backups.py): container api ghi yêu cầu qua bind mount.
          docker exec "$api" python -c "import json,sys,datetime; open('/var/lib/gh/host/request/restore.json','w').write(json.dumps({'key': sys.argv[1], 'requested_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}))" "$key"
          deadline=$((SECONDS + 420))
          while :; do
            st="$(python3 -c "import json;d=json.load(open('$run/restore-status.json'));print(d.get('state',''), d.get('key',''))" 2>/dev/null || true)"
            state="${st%% *}"; got="${st#* }"
            if [ "$got" = "$key" ] && [ "$state" = "done" ] && [ ! -e "$run/request/restore.json" ]; then break; fi
            if [ "$got" = "$key" ] && [ "$state" = failed ]; then
              cat "$run/restore-status.json"; echo "::error::genh báo khôi phục lỗi" >&2; exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              ls -la "$run" "$run/request"; cat "$run/restore-status.json" || true
              echo "::error::watcher trên máy chủ không khôi phục trong 7 phút" >&2; exit 1
            fi
            sleep 5
          done
          cat "$run/restore-status.json"
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do sleep 3; done

      - name: Gói chẩn đoán qua hộp thư — không chứa bí mật (v0.1.44+, tối đa 5 phút)
        if: steps.v144.outputs.run == 'true'
        run: |
          set -euo pipefail
          run="$GEN_HARNESS_HOME/run"
          python3 -c "import json,sys; i=json.load(open(sys.argv[1])); assert 'doctor' in (i.get('requests') or []), 'genh.json thiếu doctor trong requests: %s' % i" "$run/genh.json"
          api="$(docker ps --format '{{.Names}}' | grep -E '^gen-harness-api-[0-9]+$' | head -1)"
          # Như nút "Gói chẩn đoán" trong Console: chính container api ghi yêu cầu qua bind mount.
          docker exec "$api" python -c "import json,datetime; open('/var/lib/gh/host/request/doctor.json','w').write(json.dumps({'schema': 1, 'request_id': '0123456789abcdef', 'requested_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}))"
          deadline=$((SECONDS + 300))
          while :; do
            st="$(python3 -c "import json;d=json.load(open('$run/doctor-status.json'));print(d.get('state',''), d.get('request_id',''))" 2>/dev/null || true)"
            state="${st%% *}"; rid="${st#* }"
            if [ "$rid" = "0123456789abcdef" ] && [ "$state" = "done" ]; then break; fi
            if [ "$rid" = "0123456789abcdef" ] && [ "$state" = "failed" ]; then
              cat "$run/doctor-status.json"; echo "::error::genh báo tạo gói chẩn đoán lỗi" >&2; exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              ls -la "$run" "$run/request"; cat "$run/doctor-status.json" 2>/dev/null || true
              echo "::error::watcher không tạo gói chẩn đoán trong 5 phút" >&2; exit 1
            fi
            sleep 5
          done
          cat "$run/doctor-status.json"; echo
          f="$run/diagnostics/$(python3 -c "import json;print(json.load(open('$run/doctor-status.json'))['file'])")"
          unzip -l "$f" | tee "$RUNNER_TEMP/diag-list.txt"
          for e in logs.txt versions.txt host/update-status.json manifest.json; do
            grep -q " $e\$" "$RUNNER_TEMP/diag-list.txt" || { echo "::error::gói chẩn đoán thiếu $e" >&2; exit 1; }
          done
          unzip -p "$f" >"$RUNNER_TEMP/diag-all.txt"
          # Mọi giá trị trong config/secrets.json và secrets/* KHÔNG được xuất hiện (không in giá trị ra log).
          python3 - "$GEN_HARNESS_HOME" "$RUNNER_TEMP/diag-all.txt" <<'PY'
          import json, os, sys
          home, dump = sys.argv[1], open(sys.argv[2], encoding="utf-8", errors="replace").read()
          vals = []
          for k, v in json.load(open(os.path.join(home, "config", "secrets.json"), encoding="utf-8")).items():
              if isinstance(v, str) and len(v.strip()) >= 8 and k != "created_at":
                  vals.append((k, v.strip()))
          sd = os.path.join(home, "secrets")
          if os.path.isdir(sd):
              for n in sorted(os.listdir(sd)):
                  p = os.path.join(sd, n)
                  if os.path.isfile(p):
                      v = open(p, encoding="utf-8", errors="replace").read().strip()
                      if len(v) >= 8:
                          vals.append(("secrets/" + n, v))
                          if "-" in v:
                              vals.append(("secrets/" + n + " (bỏ -)", v.replace("-", "")))
          leaked = [k for k, v in vals if v in dump]
          print("đã kiểm %d giá trị bí mật trong %d byte nội dung gói" % (len(vals), len(dump)))
          if leaked:
              print("::error::gói chẩn đoán LỘ bí mật: %s" % leaked, file=sys.stderr)
              sys.exit(1)
          PY
          echo "OK: gói chẩn đoán đủ mục và không chứa bí mật."

      - name: genh auto-update enable → status → disable
        run: |
          set -euo pipefail
          # Runner GitHub-hosted KHÔNG có `loginctl`/session người dùng thật
          # (systemd --user có thể không chạy được, xem
          # docs/handoff/05-installer.md mục "Docker Engine tĩnh trên Linux" và
          # commit 1e21561 "bật loginctl linger") — internal/autoupdate tự rơi
          # về crontab nếu systemd --user không hoạt động (xem
          # internal/autoupdate/autoupdate.go); chỉ kiểm 3 lệnh chạy KHÔNG
          # crash (exit 0), không ép buộc cơ chế cụ thể nào phải được dùng.
          "$GENH" auto-update enable --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          "$GENH" auto-update status --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          "$GENH" auto-update disable --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"

      - name: genh remote --local → về 127.0.0.1 và vẫn ready (v0.1.46+)
        if: steps.v146.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ -n "${GENH_COMPOSE_FILE:-}" ]; then cdir="$(dirname "$GENH_COMPOSE_FILE")"; else cdir="$GEN_HARNESS_HOME/deploy"; fi
          "$GENH" remote --local --yes --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          proxy="$(docker ps --format '{{.Names}}' --filter label=com.docker.compose.project=gen-harness --filter label=com.docker.compose.service=proxy | head -1)"
          bind="$(docker port "$proxy" 8443/tcp)"
          echo "$bind"
          if echo "$bind" | grep -vq "^127\.0\.0\.1:${GH_PORT}\$"; then
            echo "::error::sau remote --local proxy phải CHỈ nghe 127.0.0.1:${GH_PORT} (đang: $bind)" >&2; exit 1
          fi
          code=""
          for _ in $(seq 1 20); do
            code="$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://localhost:${GH_PORT}/api/v1/ready" || true)"
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { echo "::error::ready trả '$code' sau remote --local (cần 200)" >&2; exit 1; }
          ip="$(hostname -I | awk '{print $1}')"
          if curl -k -sS --max-time 10 -o /dev/null "https://$ip:${GH_PORT}/api/v1/ready"; then
            echo "::error::sau remote --local vẫn kết nối được qua IP mạng $ip" >&2; exit 1
          fi
          python3 - "$GEN_HARNESS_HOME/run/network-status.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          assert d.get("mode") == "local", "mode=%r (cần local)" % d.get("mode")
          assert d.get("bind_addr") == "127.0.0.1", "bind_addr=%r" % d.get("bind_addr")
          PY
          grep -qx 'GH_BIND_ADDR=127.0.0.1' "$cdir/.env" || { echo "::error::$cdir/.env thiếu GH_BIND_ADDR=127.0.0.1" >&2; exit 1; }
          grep -qx 'GH_ACCESS_MODE=local' "$cdir/.env" || { echo "::error::$cdir/.env thiếu GH_ACCESS_MODE=local" >&2; exit 1; }
          echo "OK: về lại chế độ local."

      # v0.1.55 (G1): cài xong KHÔNG gán model nào (bước 4 không ghi agent.bindings) mà Gen vẫn trả lời — hồ sơ tiêu chuẩn
      # theo vai tự chọn model của nguồn đang bật. Kiểm trong container api: 0 dòng gán ⇒ thêm tạm 1 nguồn openai_compat
      # (khoá giả, gọi qua httpx.MockTransport — không ra mạng) ⇒ ModelRouter.generate(core.gen) trả lời bằng model của hồ
      # sơ ⇒ vẫn 0 dòng gán ⇒ gỡ nguồn tạm (còn dòng chi phí tham chiếu thì tắt nó). Ảnh api chưa có gh.defaults ⇒ bỏ qua.
      - name: Cài xong không gán model nào, Gen vẫn trả lời bằng hồ sơ tiêu chuẩn (v0.1.55+)
        run: |
          set -euo pipefail
          api="$(docker ps --format '{{.Names}}' | grep -E '^gen-harness-api-[0-9]+$' | head -1)"
          [ -n "$api" ] || { echo "::error::không thấy container api" >&2; exit 1; }
          if ! docker exec "$api" python -c "import gh.defaults.profiles" >/dev/null 2>&1; then
            echo "::notice::ảnh api chưa có hồ sơ tiêu chuẩn (gh.defaults, < v0.1.55) — bỏ qua."; exit 0
          fi
          cat >"$RUNNER_TEMP/hoso_check.py" <<'PY'
          import asyncio, json, sys
          import httpx
          from redis.asyncio import Redis
          from sqlalchemy import text
          from gh import crypto
          from gh.config import get_settings
          from gh.db import sessionmaker
          from gh.providers.clients import Message
          from gh.providers.router import KEY_AAD, ModelRouter

          MODELS = ["e2e-hoso-pro", "e2e-hoso-flash-lite", "e2e-hoso-flash"]
          REPLY = "Dạ, em đây."

          async def bindings(sm, org):
              async with sm() as db:
                  return (await db.execute(text("SELECT count(*) FROM agent.bindings WHERE org_id = :o"), {"o": org})).scalar_one()

          async def main():
              sm = sessionmaker()
              redis = Redis.from_url(get_settings().redis_url, decode_responses=False)
              pid = None
              try:
                  async with sm() as db:
                      org = (await db.execute(text("SELECT id FROM core.organizations LIMIT 1"))).scalar_one_or_none()
                  if org is None:
                      print("::error::cài xong chưa có tổ chức nào (bootstrap)", file=sys.stderr); return 1
                  n = await bindings(sm, org)
                  if n:
                      print("::error::cài xong đã có %d dòng gán model (agent.bindings) — v0.1.55 không gán model nào" % n, file=sys.stderr)
                      return 1
                  async with sm() as db:
                      pid = (await db.execute(text("""INSERT INTO agent.providers (org_id, kind, name, endpoint, failover_rank, auth_state)
                                                      VALUES (:o, 'openai_compat', 'e2e-hoso', 'https://openrouter.ai/api/v1', 99, 'ok')
                                                      RETURNING id"""), {"o": org})).scalar_one()
                      await db.execute(text("""INSERT INTO agent.provider_keys (provider_id, label, secret_enc, last4, rotation_order)
                                               VALUES (:p, 'E2E-KEY-01', :s, 'e2e0', 0)"""),
                                       {"p": pid, "s": crypto.encrypt(b"sk-e2e-hoso-khong-that-e2e0", KEY_AAD)})
                      for m in MODELS:
                          await db.execute(text("INSERT INTO agent.models (provider_id, model_name) VALUES (:p, :m)"), {"p": pid, "m": m})
                      await db.commit()
                  seen = []

                  def handler(req):
                      seen.append(json.loads(req.content)["model"])
                      return httpx.Response(200, json={"choices": [{"message": {"content": REPLY}}],
                                                       "usage": {"prompt_tokens": 1, "completion_tokens": 1}})

                  router = ModelRouter(sm, redis, transport=httpx.MockTransport(handler))
                  out = await router.generate(org, agent_key="core.gen", purpose="gen.turn",
                                              messages=[Message("user", "xin chào")], json_mode=False)
                  if out.text.strip() != REPLY or not seen or seen[0] not in MODELS:
                      print("::error::Gen không trả lời qua hồ sơ tiêu chuẩn: text=%r model=%r" % (out.text[:80], seen[:1]), file=sys.stderr)
                      return 1
                  n = await bindings(sm, org)
                  if n:
                      print("::error::trả lời xong lại sinh %d dòng gán model" % n, file=sys.stderr); return 1
                  print("OK: 0 dòng gán model; Gen trả lời bằng hồ sơ tiêu chuẩn (model %s của nguồn tạm)." % seen[0])
                  return 0
              finally:
                  if pid is not None:
                      async with sm() as db:
                          try:
                              await db.execute(text("DELETE FROM agent.providers WHERE id = :p"), {"p": pid})
                              await db.commit()
                          except Exception:
                              await db.rollback()
                              await db.execute(text("UPDATE agent.providers SET is_enabled = false WHERE id = :p"), {"p": pid})
                              await db.commit()
                  await redis.aclose()

          sys.exit(asyncio.run(main()))
          PY
          docker exec -i "$api" python - <"$RUNNER_TEMP/hoso_check.py"

      - name: genh uninstall --yes --delete-data (không tương tác, dọn sạch cả dữ liệu)
        # v0.1.40: uninstall mặc định GIỮ dữ liệu — dọn sạch phải kèm --delete-data.
        # genh cũ (< v0.1.40, chạy tay workflow cho tag cũ) không biết cờ này: khi đó
        # `--yes` một mình vẫn là xoá dữ liệu như trước.
        run: |
          set -euo pipefail
          "$GENH" help >"$RUNNER_TEMP/genh-help.txt"
          if grep -q -- '--delete-data' "$RUNNER_TEMP/genh-help.txt"; then
            "$GENH" uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --delete-data
          else
            "$GENH" uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes
          fi

      - name: (luôn) In log docker compose (tail 200) để debug
        if: always()
        run: |
          set -euo pipefail
          docker ps -a || true
          for c in $(docker ps -a --format '{{.Names}}' | grep '^gen-harness-' || true); do
            echo "════ $c ════"
            docker logs --tail 200 "$c" 2>&1 || true
          done

      - name: (luôn) In log genh (~/.gen-harness/logs) để debug
        if: always()
        run: |
          set -euo pipefail
          if [ -d "$GEN_HARNESS_HOME/logs" ]; then
            for f in "$GEN_HARNESS_HOME"/logs/*; do
              echo "── $f ──"
              tail -n 200 "$f" || true
            done
          else
            echo "không thấy $GEN_HARNESS_HOME/logs"
          fi

  # ── e2e-upgrade ──────────────────────────────────────────────────────────
  # Chỉ chạy ở chế độ release (kiểm nâng cấp cần CÓ bản chính thức THẬT trước
  # đó — chế độ pr build từ source, không có "bản trước" để nâng cấp lên chính
  # commit đang review) và khi resolve tìm được prev_tag.
  # Ma trận (v0.1.37): mỗi ô của upgrade_from là một runner riêng — ô tags[1]
  # (matrix.from = prev_tag, bản máy Owner đang chạy) và ô tags[3] (máy tắt vài
  # ngày, nhảy nhiều bản; vắng khi chưa đủ 3 bản chính thức cũ hơn).
  # Kịch bản mỗi ô: cài BẢN CHÍNH THỨC cũ (matrix.from)
  # → đặt genh của tag đang kiểm đè lên → genh update --yes --no-self-update
  # → ready xanh → genh version đúng tag → xác nhận dữ liệu/bí mật KHÔNG bị
  # tạo lại (app_db_password không đổi).
  #
  # THÀNH THẬT: genh cũ tự cập nhật (internal/selfupdate) CHỈ thấy
  # releases/latest — bản thử (prerelease) bị ẩn, nên nó sẽ không tự tải được
  # bản đang kiểm. Vì vậy E2E tự tải genh-linux-amd64 + checksums.txt của tag
  # đang kiểm, kiểm sha256 rồi đặt binary mới bằng tay; đường "genh cũ tự tải
  # binary mới" KHÔNG đi qua ở đây — đường đó do job e2e-selfupdate kiểm SAU
  # promote (lúc releases/latest đã là tag này), cùng go test của
  # apps/genh/internal/selfupdate.
  e2e-upgrade:
    name: nâng cấp ${{ matrix.slot }} ${{ matrix.from }} → ${{ needs.resolve.outputs.tag }}
    needs: resolve
    if: needs.resolve.outputs.run_e2e == 'true' && needs.resolve.outputs.mode == 'release' && needs.resolve.outputs.prev_tag != ''
    runs-on: ubuntu-24.04
    # Không continue-on-error: ô nào đỏ ⇒ needs.e2e-upgrade.result == 'failure'
    # ⇒ promote không chạy (đòi success hoặc skipped).
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.upgrade_from) }}
    # Chạy ngoài checkout repo: genh tìm compose.yaml theo cwd trước — trong repo
    # nó sẽ dùng deploy/compose.yaml (build cục bộ) thay vì compose bản phát hành
    # nhúng trong binary như máy người dùng thật.
    defaults:
      run:
        working-directory: /tmp
    timeout-minutes: 40
    env:
      # Xem ghi chú tương tự ở job e2e-install — không dùng ${{ runner.temp }}
      # trong `env:` cấp job.
      GH_PORT: "8444"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.tag }}
      # Bản cũ của ô này (tags[1] hoặc tags[3]) — các bước dưới đọc PREV_TAG.
      PREV_TAG: ${{ matrix.from }}
    steps:
      - name: Lấy mã nguồn (dùng .github/scripts/e2e_data.sh, không build gì ở job này)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Đặt GEN_HARNESS_HOME (thư mục cài đặt tạm của job này)
        run: echo "GEN_HARNESS_HOME=$RUNNER_TEMP/gh-upgrade" >>"$GITHUB_ENV"

      - name: Cài sạch bản chính thức cũ (${{ matrix.slot }} ${{ matrix.from }})
        continue-on-error: ${{ matrix.broken == 'true' }}
        run: |
          set -euo pipefail
          # Tự tải asset của đúng PREV_TAG (bản cũ của ô) rồi làm y hệt phần thân install.sh
          # (kiểm checksum, đặt vào bin/) — install.sh của bản cũ chưa biết
          # GEN_HARNESS_RELEASE_TAG, gọi thẳng nó sẽ ra bản chính thức hiện tại.
          mkdir -p "$GEN_HARNESS_HOME/bin"
          gh release download "$PREV_TAG" --repo "$R" \
            --pattern 'genh-linux-amd64' --pattern 'checksums.txt' --dir "$RUNNER_TEMP/prev" --clobber
          want="$(awk '$2=="genh-linux-amd64"||$2=="./genh-linux-amd64"{print $1}' "$RUNNER_TEMP/prev/checksums.txt")"
          got="$(sha256sum "$RUNNER_TEMP/prev/genh-linux-amd64" | awk '{print $1}')"
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "::error::sha256 của genh-linux-amd64 ($PREV_TAG) không khớp checksums.txt — asset Release bị thay hoặc tải hỏng; tải lại/kiểm Release $PREV_TAG." >&2; exit 1; }
          install -m 0755 "$RUNNER_TEMP/prev/genh-linux-amd64" "$GEN_HARNESS_HOME/bin/genh"
          "$GEN_HARNESS_HOME/bin/genh" version
          "$GEN_HARNESS_HOME/bin/genh" install --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-auto-update
          # v0.1.53: genh cũ chưa biết dấu "Sếp đã chủ động tắt" (config/auto-update-disabled.json) nên --no-auto-update ở
          # trên không ghi nó. Ghi sẵn để genh mới (sau nâng cấp) KHÔNG tự lành bật dòng crontab 03:00–03:29 giờ runner (UTC
          # = 10:00 VN, giờ hay phát hành) — dòng đó chạy `genh update --yes` giành genh.lock giữa bài kiểm ⇒ đỏ chập chờn
          # GH-E94A. Đúng ý nghĩa --no-auto-update của genh mới (cài kiểu này = Sếp đã tắt).
          optout="$GEN_HARNESS_HOME/config/auto-update-disabled.json"
          mkdir -p "$GEN_HARNESS_HOME/config"
          [ -e "$optout" ] || printf '{"at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >"$optout"
          chmod 600 "$optout"

      - name: Chờ /api/v1/ready xanh (bản cũ, tối đa 5 phút)
        if: matrix.broken != 'true'
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::ready không xanh (bản cũ)" >&2; exit 1; }
            sleep 3
          done

      # v0.1.34 (F-35): dữ liệu mẫu THẬT (gh.seed_demo — luồng ingest → sàng lọc → nghiệp vụ thật) để phép
      # "số dòng không đổi sau nâng cấp" có ý nghĩa; seed lỗi ⇒ đỏ (không continue-on-error).
      - name: Nạp dữ liệu mẫu vào bản cũ + đếm số dòng
        if: matrix.broken != 'true'
        run: |
          set -euo pipefail
          data="$GITHUB_WORKSPACE/.github/scripts/e2e_data.sh"
          "$data" seed
          # Chờ số dòng đứng yên (job nền của worker có thể còn ghi thêm ngay sau seed) — tối đa 2 phút.
          "$data" count >"$RUNNER_TEMP/rows-before.txt"
          for _ in $(seq 1 12); do
            sleep 10
            "$data" count >"$RUNNER_TEMP/rows-check.txt"
            if cmp -s "$RUNNER_TEMP/rows-before.txt" "$RUNNER_TEMP/rows-check.txt"; then break; fi
            cp "$RUNNER_TEMP/rows-check.txt" "$RUNNER_TEMP/rows-before.txt"
          done
          cat "$RUNNER_TEMP/rows-before.txt"
          "$data" require-data "$RUNNER_TEMP/rows-before.txt"

      # Máy Owner lâu năm còn ảnh của các bản cũ hơn nữa — kéo sẵn ảnh của bản chính thức liền trước PREV_TAG
      # (PREV2) để kiểm genh mới DỌN chúng sau nâng cấp (chỉ giữ ảnh bản hiện tại + bản liền trước).
      # v0.1.48: caddy/redis ghim digest, Renovate nâng hằng tuần ⇒ máy Owner sẽ tồn digest cũ KHÔNG gắn tag (đúng kiểu
      # genh kéo bản ghim). Chưa bản phát hành nào trước v0.1.48 ghim caddy/redis (bản cũ kéo theo tag) nên tự nhiên
      # runner không có digest cũ nào — phải kéo sẵn 1 digest caddy + 1 digest redis cũ, khác cả digest đang ghim lẫn
      # digest tag caddy:2-alpine/redis:7-alpine hiện trỏ tới, thì bước "Chỉ còn ảnh…" mới thật sự kiểm được genh dọn
      # ảnh ngoài. Bản < v0.1.48 chưa dọn ảnh ngoài ⇒ không kéo (chạy tay workflow cho tag cũ không đỏ oan).
      - name: Giả lập ảnh tồn đọng của bản cũ hơn nữa
        run: |
          set -euo pipefail
          refs="$RUNNER_TEMP/prev2-refs.txt"
          : >"$refs"
          if [ "$(printf '%s\n%s\n' v0.1.48 "$TAG" | sort -V | head -n1)" = "v0.1.48" ]; then
            # caddy 2.11.6 (bản ghim đầu tiên của v0.1.48, trước khi đo lại 05/10) và redis 7.2.5-alpine (09/2024): digest
            # danh sách đa kiến trúc, kiểm còn kéo được trên Docker Hub ngày 09/10/2026. `docker images` in repo dạng
            # ngắn (caddy, redis) nên ghi đúng dạng đó để vòng kiểm so khớp.
            for ref in \
              caddy@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028 \
              redis@sha256:6aaf3f5e6bc8a592fbfe2cccf19eb36d27c39d12dab4f4b01556b7449e7b1f44; do
              docker pull -q "$ref"
              echo "$ref" >>"$refs"
            done
            echo "digest caddy/redis cũ (không tag) đã kéo sẵn:"
            cat "$refs"
          fi
          prev2=""
          official="$(gh release list --repo "$R" --exclude-drafts --exclude-pre-releases --limit 20 --json tagName --jq '.[].tagName')"
          for t in $official; do
            [ "$t" != "$PREV_TAG" ] || continue
            if [ "$(printf '%s\n%s\n' "$t" "$PREV_TAG" | sort -V | head -n1)" = "$t" ]; then
              prev2="$t"
              break
            fi
          done
          if [ -z "$prev2" ]; then
            echo "::notice::không có bản chính thức nào cũ hơn $PREV_TAG — bỏ qua giả lập ảnh tồn đọng."
            exit 0
          fi
          if ! gh release download "$prev2" --repo "$R" --pattern 'compose.release.yaml' --dir "$RUNNER_TEMP/prev2" --clobber; then
            echo "::notice::$prev2 không có compose.release.yaml — bỏ qua giả lập ảnh tồn đọng."
            exit 0
          fi
          ghrefs="$RUNNER_TEMP/prev2-gh-refs.txt"
          { grep -oE 'ghcr\.io/[^"[:space:]]+@sha256:[0-9a-f]{64}' "$RUNNER_TEMP/prev2/compose.release.yaml" || true; } | sort -u >"$ghrefs"
          echo "ảnh của $prev2 (bản chính thức cũ hơn $PREV_TAG):"
          cat "$ghrefs"
          while read -r ref; do
            docker pull -q "$ref"
          done <"$ghrefs"
          cat "$ghrefs" >>"$refs"

      - name: Ghi lại app_db_password TRƯỚC khi nâng cấp
        id: before
        run: |
          set -euo pipefail
          pw="$(python3 -c "import json;print(json.load(open('${GEN_HARNESS_HOME}/config/secrets.json'))['app_db_password'])")"
          echo "::add-mask::$pw"
          echo "pw=$pw" >>"$GITHUB_OUTPUT"

      # v0.1.63: bản cũ < v0.1.63 chưa có gh_agy_key ⇒ genh mới phải tự sinh khi nâng cấp; bản cũ đã có thì giữ nguyên
      # (so sha256, không in khoá).
      - name: Ghi lại gh_agy_key TRƯỚC khi nâng cấp (bản cũ < v0.1.63 chưa có → genh mới tự sinh)
        id: agykey
        run: |
          set -euo pipefail
          f="$GEN_HARNESS_HOME/secrets/gh_agy_key"
          if [ -s "$f" ]; then
            echo "before=present" >>"$GITHUB_OUTPUT"
            echo "sha=$(sha256sum "$f" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          else
            echo "before=absent" >>"$GITHUB_OUTPUT"
            echo "sha=" >>"$GITHUB_OUTPUT"
          fi

      - name: Đặt genh ${{ needs.resolve.outputs.tag }} đè lên genh cũ (tải + kiểm sha256)
        run: |
          set -euo pipefail
          # Xem ghi chú THÀNH THẬT ở đầu job: genh cũ không thấy bản thử qua
          # releases/latest nên đặt binary mới bằng tay, đúng như install.sh
          # làm (tải asset + checksums.txt của ĐÚNG tag, kiểm sha256).
          d="$RUNNER_TEMP/new"
          gh release download "$TAG" --repo "$R" \
            --pattern 'genh-linux-amd64' --pattern 'checksums.txt' --dir "$d" --clobber
          want="$(awk '$2=="genh-linux-amd64"||$2=="./genh-linux-amd64"{print $1}' "$d/checksums.txt")"
          got="$(sha256sum "$d/genh-linux-amd64" | awk '{print $1}')"
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "::error::sha256 của genh-linux-amd64 ($TAG) không khớp checksums.txt — KHÔNG promote bản này; kiểm lại asset của Release $TAG." >&2; exit 1; }
          install -m 0755 "$d/genh-linux-amd64" "$GEN_HARNESS_HOME/bin/genh"
          "$GEN_HARNESS_HOME/bin/genh" version

      - name: Ghi lại cổng/chế độ truy cập TRƯỚC khi nâng cấp (bản cũ < v0.1.46 không có GH_BIND_ADDR)
        run: |
          set -euo pipefail
          envf="$GEN_HARNESS_HOME/deploy/.env"
          prev_bind="$(grep -E '^GH_BIND_ADDR=' "$envf" 2>/dev/null | head -1 | cut -d= -f2- || true)"
          prev_mode="$(grep -E '^GH_ACCESS_MODE=' "$envf" 2>/dev/null | head -1 | cut -d= -f2- || true)"
          echo "PREV_BIND_ADDR=$prev_bind" >> "$GITHUB_ENV"
          echo "PREV_ACCESS_MODE=$prev_mode" >> "$GITHUB_ENV"
          echo "trước nâng cấp ($PREV_TAG): GH_BIND_ADDR='${prev_bind:-<không có>}' GH_ACCESS_MODE='${prev_mode:-<không có>}'"

      - name: genh update --yes --no-self-update (genh ${{ needs.resolve.outputs.tag }} nâng cấp dịch vụ từ bản cũ)
        run: '"$GEN_HARNESS_HOME/bin/genh" update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-self-update'

      - name: Chờ /api/v1/ready xanh lại sau nâng cấp (tối đa 5 phút)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::ready không xanh sau update" >&2; exit 1; }
            sleep 3
          done

      # v0.1.46 (F-27/F-21b): nâng cấp từ bản cũ (không có GH_BIND_ADDR) PHẢI giữ hành vi cũ (0.0.0.0, lan_legacy) và
      # nhắc Owner đúng 1 chuông "Cổng đang mở cho cả mạng". Bản cũ đã là v0.1.46+ (có GH_BIND_ADDR) thì nâng cấp phải
      # GIỮ NGUYÊN địa chỉ/chế độ và KHÔNG chuông. Chỉ kiểm khi genh mới có lệnh `genh remote`.
      - name: Nâng cấp giữ cổng/chế độ truy cập + chuông network.open_lan đúng kỳ vọng (v0.1.46+, tối đa ~8 phút)
        if: matrix.broken != 'true'
        run: |
          set -euo pipefail
          GENH_NEW="$GEN_HARNESS_HOME/bin/genh"
          if ! "$GENH_NEW" help 2>&1 | grep -q 'genh remote'; then
            echo "::notice::genh $TAG chưa có lệnh remote (< v0.1.46) — bỏ qua kiểm cổng/chuông."; exit 0
          fi
          cdir="$GEN_HARNESS_HOME/deploy"
          proxy="$(docker ps --format '{{.Names}}' --filter label=com.docker.compose.project=gen-harness --filter label=com.docker.compose.service=proxy | head -1)"
          bind="$(docker port "$proxy" 8443/tcp)"
          echo "docker port: $bind"
          dbc="$(docker ps -q --filter label=com.docker.compose.project=gen-harness --filter label=com.docker.compose.service=db | head -1)"
          [ -n "$dbc" ] || { echo "::error::không thấy container db" >&2; exit 1; }
          q() {
            # $1 là đối số vị trí của sh -c — không nội suy vào chuỗi lệnh. $POSTGRES_USER/$POSTGRES_DB mở rộng trong container.
            # shellcheck disable=SC2016
            docker exec "$dbc" sh -c 'psql -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-gh}" -d "${POSTGRES_DB:-gen_harness}" -tAc "$1"' psql "$1"
          }
          alerts_sql="SELECT count(*) FROM ops.health_alerts WHERE key='network.open_lan' AND cleared_at IS NULL"
          bells_sql="SELECT count(*) FROM core.notifications WHERE kind='network.open_lan'"
          if [ -n "${PREV_BIND_ADDR:-}" ]; then
            # Bản cũ đã là v0.1.46+ (cài mới nghe 127.0.0.1 hoặc Owner đã chọn qua `genh remote`): nâng cấp phải GIỮ NGUYÊN
            # địa chỉ/chế độ Owner đã có và KHÔNG được nhắc "cổng đang mở" (chỉ nhắc cho bản cũ không có GH_BIND_ADDR).
            echo "$bind" | grep -q "^${PREV_BIND_ADDR}:${GH_PORT}\$" || { echo "::error::nâng cấp từ $PREV_TAG (đã có GH_BIND_ADDR=$PREV_BIND_ADDR) phải giữ nguyên địa chỉ nghe — đang: $bind" >&2; exit 1; }
            grep -qx "GH_BIND_ADDR=${PREV_BIND_ADDR}" "$cdir/.env" || { echo "::error::$cdir/.env đổi GH_BIND_ADDR (trước: $PREV_BIND_ADDR)" >&2; exit 1; }
            if [ -n "${PREV_ACCESS_MODE:-}" ]; then
              grep -qx "GH_ACCESS_MODE=${PREV_ACCESS_MODE}" "$cdir/.env" || { echo "::error::$cdir/.env đổi GH_ACCESS_MODE (trước: $PREV_ACCESS_MODE)" >&2; exit 1; }
            fi
            if [ "$PREV_ACCESS_MODE" != "lan_legacy" ]; then
              # Đợi 2 vòng sức khoẻ (60 giây/vòng) rồi khẳng định KHÔNG có sự cố/chuông cổng mở.
              sleep 130
              a="$(q "$alerts_sql")"; b="$(q "$bells_sql")"
              echo "sau nâng cấp từ $PREV_TAG: sự cố network.open_lan mở=$a, chuông=$b (cần 0/0)"
              [ "$a" = "0" ] && [ "$b" = "0" ] || { echo "::error::nâng cấp từ bản đã nghe $PREV_BIND_ADDR không được nhắc 'cổng đang mở' (sự cố=$a, chuông=$b)" >&2; exit 1; }
              echo "OK: giữ nguyên $PREV_BIND_ADDR/${PREV_ACCESS_MODE:-?} và không có chuông network.open_lan."
              exit 0
            fi
            echo "bản cũ đang ở lan_legacy — kiểm như nâng cấp từ bản cũ (0.0.0.0 + đúng 1 chuông)."
          fi
          echo "$bind" | grep -q "^0\.0\.0\.0:${GH_PORT}\$" || { echo "::error::sau nâng cấp từ bản cũ proxy phải VẪN nghe 0.0.0.0:${GH_PORT} (giữ hành vi cũ) — đang: $bind" >&2; exit 1; }
          grep -E '^GH_(BIND_ADDR|ACCESS_MODE)=' "$cdir/.env" || true
          grep -qx 'GH_BIND_ADDR=0.0.0.0' "$cdir/.env" || { echo "::error::$cdir/.env thiếu GH_BIND_ADDR=0.0.0.0" >&2; exit 1; }
          grep -qx 'GH_ACCESS_MODE=lan_legacy' "$cdir/.env" || { echo "::error::$cdir/.env thiếu GH_ACCESS_MODE=lan_legacy" >&2; exit 1; }
          python3 - "$GEN_HARNESS_HOME/run/network-status.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          print(d)
          assert d.get("mode") == "lan_legacy", "mode=%r (cần lan_legacy)" % d.get("mode")
          assert d.get("bind_addr") == "0.0.0.0", "bind_addr=%r" % d.get("bind_addr")
          PY
          orgs="$(q "SELECT count(*) FROM core.organizations")"
          if [ "$orgs" = "0" ]; then
            echo "::error::dữ liệu mẫu của bản cũ chưa có tổ chức nào (core.organizations rỗng) — không thể kiểm chuông network.open_lan; sửa bước nạp dữ liệu mẫu, không bỏ qua." >&2; exit 1
          fi
          owners_sql="SELECT count(DISTINCT u.id) FROM core.users u JOIN core.user_roles ur ON ur.user_id=u.id JOIN core.roles r ON r.id=ur.role_id WHERE u.is_active AND u.deleted_at IS NULL AND r.code='owner'"
          # Dữ liệu mẫu (gh.seed_demo) chỉ tạo tổ chức + vai trò, KHÔNG có người dùng (Owner chỉ sinh ra ở trình thiết lập
          # thật). Chuông network.open_lan gửi cho Owner (notifications.owner_ids) nên phải có ít nhất 1 Owner mới kiểm
          # được. Chèn 1 Owner mẫu (mật khẩu băm giả, không đăng nhập được) rồi xoá sự cố đang mở (nếu api đã mở lúc
          # chưa có Owner) để raise_once mở lại trong vòng sức khoẻ kế tiếp và gửi chuông cho đúng số Owner.
          if [ "$(q "$owners_sql")" = "0" ]; then
            q "WITH u AS (INSERT INTO core.users (org_id, email, display_name, password_hash) SELECT o.id, 'e2e-owner@example.test', 'E2E Owner', 'x' FROM core.organizations o ORDER BY o.created_at LIMIT 1 RETURNING id, org_id) INSERT INTO core.user_roles (user_id, role_id) SELECT u.id, r.id FROM u JOIN core.roles r ON r.org_id = u.org_id AND r.code = 'owner'"
            q "DELETE FROM ops.health_alerts WHERE key = 'network.open_lan'"
            q "DELETE FROM core.notifications WHERE kind = 'network.open_lan'"
            echo "đã chèn 1 Owner mẫu để kiểm chuông (Owner=$(q "$owners_sql"))"
          fi
          # Vòng sức khoẻ của api chạy mỗi 60 giây — chờ tối đa 3 phút.
          deadline=$((SECONDS + 180))
          a=0
          while :; do
            a="$(q "$alerts_sql")"
            [ "$a" = "1" ] && break
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::sau 3 phút ops.health_alerts chưa có đúng 1 dòng network.open_lan đang mở (đang $a)" >&2; exit 1; }
            sleep 5
          done
          owners="$(q "$owners_sql")"
          [ "$owners" -ge 1 ] || { echo "::error::dữ liệu mẫu không có Owner nào đang hoạt động — không kiểm được chuông" >&2; exit 1; }
          bells="$(q "$bells_sql")"
          echo "sự cố mở=$a, Owner=$owners, chuông network.open_lan=$bells"
          [ "$bells" = "$owners" ] || { echo "::error::số chuông network.open_lan ($bells) phải bằng số Owner ($owners)" >&2; exit 1; }
          # Cập nhật lại khi dịch vụ đã khớp (bỏ qua) rồi đợi thêm 2 phút: vẫn đúng ngần ấy chuông (raise_once, không nhắc lại).
          "$GENH_NEW" update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-self-update
          sleep 120
          a="$(q "$alerts_sql")"; bells2="$(q "$bells_sql")"
          echo "sau 2 phút: sự cố mở=$a, chuông=$bells2"
          [ "$a" = "1" ] || { echo "::error::sau update lại, sự cố network.open_lan đang mở = $a (cần 1)" >&2; exit 1; }
          [ "$bells2" = "$owners" ] || { echo "::error::chuông network.open_lan thay đổi sau update lại ($bells → $bells2, Owner=$owners) — phải đúng $owners" >&2; exit 1; }
          bind="$(docker port "$(docker ps --format '{{.Names}}' --filter label=com.docker.compose.project=gen-harness --filter label=com.docker.compose.service=proxy | head -1)" 8443/tcp)"
          echo "$bind" | grep -q "^0\.0\.0\.0:${GH_PORT}\$" || { echo "::error::sau update lại proxy không còn 0.0.0.0 (đang: $bind)" >&2; exit 1; }
          echo "OK: giữ 0.0.0.0/lan_legacy và đúng $owners chuông network.open_lan."

      # v0.1.63 (review P1-1): api KHÔNG còn tự chuyển phiên Claude từ đường dẫn cũ (migrate_legacy_claude_home đã bỏ — mọi bản
      # cài đã qua v0.1.38 nên bản cũ ≥ v0.1.38 không bao giờ có /var/lib/gh/agy/claude). Sau nâng cấp: đường dẫn cũ vẫn KHÔNG
      # tồn tại, volume claude_state có sẵn thư mục phiên Claude, và agy phải cô lập (canary offline "khong_lo").
      - name: Phiên Claude ở claude_state riêng + canary offline (F-22)
        run: |
          set -euo pipefail
          api="$(docker ps --format '{{.Names}}' | grep -E '^gen-harness-api-[0-9]+$' | head -1)"
          [ -n "$api" ] || { echo "::error::không thấy container api sau nâng cấp" >&2; exit 1; }
          docker exec "$api" sh -c 'test ! -e /var/lib/gh/agy/claude && test -d /var/lib/gh/claude/.claude' \
            || { echo "::error::sau nâng cấp phiên Claude Code nằm trong HOME của Antigravity CLI (/var/lib/gh/agy/claude) hoặc thiếu /var/lib/gh/claude/.claude (F-22)" >&2; exit 1; }
          echo "OK: /var/lib/gh/agy/claude không có, /var/lib/gh/claude/.claude có."
          # Canary offline (python -m gh.providers.agy_canary — hợp đồng do gói agy-co-lap-api viết): in ĐÚNG một dòng
          # JSON {result, checks, agy_version}; chỉ in lại result/checks/agy_version — không bao giờ in đầu ra agy thô.
          rc=0
          docker exec "$api" python -m gh.providers.agy_canary --offline >"$RUNNER_TEMP/agy-canary.json" 2>/dev/null || rc=$?
          python3 - "$RUNNER_TEMP/agy-canary.json" "$rc" <<'PY'
          import json, sys
          lines = [x for x in open(sys.argv[1], encoding="utf-8").read().splitlines() if x.strip()]
          try:
              d = json.loads(lines[-1]) if lines else {}
          except ValueError:
              d = {}
          d = d if isinstance(d, dict) else {}
          res = d.get("result")
          print("agy canary offline: result=%s rc=%s agy_version=%s" % (res, sys.argv[2], d.get("agy_version")))
          print("checks: %s" % json.dumps(d.get("checks"), ensure_ascii=False))
          if res != "khong_lo":
              print("::error::canary offline của Antigravity CLI báo %r (cần khong_lo) — agy có thể đọc bí mật/phiên Claude." % res,
                    file=sys.stderr)
              sys.exit(1)
          PY

      - name: Số dòng không đổi sau nâng cấp
        if: matrix.broken != 'true'
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/e2e_data.sh" count >"$RUNNER_TEMP/rows-after.txt"
          if ! diff -u "$RUNNER_TEMP/rows-before.txt" "$RUNNER_TEMP/rows-after.txt"; then
            echo "::error::số dòng bảng chính đổi sau nâng cấp $PREV_TAG → $TAG (xem diff ở trên) — dữ liệu Owner bị mất hoặc nhân đôi; KHÔNG promote." >&2
            exit 1
          fi
          echo "OK: số dòng các bảng chính giữ nguyên sau nâng cấp."

      # F-33: genh dọn ảnh cũ — chỉ giữ ảnh của bản hiện tại (compose.yaml) và bản liền trước (compose.yaml.bak).
      - name: Chỉ còn ảnh của bản hiện tại và bản liền trước
        run: |
          set -euo pipefail
          deploy="$GEN_HARNESS_HOME/deploy"
          refre='ghcr\.io/[^"[:space:]]+@sha256:[0-9a-f]{64}'
          keep="$RUNNER_TEMP/keep-refs.txt"
          for f in "$deploy/compose.yaml" "$deploy/compose.yaml.bak"; do
            if [ -f "$f" ]; then grep -oE "$refre" "$f" || true; fi
          done | sort -u >"$keep"
          echo "── docker images ──"
          docker images --digests
          have="$RUNNER_TEMP/have-refs.txt"
          docker images --digests --format '{{.Repository}}@{{.Digest}}' | sort -u >"$have"
          bad=0
          while read -r ref; do
            [ -n "$ref" ] || continue
            if grep -qxF "$ref" "$keep"; then continue; fi
            if grep -qxF "$ref" "$have"; then
              echo "::error::ảnh cũ $ref (bản cũ hơn bản liền trước) vẫn còn sau nâng cấp — genh chưa dọn ảnh cũ, đĩa máy Owner sẽ đầy dần." >&2
              bad=1
            fi
          done <"$RUNNER_TEMP/prev2-refs.txt"
          # v0.1.48: caddy/redis ghim digest (Renovate nâng hằng tuần) — genh cũng phải dọn digest cũ của đúng 2 repo này.
          # Digest cũ không tag kéo sẵn ở bước "Giả lập ảnh tồn đọng" nằm trong prev2-refs.txt ⇒ vòng trên đã đòi xoá;
          # đếm dưới đây chặn thêm trường hợp genh kéo/giữ quá 2 bản.
          over="$(docker images --digests --format '{{.Repository}} {{.Digest}}' \
            | awk '($1 ~ /^ghcr\.io\/[^\/]+\/gen-harness-/ || $1 == "caddy" || $1 == "redis") && $2 != "<none>"' | sort -u \
            | awk '{c[$1]++} END{for (r in c) if (c[r] > 2) print r " (" c[r] " bản)"}')"
          if [ -n "$over" ]; then
            echo "::error::còn hơn 2 bản ảnh cho: $over — genh phải chỉ giữ ảnh của bản hiện tại và bản liền trước (gen-harness-*, caddy, redis)." >&2
            bad=1
          fi
          [ "$bad" = 0 ] || exit 1
          echo "OK: chỉ còn ảnh của bản hiện tại và bản liền trước."

      - name: Kiểm genh sau nâng cấp đúng tag ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          out="$("$GEN_HARNESS_HOME/bin/genh" version)"
          echo "$out"
          case " $out " in
            *" $TAG "*) echo "OK: sau nâng cấp genh là $TAG (từ $PREV_TAG)" ;;
            *)
              echo "::error::sau genh update, genh báo '$out' chứ không phải $TAG — binary bị thay ngược (vd tự cập nhật về releases/latest); KHÔNG promote, xem log bước genh update." >&2
              exit 1
              ;;
          esac

      # v0.1.29: compose mới mount Docker secret gh_browser_key (genh cũ không sinh) — genh mới (đặt đè ở bước
      # trên) phải tự sinh khoá trước `docker compose up`, và browser/browser-egress phải chạy sau nâng cấp.
      - name: Kiểm khoá gh_browser_key + dịch vụ browser sau nâng cấp (nếu compose có browser)
        run: |
          set -euo pipefail
          if ! grep -q '^  browser-egress:' "$GEN_HARNESS_HOME/deploy/compose.yaml"; then
            echo "compose.yaml bản này chưa có browser — bỏ qua."; exit 0
          fi
          test -s "$GEN_HARNESS_HOME/secrets/gh_browser_key" || { echo "::error::thiếu secrets/gh_browser_key sau genh update" >&2; exit 1; }
          "$GEN_HARNESS_HOME/bin/genh" status --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" | tee /tmp/genh-status-upg.txt
          for svc in browser browser-egress; do
            awk -v s="$svc" '$1==s && $2=="running"{f=1} END{exit !f}' /tmp/genh-status-upg.txt || { echo "::error::dịch vụ $svc không chạy sau nâng cấp" >&2; exit 1; }
          done
          if grep -Eiq 'unhealthy|exited|restarting' /tmp/genh-status-upg.txt; then
            echo "::error::có dịch vụ không healthy sau nâng cấp" >&2; exit 1
          fi
          # Cách ly: container Chromium (browser) và browser-egress KHÔNG được tới Redis chính (hàng đợi arq của
          # worker giữ khoá master) hay Postgres; browser chỉ tới browser-redis.
          probe() {  # probe <service> <host> <port> → in "reach" hoặc "blocked"
            local cid
            cid="$(docker ps -q --filter "label=com.docker.compose.service=$1" | head -n1)"
            [ -n "$cid" ] || { echo "::error::không thấy container $1" >&2; exit 1; }
            docker exec "$cid" python3 -c "import socket,sys
          try:
              socket.create_connection(('$2', $3), 3).close(); print('reach')
          except OSError:
              print('blocked')"
          }
          for svc in browser browser-egress; do
            for target in redis:6379 db:5432 api:8000; do
              r="$(probe "$svc" "${target%%:*}" "${target##*:}")"
              echo "$svc → $target: $r"
              [ "$r" = "blocked" ] || { echo "::error::$svc tới được $target — phải bị chặn" >&2; exit 1; }
            done
          done
          r="$(probe browser browser-redis 6379)"; echo "browser → browser-redis:6379: $r"
          [ "$r" = "reach" ] || { echo "::error::browser không tới được browser-redis" >&2; exit 1; }

      # v0.1.63: nâng cấp từ bản chưa có box lên bản có box ⇒ gh_agy_key được sinh TRƯỚC `docker compose up`, agy-box healthy
      # và cô lập; bản cũ đã có khoá thì khoá giữ nguyên.
      - name: agy-box sau nâng cấp (v0.1.63+) — khoá tự sinh/giữ nguyên, healthy, cô lập
        env:
          GENH: ${{ env.GEN_HARNESS_HOME }}/bin/genh
          MODE: release
          AGY_KEY_BEFORE: ${{ steps.agykey.outputs.before }}
          AGY_KEY_SHA_BEFORE: ${{ steps.agykey.outputs.sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/e2e_agy_box.sh"
          f="$GEN_HARNESS_HOME/secrets/gh_agy_key"
          if [ "$AGY_KEY_BEFORE" = "present" ]; then
            [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$AGY_KEY_SHA_BEFORE" ] \
              || { echo "::error::gh_agy_key bị ĐỔI khi nâng cấp — phải giữ nguyên khoá đang dùng." >&2; exit 1; }
            echo "OK: gh_agy_key có sẵn ở bản cũ và giữ nguyên sau nâng cấp."
          else
            echo "OK: bản cũ ($PREV_TAG) chưa có gh_agy_key — genh $TAG đã tự sinh khi nâng cấp."
          fi

      - name: Kiểm dữ liệu/bí mật KHÔNG bị tạo lại (app_db_password không đổi)
        run: |
          set -euo pipefail
          pw_after="$(python3 -c "import json;print(json.load(open('${GEN_HARNESS_HOME}/config/secrets.json'))['app_db_password'])")"
          echo "::add-mask::$pw_after"
          if [ "$pw_after" != "${{ steps.before.outputs.pw }}" ]; then
            echo "::error::app_db_password đã ĐỔI sau genh update — bí mật/dữ liệu có vẻ bị tạo lại thay vì giữ nguyên." >&2
            exit 1
          fi
          echo "OK: app_db_password giữ nguyên sau nâng cấp — bí mật/dữ liệu không bị tạo lại. genh version hiện tại:"
          "$GEN_HARNESS_HOME/bin/genh" version --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"

      - name: genh uninstall --yes --delete-data (dọn dẹp)
        if: always()
        # genh cũ không biết --delete-data (thoát 2) → thử lại không cờ (bản cũ: --yes là xoá dữ liệu).
        run: '"$GEN_HARNESS_HOME/bin/genh" uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --delete-data || "$GEN_HARNESS_HOME/bin/genh" uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes || true'

      - name: (luôn) In log docker compose (tail 200) để debug
        if: always()
        run: |
          set -euo pipefail
          docker ps -a || true
          for c in $(docker ps -a --format '{{.Names}}' | grep '^gen-harness-' || true); do
            echo "════ $c ════"
            docker logs --tail 200 "$c" 2>&1 || true
          done

  # ── e2e-rollback ─────────────────────────────────────────────────────────
  # v0.1.34 (F-35; nghiệm thu thật F-10/F-11): BẢN HỎNG CỐ Ý. Chạy cả pr và
  # release. Build 3 genh từ ĐÚNG mã đang xét (release: mã của tag; pr: commit
  # đang xét), cùng compose.release.yaml của $TAG nhúng vào:
  #   - genh-tot: compose đúng (version = $BASE, BASE = tag ở release, "dev" ở pr);
  #   - genh-hong: compose có api `command: ["false"]` — api không bao giờ lên;
  #   - genh-sua: compose khác byte, cùng cấu hình (bản "mới hơn" đã sửa).
  # Cài bằng genh-tot + dữ liệu mẫu → genh-hong update phải thoát khác 0, TỰ quay
  # về bản cũ (compose cũ, api cũ chạy, số dòng giữ nguyên; bản hỏng không có
  # migration chờ nên KHÔNG khôi phục CSDL), ghi run/update-blocked.json đúng
  # version bản hỏng + hộp thư Console "failed" có mã lỗi; chạy lại như lịch đêm
  # → "lịch đêm không tự thử lại" (thoát 0, không sao lưu thêm, không tải ảnh,
  # hộp thư giữ nguyên); "Cập nhật ngay" (--if-requested) thì VẪN thử lại;
  # genh-sua update → thành công, xoá update-blocked.json, dữ liệu vẫn nguyên.
  e2e-rollback:
    name: "bản hỏng cố ý: api không lên → tự quay về bản cũ, dữ liệu giữ nguyên"
    needs: resolve
    if: needs.resolve.outputs.run_e2e == 'true'
    runs-on: ubuntu-24.04
    # Chạy ngoài checkout repo — xem e2e-install.
    defaults:
      run:
        working-directory: /tmp
    timeout-minutes: 45
    env:
      GH_PORT: "8445"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      # pr: bản chính thức mới nhất (lấy compose.release.yaml); release: bản thử đang kiểm.
      TAG: ${{ needs.resolve.outputs.tag }}
      MODE: ${{ needs.resolve.outputs.mode }}
    steps:
      - name: Lấy mã nguồn (release — đúng mã của tag; pr — commit đang xét)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.mode == 'release' && needs.resolve.outputs.tag || '' }}

      - name: Đặt GEN_HARNESS_HOME (thư mục cài đặt tạm của job này)
        run: echo "GEN_HARNESS_HOME=$RUNNER_TEMP/gh-hong" >>"$GITHUB_ENV"

      - name: Cài Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24.0"

      - name: Tải compose.release.yaml của ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$R" \
            --pattern 'compose.release.yaml' --dir "$RUNNER_TEMP/rel" --clobber
          grep '^\s*image:' "$RUNNER_TEMP/rel/compose.release.yaml"

      - name: Build genh-tot, genh-hong, genh-sua từ mã nguồn
        working-directory: ${{ github.workspace }}/apps/genh
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          rel="$RUNNER_TEMP/rel/compose.release.yaml"
          emb="internal/compose/embedded_compose.yaml"
          out="$RUNNER_TEMP/bin-e2e"
          mkdir -p "$out"
          if [ "$MODE" = "release" ]; then base="$TAG"; else base="dev"; fi
          # build <tên> <version> <tệp compose nhúng>
          build() {
            cp "$3" "$emb"
            go build -trimpath -ldflags "-s -w -X main.version=$2" -o "$out/$1" ./cmd/genh
            git checkout -- "$emb"
            "$out/$1" version
          }
          # Bản hỏng: api chạy `false` — thoát ngay, không bao giờ healthy.
          sed '/^  api:$/a\    command: ["false"]' "$rel" >"$RUNNER_TEMP/compose-hong.yaml"
          n="$(grep -c '^    command: \["false"\]$' "$RUNNER_TEMP/compose-hong.yaml" || true)"
          if [ "$n" != "1" ]; then
            echo "::error::chèn command: [\"false\"] vào api được $n dòng (cần đúng 1) — compose.release.yaml của $TAG đổi định dạng khối api:, sửa lệnh sed." >&2
            exit 1
          fi
          # Bản sửa: khác byte (genh thấy có bản mới), cùng cấu hình.
          cp "$rel" "$RUNNER_TEMP/compose-sua.yaml"
          echo '# e2e: bản sửa — khác byte, cùng cấu hình' >>"$RUNNER_TEMP/compose-sua.yaml"
          build genh-tot "$base" "$rel"
          build genh-hong "$base-e2e-hong" "$RUNNER_TEMP/compose-hong.yaml"
          build genh-sua "$base-e2e-sua" "$RUNNER_TEMP/compose-sua.yaml"
          echo "HONG_VER=$base-e2e-hong" >>"$GITHUB_ENV"
          echo "BIN=$out" >>"$GITHUB_ENV"

      - name: Cài sạch bằng genh-tot
        run: |
          set -euo pipefail
          "$BIN/genh-tot" install --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-auto-update

      - name: Chờ /api/v1/ready xanh (bản tốt, tối đa 5 phút)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::ready không xanh sau khi cài bản tốt" >&2; exit 1; }
            sleep 3
          done

      - name: Nạp dữ liệu mẫu + đếm số dòng + đếm bản sao lưu
        run: |
          set -euo pipefail
          data="$GITHUB_WORKSPACE/.github/scripts/e2e_data.sh"
          "$data" seed
          # Chờ số dòng đứng yên (job nền của worker có thể còn ghi thêm ngay sau seed) — tối đa 2 phút.
          "$data" count >"$RUNNER_TEMP/rows-before.txt"
          for _ in $(seq 1 12); do
            sleep 10
            "$data" count >"$RUNNER_TEMP/rows-check.txt"
            if cmp -s "$RUNNER_TEMP/rows-before.txt" "$RUNNER_TEMP/rows-check.txt"; then break; fi
            cp "$RUNNER_TEMP/rows-check.txt" "$RUNNER_TEMP/rows-before.txt"
          done
          cat "$RUNNER_TEMP/rows-before.txt"
          "$data" require-data "$RUNNER_TEMP/rows-before.txt"
          n0="$("$data" backups)"
          echo "bản sao lưu trước khi cập nhật: $n0"
          echo "N0=$n0" >>"$GITHUB_ENV"

      - name: genh-hong update — PHẢI thất bại và tự quay về bản cũ
        run: |
          set -euo pipefail
          rc=0
          "$BIN/genh-hong" update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-self-update \
            2>&1 | tee "$RUNNER_TEMP/update-hong.log" || rc=$?
          if [ "$rc" = 0 ]; then
            echo "::error::bản hỏng mà genh báo thành công — api không bao giờ lên nhưng genh update thoát 0; máy Owner sẽ kẹt ở bản hỏng." >&2
            exit 1
          fi
          if ! grep -qi "rollback" "$RUNNER_TEMP/update-hong.log"; then
            echo "::error::genh update thất bại (mã $rc) nhưng log không nhắc \"rollback\" — không rõ đã quay về bản cũ chưa." >&2
            exit 1
          fi
          echo "OK: bản hỏng → genh update thoát $rc và đã quay về bản cũ (rollback)."

      - name: Chờ /api/v1/ready xanh lại sau khi quay về bản cũ (tối đa 5 phút)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::ready không xanh lại sau khi quay về bản cũ — rollback không đưa dịch vụ về trạng thái chạy được." >&2; exit 1; }
            sleep 3
          done

      - name: Kiểm đã quay về đúng bản cũ (api cũ chạy, compose cũ, update-blocked.json)
        run: |
          set -euo pipefail
          rel="$RUNNER_TEMP/rel/compose.release.yaml"
          api="$(docker ps -q --filter label=com.docker.compose.project=gen-harness --filter label=com.docker.compose.service=api | head -n1)"
          [ -n "$api" ] || { echo "::error::không có container api đang chạy sau khi quay về bản cũ" >&2; exit 1; }
          running="$(docker inspect -f '{{.State.Running}}' "$api")"
          cmd="$(docker inspect -f '{{json .Config.Cmd}}' "$api")"
          img="$(docker inspect -f '{{.Config.Image}}' "$api")"
          # Ảnh của dịch vụ api trong compose cũ (dòng `image:` đầu tiên trong khối `  api:`).
          want="$(awk '/^  api:$/{f=1; next} f && /^  [^ ]/{exit} f && $1=="image:"{print $2; exit}' "$rel")"
          [ -n "$want" ] || { echo "::error::không đọc được ảnh api trong compose.release.yaml của $TAG" >&2; exit 1; }
          echo "api: running=$running cmd=$cmd image=$img (cần $want)"
          [ "$running" = "true" ] || { echo "::error::container api không chạy sau khi quay về bản cũ" >&2; exit 1; }
          [ "$cmd" != '["false"]' ] || { echo "::error::container api vẫn chạy cấu hình bản hỏng (command false) — chưa quay về bản cũ" >&2; exit 1; }
          [ "$img" = "$want" ] || { echo "::error::ảnh api ($img) không phải ảnh của bản cũ ($want)" >&2; exit 1; }
          if ! cmp "$GEN_HARNESS_HOME/deploy/compose.yaml" "$rel"; then
            diff -u "$rel" "$GEN_HARNESS_HOME/deploy/compose.yaml" || true
            echo "::error::deploy/compose.yaml chưa được trả về compose cũ sau rollback — lần khởi động lại sau sẽ lại chạy bản hỏng." >&2
            exit 1
          fi
          blocked="$GEN_HARNESS_HOME/run/update-blocked.json"
          [ -f "$blocked" ] || { echo "::error::thiếu run/update-blocked.json sau khi bản hỏng tự quay về bản cũ — lịch đêm sẽ thử lại bản hỏng mỗi đêm." >&2; exit 1; }
          cat "$blocked"; echo
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])).get("version"); sys.exit(0 if v==sys.argv[2] else "update-blocked.json ghi version %r, cần %r" % (v, sys.argv[2]))' "$blocked" "$HONG_VER"
          python3 -c 'import json,sys; sys.exit("update-blocked.json ghi rollback_failed=true dù đã quay về bản cũ" if json.load(open(sys.argv[1])).get("rollback_failed") else 0)' "$blocked"
          # Hộp thư Console: failed + thông điệp có mã lỗi (GH-E945) — Console chọn lời dẫn theo mã.
          st="$GEN_HARNESS_HOME/run/update-status.json"
          cat "$st"; echo
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); m=d.get("message") or ""; sys.exit(0 if d.get("state")=="failed" and "GH-E945" in m and d.get("finished_at") else "update-status.json cần state=failed + message có GH-E945 + finished_at, được %r" % d)' "$st"
          cp "$st" "$RUNNER_TEMP/status-after-rollback.json"
          echo "OK: đã quay về bản cũ và chặn bản $HONG_VER."

      - name: Số dòng không đổi sau khi quay về bản cũ
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/e2e_data.sh" count >"$RUNNER_TEMP/rows-after-rollback.txt"
          if ! diff -u "$RUNNER_TEMP/rows-before.txt" "$RUNNER_TEMP/rows-after-rollback.txt"; then
            echo "::error::số dòng bảng chính đổi sau khi quay về bản cũ (xem diff ở trên) — khôi phục làm mất hoặc nhân đôi dữ liệu." >&2
            exit 1
          fi
          echo "OK: số dòng các bảng chính giữ nguyên sau khi quay về bản cũ."

      - name: Lịch đêm chạy lại bản hỏng — phải bỏ qua, không sao lưu, không tải ảnh
        run: |
          set -euo pipefail
          data="$GITHUB_WORKSPACE/.github/scripts/e2e_data.sh"
          t0="$(date +%s)"
          rc=0
          "$BIN/genh-hong" update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-self-update \
            2>&1 | tee "$RUNNER_TEMP/update-hong-2.log" || rc=$?
          if [ "$rc" != 0 ]; then
            echo "::error::lịch đêm gặp bản bị chặn tự cập nhật mà genh thoát $rc (cần 0) — timer sẽ báo lỗi mỗi đêm." >&2
            exit 1
          fi
          if ! grep -q "lịch đêm không tự thử lại" "$RUNNER_TEMP/update-hong-2.log"; then
            echo "::error::chạy lại bản đã quay về bản cũ mà genh không in \"lịch đêm không tự thử lại\" — bản bị chặn tự cập nhật chưa có tác dụng." >&2
            exit 1
          fi
          n="$("$data" backups)"
          want=$((N0 + 1))
          if [ "$n" != "$want" ]; then
            echo "::error::số bản sao lưu là $n, cần $want (chỉ bản trước-cập-nhật của lần hỏng) — lịch đêm vẫn sao lưu lại bản bị chặn." >&2
            exit 1
          fi
          pulls="$("$data" pulls-since "$t0")"
          if [ "$pulls" != "0" ]; then
            echo "::error::lịch đêm vẫn tải bản mới ($pulls lượt docker pull) cho bản bị chặn tự cập nhật." >&2
            exit 1
          fi
          # Hộp thư Console giữ NGUYÊN như đêm lỗi (không làm mới finished_at, không ghi đè thông điệp gốc).
          if ! cmp "$RUNNER_TEMP/status-after-rollback.json" "$GEN_HARNESS_HOME/run/update-status.json"; then
            diff -u "$RUNNER_TEMP/status-after-rollback.json" "$GEN_HARNESS_HOME/run/update-status.json" || true
            echo "::error::lịch đêm gặp bản bị chặn mà vẫn ghi đè run/update-status.json — thẻ đỏ của Console không bao giờ tự hết, mất thông điệp lỗi gốc." >&2
            exit 1
          fi
          echo "OK: bản bị chặn — lịch đêm không thử lại, không sao lưu, không tải ảnh, hộp thư giữ nguyên."

      - name: '"Cập nhật ngay" (--if-requested) trên bản bị chặn — VẪN thử lại (không bị chặn như lịch đêm)'
        run: |
          set -euo pipefail
          run="$GEN_HARNESS_HOME/run"
          mkdir -p "$run/request"
          python3 -c "import json,datetime,sys; open(sys.argv[1],'w').write(json.dumps({'requested_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}))" "$run/request/update.json"
          rc=0
          "$BIN/genh-hong" update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --if-requested --no-self-update \
            2>&1 | tee "$RUNNER_TEMP/update-hong-req.log" || rc=$?
          if grep -q "lịch đêm không tự thử lại" "$RUNNER_TEMP/update-hong-req.log"; then
            echo "::error::\"Cập nhật ngay\" trên bản bị chặn mà genh vẫn bỏ qua như lịch đêm — Owner không thử lại được." >&2
            exit 1
          fi
          if [ "$rc" = 0 ] || ! grep -qi "rollback" "$RUNNER_TEMP/update-hong-req.log"; then
            echo "::error::\"Cập nhật ngay\" bản hỏng phải chạy lại đủ đường cập nhật rồi tự quay về bản cũ (thoát $rc)." >&2
            exit 1
          fi
          [ ! -e "$run/request/update.json" ] || { echo "::error::genh không xoá request/update.json — watcher sẽ kích lặp." >&2; exit 1; }
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); o=json.load(open(sys.argv[2])); sys.exit(0 if d.get("state")=="failed" and d.get("started_at")!=o.get("started_at") and "GH-E945" in (d.get("message") or "") else "update-status.json phải là lần chạy MỚI (started_at khác) state=failed có GH-E945, được %r" % d)' "$run/update-status.json" "$RUNNER_TEMP/status-after-rollback.json"
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::ready không xanh lại sau lần \"Cập nhật ngay\" bản hỏng" >&2; exit 1; }
            sleep 3
          done
          echo "OK: \"Cập nhật ngay\" không bị chặn — đã thử lại và tự quay về bản cũ."

      - name: genh-sua update (bản mới hơn đã sửa) — thành công, gỡ chặn, dữ liệu nguyên
        run: |
          set -euo pipefail
          "$BIN/genh-sua" update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-self-update
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::ready không xanh sau khi cập nhật bản sửa" >&2; exit 1; }
            sleep 3
          done
          if [ -e "$GEN_HARNESS_HOME/run/update-blocked.json" ]; then
            cat "$GEN_HARNESS_HOME/run/update-blocked.json"
            echo "::error::cập nhật bản sửa thành công mà run/update-blocked.json vẫn còn — Console sẽ báo nhầm bản bị chặn." >&2
            exit 1
          fi
          "$GITHUB_WORKSPACE/.github/scripts/e2e_data.sh" count >"$RUNNER_TEMP/rows-after-fix.txt"
          if ! diff -u "$RUNNER_TEMP/rows-before.txt" "$RUNNER_TEMP/rows-after-fix.txt"; then
            echo "::error::số dòng bảng chính đổi sau khi cập nhật bản sửa (xem diff ở trên)." >&2
            exit 1
          fi
          echo "OK: bản sửa cài được, gỡ chặn, dữ liệu giữ nguyên."

      - name: (luôn) Gỡ cài đặt + in log để debug
        if: always()
        run: |
          set -uo pipefail
          if [ -x "${BIN:-}/genh-tot" ]; then
            "$BIN/genh-tot" uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --delete-data \
              || "$BIN/genh-tot" uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes || true
          fi
          docker ps -a || true
          for c in $(docker ps -a --format '{{.Names}}' | grep '^gen-harness-' || true); do
            echo "════ $c ════"
            docker logs --tail 200 "$c" 2>&1 || true
          done
          for f in "$GEN_HARNESS_HOME"/run/*.json; do
            [ -f "$f" ] || continue
            echo "── $f ──"; cat "$f"; echo
          done
          if [ -d "$GEN_HARNESS_HOME/logs" ]; then
            for f in "$GEN_HARNESS_HOME"/logs/*; do
              echo "── $f ──"
              tail -n 200 "$f" || true
            done
          fi

  # ── e2e-offsite ──────────────────────────────────────────────────────────
  # v0.1.40 (F-12) — THỬ KHÔI PHỤC THẬT từ bản sao ngoài máy: cài sạch + dữ
  # liệu mẫu → `genh offsite set` vào thư mục KHÔNG tồn tại phải GH-EB01 và
  # KHÔNG tạo thư mục → chọn "ổ USB" giả ($RUNNER_TEMP/usb, cùng ổ với runner
  # nên phải --allow-same-disk) → chạy ĐÚNG lệnh lịch tuần (dòng crontab sau
  # marker, hoặc unit systemd --user) → run/offsite-status.json ok + verified,
  # đúng 1 gói → chép Khoá khôi phục ra kit.txt (giả lập Bộ khôi phục bản in)
  # → `genh uninstall --yes --delete-data` → cài sạch vào GEN_HARNESS_HOME MỚI
  # → `genh import` gói đó bằng kit.txt → số dòng các bảng chính trùng khớp.
  # Không bao giờ in nội dung kit.txt.
  e2e-offsite:
    name: "bản sao ngoài máy: lịch tuần → gói đã kiểm → khôi phục vào cài đặt mới (chế độ ${{ needs.resolve.outputs.mode }})"
    needs: resolve
    if: needs.resolve.outputs.run_e2e == 'true'
    runs-on: ubuntu-24.04
    # Chạy ngoài checkout repo — xem e2e-install.
    defaults:
      run:
        working-directory: /tmp
    timeout-minutes: 60
    env:
      GH_PORT: "8446"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.tag }}
      MODE: ${{ needs.resolve.outputs.mode }}
      OFFSITE_MARKER: "# gen-harness-offsite (genh offsite) — KHONG sua tay"
    steps:
      - name: Lấy mã nguồn (release — đúng mã của tag; pr — commit đang xét)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.mode == 'release' && needs.resolve.outputs.tag || '' }}

      - name: Đặt GEN_HARNESS_HOME (bản cài thứ nhất)
        run: |
          echo "GEN_HARNESS_HOME=$RUNNER_TEMP/gh-off1" >>"$GITHUB_ENV"
          echo "HOME1=$RUNNER_TEMP/gh-off1" >>"$GITHUB_ENV"

      - name: (pr) Trỏ genh vào deploy/compose.yaml của checkout
        if: needs.resolve.outputs.mode == 'pr'
        # Như e2e-install: chế độ pr kiểm CODE của PR, kể cả ảnh api (gh.bundle verify).
        run: echo "GENH_COMPOSE_FILE=$GITHUB_WORKSPACE/deploy/compose.yaml" >>"$GITHUB_ENV"

      - name: Cài Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24.0"

      - name: Tải compose.release.yaml của ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$R" \
            --pattern 'compose.release.yaml' --dir "$RUNNER_TEMP/rel" --clobber

      - name: Build genh từ mã nguồn (nhúng compose.release.yaml như release.yml)
        working-directory: ${{ github.workspace }}/apps/genh
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/rel/compose.release.yaml" internal/compose/embedded_compose.yaml
          if [ "$MODE" = "release" ]; then ver="$TAG"; else ver="dev"; fi
          mkdir -p "$RUNNER_TEMP/bin-off"
          go build -trimpath -ldflags "-s -w -X main.version=$ver" -o "$RUNNER_TEMP/bin-off/genh" ./cmd/genh
          git checkout -- internal/compose/embedded_compose.yaml
          "$RUNNER_TEMP/bin-off/genh" version
          echo "GENH=$RUNNER_TEMP/bin-off/genh" >>"$GITHUB_ENV"

      - name: genh có lệnh offsite chưa (v0.1.40+)
        id: has
        run: |
          set -euo pipefail
          "$GENH" help >"$RUNNER_TEMP/genh-help.txt"
          if grep -q 'genh offsite' "$RUNNER_TEMP/genh-help.txt"; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          elif [ "$MODE" = "pr" ]; then
            echo "::error::genh build từ mã đang xét không có lệnh offsite" >&2; exit 1
          else
            echo "::notice::$TAG cũ hơn v0.1.40 — chưa có genh offsite, bỏ qua."
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Cài sạch (bản thứ nhất)
        if: steps.has.outputs.run == 'true'
        run: |
          set -euo pipefail
          "$GENH" install --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-auto-update

      - name: Chờ /api/v1/ready xanh (tối đa 5 phút)
        if: steps.has.outputs.run == 'true'
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::/api/v1/ready không xanh sau 5 phút" >&2; exit 1; }
            sleep 3
          done

      - name: Nạp dữ liệu mẫu + đếm số dòng (trước)
        if: steps.has.outputs.run == 'true'
        run: |
          set -euo pipefail
          data="$GITHUB_WORKSPACE/.github/scripts/e2e_data.sh"
          "$data" seed
          "$data" count >"$RUNNER_TEMP/rows-before-offsite.txt"
          cat "$RUNNER_TEMP/rows-before-offsite.txt"
          "$data" require-data "$RUNNER_TEMP/rows-before-offsite.txt"

      - name: Đích chưa mount → GH-EB01, KHÔNG tạo thư mục
        if: steps.has.outputs.run == 'true'
        run: |
          set -uo pipefail
          missing="$RUNNER_TEMP/usb-chua-cam"
          rc=0
          "$GENH" offsite set --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" "$missing" >"$RUNNER_TEMP/offsite-missing.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/offsite-missing.log"
          [ "$rc" -ne 0 ] || { echo "::error::genh offsite set vào thư mục không tồn tại phải thoát khác 0" >&2; exit 1; }
          grep -q 'GH-EB01' "$RUNNER_TEMP/offsite-missing.log" || { echo "::error::thiếu mã GH-EB01 (chưa thấy ổ USB/NAS)" >&2; exit 1; }
          [ ! -e "$missing" ] || { echo "::error::genh đã tự tạo $missing — không bao giờ được tạo đích (sẽ ghi vào ổ chính khi USB rút ra)" >&2; exit 1; }
          echo "OK: đích chưa mount → GH-EB01, không tạo gì."

      - name: Chọn "ổ USB" giả (--allow-same-disk --no-run)
        if: steps.has.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/usb"
          "$GENH" offsite set --allow-same-disk --no-run --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" "$RUNNER_TEMP/usb" 2>&1 | tee "$RUNNER_TEMP/offsite-set.log"
          grep -q 'cùng ổ với máy chủ' "$RUNNER_TEMP/offsite-set.log" || { echo "::error::--allow-same-disk phải in cảnh báo cùng ổ" >&2; exit 1; }
          [ -z "$(ls -A "$RUNNER_TEMP/usb")" ] || { echo "::error::--no-run không được ghi gì vào đích" >&2; ls -la "$RUNNER_TEMP/usb"; exit 1; }

      - name: Chạy ĐÚNG lệnh lịch tuần (crontab hoặc systemd --user)
        if: steps.has.outputs.run == 'true'
        run: |
          set -euo pipefail
          line="$(crontab -l 2>/dev/null | awk -v m="$OFFSITE_MARKER" 'f{print; exit} $0==m{f=1}' || true)"
          if [ -n "$line" ]; then
            echo "lịch tuần (crontab): $line"
            cmd="$(printf '%s\n' "$line" | cut -d' ' -f6-)"
            sh -c "$cmd"
          elif systemctl --user cat gen-harness-offsite.service >/dev/null 2>&1; then
            systemctl --user cat gen-harness-offsite.service gen-harness-offsite.timer
            # Type=oneshot: `start` chờ tới khi chạy xong.
            systemctl --user start gen-harness-offsite.service
          else
            echo "::error::không thấy lịch tuần gen-harness-offsite (crontab lẫn systemd --user)" >&2
            crontab -l || true
            exit 1
          fi

      - name: Kiểm run/offsite-status.json ok + verified, đúng 1 gói
        if: steps.has.outputs.run == 'true'
        run: |
          set -euo pipefail
          f="$GEN_HARNESS_HOME/run/offsite-status.json"
          cat "$f"; echo
          python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          assert d.get("schema") == 1, "schema phải là 1: %r" % d.get("schema")
          assert d.get("state") == "ok", "state phải là ok, có %r (error_code=%r)" % (d.get("state"), d.get("error_code"))
          assert d.get("verified") is True, "verified phải true"
          assert d.get("configured") is True and d.get("last_success_at"), "thiếu configured/last_success_at"
          assert len(d.get("key_id") or "") == 8, "key_id phải 8 ký tự hex"
          PY
          n="$(find "$RUNNER_TEMP/usb/gen-harness-offsite" -maxdepth 1 -name '*.ghbundle' | wc -l | tr -d ' ')"
          [ "$n" = "1" ] || { echo "::error::cần đúng 1 tệp .ghbundle trong usb/gen-harness-offsite, có $n" >&2; ls -la "$RUNNER_TEMP/usb/gen-harness-offsite" || true; exit 1; }
          b="$(find "$RUNNER_TEMP/usb/gen-harness-offsite" -maxdepth 1 -name '*.ghbundle' | head -n1)"
          ls -la "$b"
          echo "BUNDLE=$b" >>"$GITHUB_ENV"
          "$GENH" offsite status --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"

      - name: Chép Khoá khôi phục ra kit.txt (giả lập Bộ khôi phục bản in — KHÔNG in ra log)
        if: steps.has.outputs.run == 'true'
        run: |
          set -euo pipefail
          compose_file="${GENH_COMPOSE_FILE:-$GEN_HARNESS_HOME/deploy/compose.yaml}"
          secdir="$(dirname "$compose_file")/../secrets"
          install -m 0600 "$secdir/gh_offsite_key" "$RUNNER_TEMP/kit.txt"
          echo "::add-mask::$(cat "$RUNNER_TEMP/kit.txt")"
          echo "SECDIR=$secdir" >>"$GITHUB_ENV"
          echo "đã chép khoá khôi phục ($(wc -c <"$RUNNER_TEMP/kit.txt") byte)."

      - name: genh uninstall --yes --delete-data (mất máy)
        if: steps.has.outputs.run == 'true'
        run: |
          set -euo pipefail
          "$GENH" uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --delete-data
          left="$(docker volume ls -q --filter label=com.docker.compose.project=gen-harness)"
          [ -z "$left" ] || { echo "::error::--delete-data còn sót volume: $left" >&2; exit 1; }
          if crontab -l 2>/dev/null | grep -qF "$OFFSITE_MARKER"; then
            echo "::error::uninstall phải gỡ lịch tuần bản sao ngoài máy" >&2; exit 1
          fi
          # Chế độ pr: secrets/ nằm ở checkout (dùng chung với bản cài mới) — xoá khoá cũ
          # để chứng minh khôi phục dùng ĐÚNG kit.txt, không phải khoá còn sót trên máy.
          rm -f "$SECDIR/gh_offsite_key"

      - name: Cài sạch vào GEN_HARNESS_HOME mới (máy mới)
        if: steps.has.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "GEN_HARNESS_HOME=$RUNNER_TEMP/gh-off2" >>"$GITHUB_ENV"
          "$GENH" install --install-dir "$RUNNER_TEMP/gh-off2" --port "$GH_PORT" --yes --no-auto-update
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::/api/v1/ready không xanh sau khi cài mới" >&2; exit 1; }
            sleep 3
          done
          # Khoá của BẢN CÀI MỚI (chế độ release: secrets/ cạnh deploy/ của gh-off2; chế độ pr:
          # GENH_COMPOSE_FILE trỏ checkout) — KHÔNG dùng SECDIR (đó là secrets của bản cài cũ, đã xoá
          # khoá ⇒ cmp luôn "khác" và phép thử không kiểm gì).
          new_compose="${GENH_COMPOSE_FILE:-$RUNNER_TEMP/gh-off2/deploy/compose.yaml}"
          new_key="$(dirname "$new_compose")/../secrets/gh_offsite_key"
          [ -s "$new_key" ] || { echo "::error::bản cài mới chưa có Khoá khôi phục tại $new_key" >&2; exit 1; }
          if cmp -s "$new_key" "$RUNNER_TEMP/kit.txt"; then
            echo "::error::bản cài mới trùng khoá khôi phục cũ — phép thử không chứng minh được gì" >&2; exit 1
          fi

      - name: genh import gói ngoài máy bằng Khoá khôi phục (kit.txt)
        if: steps.has.outputs.run == 'true'
        run: |
          set -euo pipefail
          GH_BUNDLE_PASSWORD="$(cat "$RUNNER_TEMP/kit.txt")"
          export GH_BUNDLE_PASSWORD
          # Mọi cờ đứng TRƯỚC đường dẫn tệp (package flag của Go).
          "$GENH" import --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes "$BUNDLE"
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::/api/v1/ready không xanh sau import" >&2; exit 1; }
            sleep 3
          done

      - name: Số dòng sau khôi phục phải trùng trước khi mất máy
        if: steps.has.outputs.run == 'true'
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/e2e_data.sh" count >"$RUNNER_TEMP/rows-after-offsite.txt"
          cat "$RUNNER_TEMP/rows-after-offsite.txt"
          if ! diff "$RUNNER_TEMP/rows-before-offsite.txt" "$RUNNER_TEMP/rows-after-offsite.txt"; then
            echo "::error::khôi phục từ bản sao ngoài máy lệch số dòng (diff ở trên)" >&2; exit 1
          fi
          echo "OK: khôi phục từ bản sao ngoài máy vào cài đặt mới — số dòng trùng khớp."

      - name: (luôn) Gỡ cài đặt + in log để debug
        if: always()
        run: |
          set -uo pipefail
          if [ -x "${GENH:-}" ]; then
            "$GENH" uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --delete-data || true
          fi
          docker ps -a || true
          for c in $(docker ps -a --format '{{.Names}}' | grep '^gen-harness-' || true); do
            echo "════ $c ════"
            docker logs --tail 200 "$c" 2>&1 || true
          done
          for d in "${HOME1:-}" "$RUNNER_TEMP/gh-off2"; do
            [ -n "$d" ] && [ -d "$d/logs" ] || continue
            for f in "$d"/logs/*; do
              echo "── $f ──"
              tail -n 200 "$f" || true
            done
            [ -f "$d/run/offsite-status.json" ] && { echo "── $d/run/offsite-status.json ──"; cat "$d/run/offsite-status.json"; }
          done
          crontab -l 2>/dev/null || true

  # ── e2e-nightly-real ─────────────────────────────────────────────────────
  # v0.1.53 (F-100): chạy THẬT lịch tự cập nhật đêm (gen-harness-update.timer/.service) và trình nhận yêu cầu
  # (gen-harness-update-request.path/.service — nút "Cập nhật ngay"/"Khôi phục" của Console) dưới một user
  # manager systemd THẬT có linger (tiến trình nền chạy cả khi không ai đăng nhập). Lý do: các job khác cài bằng
  # --no-auto-update hoặc trên runner không có `systemctl --user` (genh rơi về crontab), nên chưa bao giờ có ai
  # chạy timer/.path thật — máy Owner kẹt ở v0.1.44 mà E2E vẫn xanh (lịch đêm TẮT 10 ngày không ai biết).
  # Ở đây KHÔNG truyền --no-auto-update: chính `genh install` phải bật lịch đêm.
  # Kịch bản: user manager + linger → cài (cổng 9443 ở chế độ pr, để kiểm --port vào unit) → timer enabled/active,
  # lần kế tiếp trong 24 giờ 31 phút, unit mang --install-dir/--port/Environment → chạy thật service đêm
  # (Result=success, log có dòng mới, timer vẫn còn lịch) → nút Console ghi yêu cầu TỪ container api (đúng uid
  # thật) → ca tệp yêu cầu không xoá được (GH-E94C, .path không kích lặp vô hạn) → tự lành khi timer bị tắt →
  # opt-out (Sếp đã chủ động tắt) không bị tự lành → bật lại → ca hết hạn mức inotify (v0.1.54: .path failed
  # "Result: resources" ⇒ `genh auto-update status` tự chữa sang timer dự phòng quét mỗi phút, sửa gốc + enable ⇒ .path
  # sống lại, dự phòng gỡ) → gỡ cài đặt.
  # Mọi bước kiểm chỉ ĐỌC trạng thái qua systemctl/journalctl/tệp run/ — không in config/secrets.json hay .env.
  # promote đòi job này xanh (check_release_gate.py giữ bất biến). Chạy tay workflow cho tag cũ hơn v0.1.54 (genh
  # chưa có lịch đêm tự lành / người gác yêu cầu tự chữa) sẽ đỏ ở job này — promote tay bản cũ dùng skip_e2e.
  # Ghi chú vận hành: `--port` của genh chỉ là cổng genh kiểm /api/v1/ready; cổng proxy thật do compose đọc GH_PORT
  # (chế độ pr ghi GH_PORT vào deploy/.env, vì lịch đêm/trình nhận yêu cầu chạy ngoài phiên shell của job).
  e2e-nightly-real:
    name: lịch tự cập nhật đêm + trình nhận yêu cầu chạy thật dưới user manager có linger (chế độ ${{ needs.resolve.outputs.mode }}${{ needs.resolve.outputs.mode == 'release' && format(', {0}', needs.resolve.outputs.tag) || '' }})
    needs: resolve
    if: needs.resolve.outputs.run_e2e == 'true'
    runs-on: ubuntu-24.04
    # Chạy ngoài checkout repo — xem e2e-install.
    defaults:
      run:
        working-directory: /tmp
    timeout-minutes: 45
    env:
      # pr: cổng 9443 để kiểm --port đi vào unit lịch đêm; release: install.sh dùng cổng mặc định 8443.
      GH_PORT: ${{ needs.resolve.outputs.mode == 'pr' && '9443' || '8443' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.tag }}
      MODE: ${{ needs.resolve.outputs.mode }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: User manager thật + linger (sudo loginctl enable-linger)
        run: |
          set -euo pipefail
          user="$(id -un)"
          uid="$(id -u)"
          # linger = tiến trình nền của người dùng chạy cả khi không ai đăng nhập — runner không có phiên đăng
          # nhập, nên không bật thì `systemctl --user` không có user manager để nói chuyện.
          sudo loginctl enable-linger "$user"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >>"$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >>"$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/${uid}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${uid}/bus"
          state=""
          deadline=$((SECONDS + 30))
          while :; do
            state="$(systemctl --user is-system-running 2>/dev/null || true)"
            case "$state" in running|degraded) break ;; esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              systemctl status "user@${uid}.service" --no-pager || true
              journalctl -u "user@${uid}.service" --no-pager -n 50 || true
              echo "::error::user manager systemd của $user không lên (is-system-running='${state:-<rỗng>}') sau 30 giây — job này cần systemctl --user thật." >&2
              exit 1
            fi
            sleep 1
          done
          echo "user manager: $state"
          got="$(loginctl show-user "$user" -p Linger)"
          echo "$got"
          if [ "$got" != "Linger=yes" ]; then
            echo "::error::loginctl báo '$got', cần Linger=yes sau sudo loginctl enable-linger." >&2
            exit 1
          fi

      - name: Đặt GEN_HARNESS_HOME (thư mục cài đặt tạm của job này)
        run: echo "GEN_HARNESS_HOME=$RUNNER_TEMP/gh-nightly" >>"$GITHUB_ENV"

      - name: (pr) Trỏ genh vào deploy/compose.yaml của checkout
        if: needs.resolve.outputs.mode == 'pr'
        # Như e2e-install: chế độ pr kiểm CODE của PR (kể cả ảnh api/web). GENH_COMPOSE_FILE phải có trong môi
        # trường LÚC `genh install` chạy để unit lịch đêm mang nó theo (lịch chạy ngoài phiên shell).
        run: |
          set -euo pipefail
          echo "GENH_COMPOSE_FILE=$GITHUB_WORKSPACE/deploy/compose.yaml" >>"$GITHUB_ENV"
          # `--port` của genh chỉ là cổng genh gọi /api/v1/ready; cổng proxy thật do compose đọc từ GH_PORT (mặc định
          # 8443). Lịch đêm và trình nhận yêu cầu chạy NGOÀI phiên shell nên không có biến GH_PORT của job — máy Owner
          # dùng cổng khác phải để GH_PORT trong .env cạnh compose.yaml (genh giữ nguyên các dòng lạ khi ghi .env),
          # nếu không bản cập nhật tạo lại proxy ở 8443 và /ready ở cổng đã cài không bao giờ xanh (tự quay về bản cũ).
          printf 'GH_PORT=%s\n' "$GH_PORT" >"$GITHUB_WORKSPACE/deploy/.env"

      # ── Chế độ "pr": build genh từ source, ghim compose.release.yaml đã publish (như e2e-install) ────────
      - name: (pr) Cài Go
        if: needs.resolve.outputs.mode == 'pr'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24.0"

      - name: (pr) Tải deploy/compose.release.yaml của bản chính thức ${{ needs.resolve.outputs.tag }}
        if: needs.resolve.outputs.mode == 'pr'
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$R" \
            --pattern 'compose.release.yaml' --dir "$RUNNER_TEMP/pinned" --clobber

      - name: (pr) Ghim compose.yaml đã publish vào binary (giống bước cùng tên ở release.yml)
        if: needs.resolve.outputs.mode == 'pr'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP/pinned/compose.release.yaml" apps/genh/internal/compose/embedded_compose.yaml
          echo "đã ghi đè embedded_compose.yaml bằng compose.release.yaml của $TAG (digest thật):"
          grep '^\s*image:' apps/genh/internal/compose/embedded_compose.yaml || true

      - name: (pr) Build genh từ mã nguồn đang xét
        if: needs.resolve.outputs.mode == 'pr'
        working-directory: ${{ github.workspace }}/apps/genh
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          # Giữ version mặc định "dev" (như e2e-install): selfupdate bỏ qua tự tải binary, chỉ kiểm CODE genh.
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/genh" ./cmd/genh
          echo "GENH=$RUNNER_TEMP/genh" >>"$GITHUB_ENV"

      # ── Chế độ "release": install.sh thật của ĐÚNG tag (cổng mặc định 8443) ──────────────────────────────
      - name: (release) Tải install.sh của bản phát hành ${{ needs.resolve.outputs.tag }}
        if: needs.resolve.outputs.mode == 'release'
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$R" \
            --pattern 'install.sh' --dir "$RUNNER_TEMP" --clobber
          chmod +x "$RUNNER_TEMP/install.sh"

      - name: (release) Cài sạch bằng install.sh thật của ${{ needs.resolve.outputs.tag }} (không --no-auto-update)
        if: needs.resolve.outputs.mode == 'release'
        run: |
          set -euo pipefail
          # Xem bước cùng tên ở e2e-install: GEN_HARNESS_RELEASE_TAG để install.sh tải ĐÚNG tag đang kiểm (có thể là
          # bản thử), không cờ nào — nên chính `genh install` phải bật lịch đêm (không có dấu opt-out).
          GEN_HARNESS_RELEASE_TAG="$TAG" "$RUNNER_TEMP/install.sh"
          echo "GENH=${GEN_HARNESS_HOME}/bin/genh" >>"$GITHUB_ENV"

      - name: (release) Kiểm genh vừa cài đúng tag ${{ needs.resolve.outputs.tag }}
        if: needs.resolve.outputs.mode == 'release'
        run: |
          set -euo pipefail
          out="$("$GENH" version)"
          echo "$out"
          case " $out " in
            *" $TAG "*) echo "OK: genh đã cài đúng $TAG" ;;
            *)
              echo "::error::genh vừa cài báo '$out', không phải $TAG — install.sh đã tải nhầm bản (kiểm GEN_HARNESS_RELEASE_TAG)." >&2
              exit 1
              ;;
          esac

      - name: (pr) Cài sạch bằng genh build từ source — KHÔNG --no-auto-update (chính install bật lịch đêm)
        if: needs.resolve.outputs.mode == 'pr'
        run: |
          set -euo pipefail
          "$GENH" install --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes

      - name: Chờ /api/v1/ready xanh (tối đa 5 phút)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o "$RUNNER_TEMP/ready.json" "https://localhost:${GH_PORT}/api/v1/ready"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::/api/v1/ready không xanh sau 5 phút" >&2
              exit 1
            fi
            sleep 3
          done
          cat "$RUNNER_TEMP/ready.json"
          echo

      - name: Lịch đêm sau install — timer is-enabled + timer is-active + lần kế tiếp trong 24 giờ 31 phút
        run: |
          set -euo pipefail
          t=gen-harness-update.timer
          en="$(systemctl --user is-enabled "$t" 2>&1 || true)"
          echo "timer is-enabled: $en"
          [ "$en" = "enabled" ] || { echo "::error::$t is-enabled = '$en' (cần enabled) — genh install không bật lịch tự cập nhật đêm." >&2; systemctl --user list-timers --all --no-pager || true; exit 1; }
          ac="$(systemctl --user is-active "$t" 2>&1 || true)"
          echo "timer is-active: $ac"
          [ "$ac" = "active" ] || { echo "::error::$t is-active = '$ac' (cần active) — lịch đêm đã cài nhưng không chạy." >&2; systemctl --user status "$t" --no-pager || true; exit 1; }
          # `systemctl show` in mốc giờ dạng "Sun 2026-10-11 03:09:12 UTC" (cờ --timestamp=unix chỉ có tác dụng ở
          # `status`/`list-timers`, không ở `show`) — đổi sang giây bằng date -d; chấp nhận cả dạng "@giây".
          next_epoch() {
            local v
            v="$(systemctl --user show "$1" -p NextElapseUSecRealtime --value 2>/dev/null || true)"
            echo "NextElapseUSecRealtime của $1: '${v:-<rỗng>}'" >&2
            case "$v" in ''|n/a|0|@0) return 1 ;; @*) printf '%s' "${v#@}" ;; *) date -d "$v" +%s ;; esac
          }
          next="$(next_epoch "$t")" || { echo "::error::$t không có NextElapseUSecRealtime — timer active mà không có lần chạy kế tiếp." >&2; exit 1; }
          now="$(date +%s)"
          limit=$((now + 24 * 3600 + 31 * 60))
          echo "lần kế tiếp: $(date -d "@$next" '+%F %T %Z') (còn $(( (next - now) / 60 )) phút)"
          if [ "$next" -le 0 ] || [ "$next" -gt "$limit" ]; then
            echo "::error::lần chạy kế tiếp ($next) không nằm trong 24 giờ 31 phút tới ($limit) — OnCalendar sai hoặc timer mất lịch." >&2
            exit 1
          fi
          echo "OK: timer enabled + active, có lần chạy kế tiếp trong 24 giờ 31 phút."

      - name: Trình nhận yêu cầu cài bằng systemd (genh.json updater=systemd, tự cập nhật đêm BẬT)
        run: |
          set -euo pipefail
          run="$GEN_HARNESS_HOME/run"
          cat "$run/genh.json"
          echo
          python3 - "$run/genh.json" <<'PY'
          import json, sys
          i = json.load(open(sys.argv[1], encoding="utf-8"))
          assert i.get("updater") == "systemd", "genh.json updater=%r (cần systemd — runner có user manager thật): %s" % (i.get("updater"), i)
          assert "update" in (i.get("requests") or []), "genh.json thiếu 'update' trong requests: %s" % i
          assert i.get("auto_update_enabled") is True, "genh.json auto_update_enabled=%r sau install (máy Owner từng ghi false): %s" % (i.get("auto_update_enabled"), i)
          PY
          p="$(systemctl --user is-active gen-harness-update-request.path 2>&1 || true)"
          [ "$p" = "active" ] || { echo "::error::gen-harness-update-request.path is-active = '$p' (cần active) — nút Cập nhật ngay không có ai nhận." >&2; exit 1; }
          echo "OK: trình nhận yêu cầu (.path) active, genh.json updater=systemd."

      - name: Unit lịch đêm mang đủ --install-dir, Environment=GEN_HARNESS_HOME, (pr) --port 9443 và GENH_COMPOSE_FILE
        run: |
          set -euo pipefail
          unit="$HOME/.config/systemd/user/gen-harness-update.service"
          [ -f "$unit" ] || { echo "::error::không thấy $unit" >&2; ls -la "$HOME/.config/systemd/user" || true; exit 1; }
          cat "$unit"
          grep -Fq -e "--install-dir $GEN_HARNESS_HOME" "$unit" \
            || { echo "::error::unit lịch đêm thiếu '--install-dir $GEN_HARNESS_HOME' — lịch chạy ngoài phiên shell sẽ cập nhật sai bản cài (hoặc không thấy bản cài)." >&2; exit 1; }
          grep -Fq "Environment=GEN_HARNESS_HOME=$GEN_HARNESS_HOME" "$unit" \
            || { echo "::error::unit lịch đêm thiếu 'Environment=GEN_HARNESS_HOME=$GEN_HARNESS_HOME'." >&2; exit 1; }
          if [ "$MODE" = "pr" ]; then
            grep -Fq -e "--port 9443" "$unit" \
              || { echo "::error::unit lịch đêm thiếu '--port 9443' — bản cài không dùng cổng mặc định bị kiểm /ready sai cổng." >&2; exit 1; }
            grep -Fq "GENH_COMPOSE_FILE=$GENH_COMPOSE_FILE" "$unit" \
              || { echo "::error::unit lịch đêm thiếu 'GENH_COMPOSE_FILE=$GENH_COMPOSE_FILE' — lịch chạy ngoài phiên shell sẽ dùng compose khác." >&2; exit 1; }
          fi
          echo "OK: unit lịch đêm đủ đối số và môi trường."

      - name: genh auto-update status nói thật (BẬT, Lần kế tiếp, Linger có)
        run: |
          set -euo pipefail
          "$GENH" auto-update status --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" | tee "$RUNNER_TEMP/au-status.txt"
          for want in 'BẬT' 'Lần kế tiếp' 'Linger: có'; do
            grep -Fq "$want" "$RUNNER_TEMP/au-status.txt" \
              || { echo "::error::genh auto-update status thiếu '$want' (xem đầu ra ở trên) — trạng thái không phản ánh lịch đêm thật." >&2; exit 1; }
          done
          if grep -Fq 'NHƯNG KHÔNG CHẠY' "$RUNNER_TEMP/au-status.txt"; then
            echo "::error::genh auto-update status báo 'BẬT NHƯNG KHÔNG CHẠY' trong khi timer active." >&2; exit 1
          fi
          if grep -Fq 'Lần kế tiếp: không rõ' "$RUNNER_TEMP/au-status.txt"; then
            echo "::error::genh auto-update status không biết lần kế tiếp trong khi systemctl show có NextElapseUSecRealtime." >&2; exit 1
          fi
          echo "OK: auto-update status khớp systemd."

      - name: Chạy thật service đêm — systemctl --user start gen-harness-update.service (oneshot, chờ xong)
        run: |
          set -euo pipefail
          log="$GEN_HARNESS_HOME/logs/auto-update.log"
          n0=0
          if [ -f "$log" ]; then n0="$(wc -l <"$log" | tr -d ' ')"; fi
          t0="$(date +%s)"
          echo "log lịch đêm trước khi chạy: $n0 dòng; mốc t0=$t0"
          rc=0
          timeout 1500 systemctl --user start gen-harness-update.service || rc=$?
          result="$(systemctl --user show gen-harness-update.service -p Result)"
          echo "systemctl start thoát $rc; $result"
          if [ "$rc" != "0" ] || [ "$result" != "Result=success" ]; then
            systemctl --user status gen-harness-update.service --no-pager || true
            journalctl --user -u gen-harness-update.service --no-pager | tail -100 || true
            [ -f "$log" ] && tail -n 50 "$log" || true
            echo "::error::service lịch đêm không thành công (thoát $rc, $result) — đúng lỗi máy Owner: timer kích mà service không chạy được." >&2
            exit 1
          fi
          n1=0
          if [ -f "$log" ]; then n1="$(wc -l <"$log" | tr -d ' ')"; fi
          echo "log lịch đêm sau khi chạy: $n1 dòng"
          if [ "$n1" -le "$n0" ]; then
            echo "::error::service chạy xong mà logs/auto-update.log không có dòng mới ($n0 → $n1) — Boss sẽ không thấy lịch đêm có chạy." >&2
            exit 1
          fi
          echo "── dòng mới của logs/auto-update.log ──"
          tail -n +"$((n0 + 1))" "$log"
          # Bắt ứng viên H-b: daemon-reload/enable từ BÊN TRONG service (genh gọi lại systemctl) làm timer mất lịch.
          t=gen-harness-update.timer
          en="$(systemctl --user is-enabled "$t" 2>&1 || true)"
          ac="$(systemctl --user is-active "$t" 2>&1 || true)"
          nxt="$(systemctl --user show "$t" -p NextElapseUSecRealtime --value 2>/dev/null || true)"
          echo "SAU lần chạy — timer is-enabled: $en; is-active: $ac; NextElapseUSecRealtime: '${nxt:-<rỗng>}'"
          [ "$en" = "enabled" ] || { echo "::error::sau khi service đêm chạy, $t is-enabled = '$en' (cần enabled) — lịch bị tắt từ bên trong lần chạy." >&2; exit 1; }
          [ "$ac" = "active" ] || { echo "::error::sau khi service đêm chạy, $t is-active = '$ac' (cần active)." >&2; exit 1; }
          case "$nxt" in ''|n/a|0|@0) echo "::error::sau khi service đêm chạy, $t mất NextElapseUSecRealtime — lịch đêm biến mất sau lần chạy đầu." >&2; exit 1 ;; esac
          python3 - "$GEN_HARNESS_HOME/run/nightly-status.json" "$t0" <<'PY'
          import datetime, json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          t0 = int(sys.argv[2])
          print(json.dumps(d, ensure_ascii=False, indent=1))
          assert d.get("schema") == 1, "nightly-status.json schema=%r" % d.get("schema")
          raw = d.get("last_run_at") or ""
          assert raw, "nightly-status.json thiếu last_run_at sau lần chạy lịch đêm"
          at = datetime.datetime.fromisoformat(raw.replace("Z", "+00:00")).timestamp()
          assert at >= t0 - 5, "last_run_at=%s cũ hơn lần chạy vừa rồi (t0=%d)" % (raw, t0)
          assert d.get("last_result") in ("done", "up_to_date", "deferred"), "last_result=%r sau lần chạy thành công" % d.get("last_result")
          PY
          echo "OK: service đêm chạy thật (Result=success), log có dòng mới, timer còn nguyên lịch, nightly-status.json có last_run_at mới."

      - name: Nút "Cập nhật ngay" — api ghi yêu cầu (đúng uid), trình nhận yêu cầu (.path) nhận và cập nhật xong
        run: |
          set -euo pipefail
          run="$GEN_HARNESS_HOME/run"
          starting_count() {
            local out
            out="$(journalctl --user -u gen-harness-update-request.service -o cat --no-pager 2>/dev/null || true)"
            if [ -z "$out" ]; then
              out="$(sudo -n journalctl --user-unit gen-harness-update-request.service -o cat --no-pager 2>/dev/null || true)"
            fi
            printf '%s\n' "$out" | grep -c '^Starting ' || true
          }
          p="$(systemctl --user is-active gen-harness-update-request.path 2>&1 || true)"
          [ "$p" = "active" ] || { echo "::error::gen-harness-update-request.path is-active = '$p' trước khi bấm nút." >&2; exit 1; }
          s0="$(starting_count)"
          before="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('started_at',''))" "$run/update-status.json" 2>/dev/null || true)"
          api="$(docker ps --format '{{.Names}}' | grep -E '^gen-harness-api-[0-9]+$' | head -1)"
          [ -n "$api" ] || { echo "::error::không thấy container api" >&2; docker ps -a; exit 1; }
          # Như nút trong Console (gh/system_api/update.py): CHÍNH container api (uid 10001, khác người dùng
          # máy chủ) ghi run/request/update.json qua bind mount bằng gh.hostlink_io.write_request.
          docker exec -i "$api" python - <<'PY'
          import datetime, uuid
          from pathlib import Path
          from gh.config import get_settings
          from gh.hostlink_io import write_request
          d = Path(get_settings().host_link_dir) / "request"
          req = {"id": str(uuid.uuid4()), "requested_at": datetime.datetime.now(datetime.timezone.utc).isoformat(), "by": "e2e-nightly"}
          write_request(d, "update.json", req)
          print("đã ghi", d / "update.json", req["requested_at"])
          PY
          # (a) trình nhận yêu cầu phải nhận trong 120 giây: tệp yêu cầu biến mất.
          deadline=$((SECONDS + 120))
          while [ -e "$run/request/update.json" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              ls -la "$run" "$run/request"
              systemctl --user status gen-harness-update-request.path gen-harness-update-request.service --no-pager || true
              echo "::error::trình nhận yêu cầu (.path) không nhận update.json trong 120 giây — đúng lỗi Console 'Máy chủ chưa nhận yêu cầu'." >&2
              exit 1
            fi
            sleep 2
          done
          echo "tệp yêu cầu đã được nhận sau $((SECONDS - deadline + 120)) giây."
          # (b) genh cập nhật xong (pr: chạy đủ đường cập nhật compose ngoài; tối đa 10 phút).
          deadline=$((SECONDS + 600))
          while :; do
            st="$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(d.get('state',''), d.get('started_at',''))" "$run/update-status.json" 2>/dev/null || true)"
            state="${st%% *}"; started="${st#* }"
            if [ "$started" != "$before" ] && [ "$state" = "done" ]; then break; fi
            if [ "$started" != "$before" ] && [ "$state" = "failed" ]; then
              cat "$run/update-status.json"; echo "::error::genh báo cập nhật lỗi" >&2; exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$run/update-status.json" 2>/dev/null || true
              echo "::error::update-status.json không chuyển sang done trong 10 phút" >&2; exit 1
            fi
            sleep 5
          done
          cat "$run/update-status.json"; echo
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do sleep 3; done
          pf="$(systemctl --user is-failed gen-harness-update-request.path 2>&1 || true)"
          echo "gen-harness-update-request.path is-failed: $pf"
          [ "$pf" != "failed" ] || { echo "::error::gen-harness-update-request.path ở trạng thái failed sau một yêu cầu bình thường." >&2; systemctl --user status gen-harness-update-request.path --no-pager || true; exit 1; }
          nr="$(systemctl --user show gen-harness-update-request.service -p NRestarts)"
          s1="$(starting_count)"
          echo "$nr; số lần gen-harness-update-request.service được khởi động (Starting): $s0 → $s1"
          [ "${nr#NRestarts=}" -le 2 ] || { echo "::error::$nr — service nhận yêu cầu khởi động lại quá nhiều." >&2; exit 1; }
          [ $((s1 - s0)) -ge 1 ] || { echo "::error::không thấy dòng 'Starting gen-harness-update-request.service' trong journal sau khi bấm nút — .path không kích service hoặc không đọc được journal." >&2; journalctl --user -u gen-harness-update-request.service --no-pager | tail -50 || true; exit 1; }
          [ $((s1 - s0)) -le 2 ] || { echo "::error::một yêu cầu bình thường mà service nhận yêu cầu được khởi động $((s1 - s0)) lần (cần ≤ 2)." >&2; journalctl --user -u gen-harness-update-request.service --no-pager | tail -50 || true; exit 1; }
          echo "OK: nút Cập nhật ngay đi hết đường .path → genh → done, không kích lặp."

      - name: run/nightly-status.json đúng hợp đồng sau cập nhật (Console đọc tệp này)
        run: |
          set -euo pipefail
          python3 - "$GEN_HARNESS_HOME/run/nightly-status.json" <<'PY'
          import datetime, json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          print(json.dumps(d, ensure_ascii=False, indent=1))
          want_keys = {"schema", "mechanism", "enabled", "active", "unit_present", "opted_out", "since", "last_run_at",
                       "last_result", "next_run_at", "linger", "request_watcher", "checked_at"}
          missing = want_keys - set(d)
          assert not missing, "nightly-status.json thiếu khoá: %s" % sorted(missing)
          assert d["schema"] == 1, "schema=%r" % d["schema"]
          assert d["mechanism"] == "systemd", "mechanism=%r (runner có user manager thật)" % d["mechanism"]
          assert d["enabled"] is True and d["active"] is True and d["unit_present"] is True, "lịch đêm không bật/chạy: %s" % d
          assert d["opted_out"] is False, "opted_out=%r trong khi Sếp chưa tắt" % d["opted_out"]
          assert d["linger"] == "yes", "linger=%r (đã sudo loginctl enable-linger)" % d["linger"]
          assert d["request_watcher"] == "active", "request_watcher=%r" % d["request_watcher"]
          assert d["next_run_at"], "next_run_at rỗng trong khi timer có lần chạy kế tiếp"
          for k in ("since", "last_run_at", "next_run_at", "checked_at"):
              if d[k]:
                  datetime.datetime.fromisoformat(d[k].replace("Z", "+00:00"))
          PY
          echo "OK: nightly-status.json đúng hợp đồng (systemd, bật + chạy, linger yes, trình nhận yêu cầu active)."

      - name: Ca tệp yêu cầu không xoá được — GH-E94C, không làm yêu cầu, .path không kích lặp vô hạn
        run: |
          set -euo pipefail
          run="$GEN_HARNESS_HOME/run"
          req="$run/request"
          svc=gen-harness-update-request.service
          pth=gen-harness-update-request.path
          starting_count() {
            local out
            out="$(journalctl --user -u "$svc" -o cat --no-pager 2>/dev/null || true)"
            if [ -z "$out" ]; then
              out="$(sudo -n journalctl --user-unit "$svc" -o cat --no-pager 2>/dev/null || true)"
            fi
            printf '%s\n' "$out" | grep -c '^Starting ' || true
          }
          # Ghi lại quyền/nhóm TRƯỚC khi chmod để khôi phục đúng (và luôn khôi phục kể cả khi bước đỏ giữa chừng).
          mode0="$(stat -c %a "$req")"; grp0="$(stat -c %g "$req")"
          echo "run/request trước: quyền $mode0, nhóm $grp0"
          # Khôi phục bằng sudo: chmod của người không thuộc nhóm 10001 sẽ lặng lẽ bỏ bit setgid (2770 → 770).
          restore_perms() {
            sudo chmod "$mode0" "$req" 2>/dev/null || chmod "$mode0" "$req" || true
          }
          trap restore_perms EXIT
          systemctl --user stop "$pth"
          api="$(docker ps --format '{{.Names}}' | grep -E '^gen-harness-api-[0-9]+$' | head -1)"
          [ -n "$api" ] || { echo "::error::không thấy container api" >&2; docker ps -a; exit 1; }
          # Cùng đường nút Console đi (xem bước "Cập nhật ngay"): api ghi run/request/update.json.
          docker exec -i "$api" python - <<'PY'
          import datetime, uuid
          from pathlib import Path
          from gh.config import get_settings
          from gh.hostlink_io import write_request
          d = Path(get_settings().host_link_dir) / "request"
          req = {"id": str(uuid.uuid4()), "requested_at": datetime.datetime.now(datetime.timezone.utc).isoformat(), "by": "e2e-nightly"}
          write_request(d, "update.json", req)
          print("đã ghi", d / "update.json", req["requested_at"])
          PY
          [ -f "$req/update.json" ] || { echo "::error::api không ghi được update.json" >&2; ls -la "$req"; exit 1; }
          # Bỏ quyền ghi thư mục: genh (chủ thư mục) đọc được yêu cầu nhưng KHÔNG xoá được.
          chmod 0555 "$req" 2>/dev/null || sudo chmod 0555 "$req"
          echo "run/request sau chmod: quyền $(stat -c %a "$req")"
          if [ -w "$req" ]; then
            echo "::error::run/request vẫn ghi được sau chmod 0555 (runner chạy bằng root?) — không dựng được ca tệp không xoá được." >&2
            exit 1
          fi
          s0="$(starting_count)"
          systemctl --user start "$pth"
          # Chờ tối đa 90 giây: update-status.json phải là failed kèm GH-E94C.
          deadline=$((SECONDS + 90))
          while :; do
            out="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d.get("state","")+"\t"+str(d.get("message","")))' "$run/update-status.json" 2>/dev/null || true)"
            state="${out%%$'\t'*}"; msg="${out#*$'\t'}"
            if [ "$state" = "failed" ] && [[ "$msg" == *GH-E94C* ]]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$run/update-status.json" 2>/dev/null || true
              ls -la "$run" "$req"
              systemctl --user status "$pth" "$svc" --no-pager || true
              echo "::error::sau 90 giây update-status.json không là failed kèm GH-E94C (state='$state') — genh coi lỗi xoá là đã nhận hoặc không báo Console." >&2
              exit 1
            fi
            sleep 3
          done
          echo "update-status: state=$state — $msg"
          # Cho .path đủ thời gian kích lặp (nếu có lỗi): rồi đếm số lần service được khởi động.
          sleep 20
          s1="$(starting_count)"
          sleep 15
          s2="$(starting_count)"
          journalctl --user -u "$svc" --no-pager 2>/dev/null | tail -30 || true
          # Service oneshot kết thúc bằng "Finished", nên mỗi lần khởi động là một dòng "Starting …" trong journal.
          echo "Số lần $svc được khởi động (Starting): trước $s0, sau 20 giây $s1, sau 35 giây $s2 (tăng $((s2 - s0)))"
          systemctl --user is-failed "$pth" "$svc" || true
          [ $((s2 - s0)) -ge 1 ] || { echo "::error::không thấy dòng 'Starting $svc' nào sau khi bật lại .path với tệp yêu cầu đang nằm đó — .path không kích service hoặc không đọc được journal." >&2; exit 1; }
          [ $((s2 - s0)) -le 6 ] || { echo "::error::$svc được khởi động $((s2 - s0)) lần (cần ≤ 6 = StartLimitBurst 5 + 1) — .path kích lặp vô hạn trên tệp yêu cầu không xoá được." >&2; exit 1; }
          [ "$s2" = "$s1" ] || { echo "::error::$svc vẫn được khởi động thêm sau khi báo GH-E94C ($s1 → $s2) — .path còn đang kích lặp." >&2; exit 1; }
          [ -e "$req/update.json" ] || { echo "::error::tệp yêu cầu biến mất dù không xoá được — yêu cầu mất dấu." >&2; exit 1; }
          echo "OK: GH-E94C, tệp yêu cầu còn nguyên, service khởi động $((s2 - s0)) lần (≤ 6)."
          # Dọn: khôi phục quyền cũ, xoá tệp, genh update ⇒ .path active, không failed (genh tự reset-failed).
          restore_perms
          trap - EXIT
          [ "$(stat -c %a "$req")" = "$mode0" ] && [ "$(stat -c %g "$req")" = "$grp0" ] \
            || { echo "::error::không khôi phục được quyền run/request (còn $(stat -c %a "$req") nhóm $(stat -c %g "$req"), cần $mode0 nhóm $grp0)." >&2; exit 1; }
          rm -f "$req/update.json"
          "$GENH" update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          pa="$(systemctl --user is-active "$pth" 2>&1 || true)"
          pf="$(systemctl --user is-failed "$pth" 2>&1 || true)"
          echo "$pth is-active: $pa; is-failed: $pf"
          [ "$pa" = "active" ] || { echo "::error::sau genh update, $pth is-active = '$pa' (cần active) — genh không reset-failed/enable lại trình nhận yêu cầu." >&2; systemctl --user status "$pth" --no-pager || true; exit 1; }
          [ "$pf" != "failed" ] || { echo "::error::sau genh update, $pth vẫn failed." >&2; exit 1; }
          echo "OK: sau khi dọn và genh update, trình nhận yêu cầu active, không failed."

      - name: Tự lành — timer bị tắt thì genh update bật lại (đã bật lại), nightly timer enabled + active
        run: |
          set -euo pipefail
          t=gen-harness-update.timer
          systemctl --user disable --now "$t"
          en="$(systemctl --user is-enabled "$t" 2>&1 || true)"
          ac="$(systemctl --user is-active "$t" 2>&1 || true)"
          echo "sau disable --now — is-enabled: $en; is-active: $ac"
          [ "$en" != "enabled" ] && [ "$ac" != "active" ] || { echo "::error::không tắt được $t để dựng ca tự lành" >&2; exit 1; }
          "$GENH" update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" 2>&1 | tee "$RUNNER_TEMP/heal.log"
          grep -Fq 'đã bật lại' "$RUNNER_TEMP/heal.log" \
            || { echo "::error::genh update không in 'đã bật lại' sau khi timer bị tắt (máy chưa có dấu opt-out) — lịch đêm không tự lành, đúng lỗi máy Owner." >&2; exit 1; }
          en="$(systemctl --user is-enabled "$t" 2>&1 || true)"
          ac="$(systemctl --user is-active "$t" 2>&1 || true)"
          echo "sau genh update — is-enabled: $en; is-active: $ac"
          [ "$en" = "enabled" ] || { echo "::error::sau tự lành $t is-enabled = '$en'" >&2; exit 1; }
          [ "$ac" = "active" ] || { echo "::error::sau tự lành $t is-active = '$ac'" >&2; exit 1; }
          echo "OK: lịch đêm tự lành."

      - name: Opt-out (Sếp đã chủ động tắt) — không tự lành; enable xoá dấu và bật lại
        run: |
          set -euo pipefail
          t=gen-harness-update.timer
          marker="$GEN_HARNESS_HOME/config/auto-update-disabled.json"
          "$GENH" auto-update disable --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          [ -f "$marker" ] || { echo "::error::genh auto-update disable không ghi dấu $marker (Sếp đã chủ động tắt)." >&2; exit 1; }
          echo "dấu opt-out: quyền $(stat -c %a "$marker")"
          [ "$(stat -c %a "$marker")" = "600" ] || { echo "::error::$marker phải 0600" >&2; exit 1; }
          "$GENH" auto-update status --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" | tee "$RUNNER_TEMP/au-off.txt"
          grep -Fq 'TẮT' "$RUNNER_TEMP/au-off.txt" \
            || { echo "::error::genh auto-update status không báo TẮT sau auto-update disable." >&2; exit 1; }
          "$GENH" update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          en="$(systemctl --user is-enabled "$t" 2>&1 || true)"
          ac="$(systemctl --user is-active "$t" 2>&1 || true)"
          echo "sau genh update (đã opt-out) — is-enabled: $en; is-active: $ac"
          [ "$en" != "enabled" ] || { echo "::error::genh update bật lại lịch đêm dù Sếp đã chủ động tắt (có dấu opt-out)." >&2; exit 1; }
          [ "$ac" != "active" ] || { echo "::error::lịch đêm đang chạy dù Sếp đã chủ động tắt." >&2; exit 1; }
          python3 - "$GEN_HARNESS_HOME/run/nightly-status.json" "$GEN_HARNESS_HOME/run/genh.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          i = json.load(open(sys.argv[2], encoding="utf-8"))
          assert d.get("opted_out") is True, "nightly-status.json opted_out=%r sau opt-out: %s" % (d.get("opted_out"), d)
          assert d.get("enabled") is False, "nightly-status.json enabled=%r sau opt-out: %s" % (d.get("enabled"), d)
          assert i.get("auto_update_enabled") is False, "genh.json auto_update_enabled=%r sau opt-out" % i.get("auto_update_enabled")
          PY
          "$GENH" auto-update enable --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          [ ! -e "$marker" ] || { echo "::error::genh auto-update enable không xoá dấu opt-out $marker." >&2; exit 1; }
          en="$(systemctl --user is-enabled "$t" 2>&1 || true)"
          ac="$(systemctl --user is-active "$t" 2>&1 || true)"
          echo "sau auto-update enable — is-enabled: $en; is-active: $ac"
          [ "$en" = "enabled" ] || { echo "::error::sau auto-update enable $t is-enabled = '$en'" >&2; exit 1; }
          [ "$ac" = "active" ] || { echo "::error::sau auto-update enable $t is-active = '$ac'" >&2; exit 1; }
          echo "OK: opt-out được tôn trọng; enable xoá dấu và bật lại."

      - name: Hết hạn mức inotify — .path failed (Result=resources) ⇒ status tự chữa sang timer dự phòng; sửa gốc rồi enable ⇒ .path sống, dự phòng tắt
        # v0.1.54: lỗi THẬT trên máy Owner — gen-harness-update-request.path rơi vào failed "Result: resources" vì hết
        # hạn mức inotify (fs.inotify.max_user_instances mặc định 128, máy đang dùng 174); reset-failed + restart vẫn lỗi
        # tới khi Boss `sudo sysctl -w fs.inotify.max_user_instances=1024`. Ở đây dựng lại đúng thế: hạ hạn mức xuống 1
        # (runner là VM, có sudo) rồi restart .path. Runner không cho hạ sysctl ⇒ cách giả khác CHẠY THẬT: một tiến trình
        # python chiếm hết inotify instance của chính người dùng này (đúng nguyên nhân "174 > 128" của máy Owner).
        # Mọi lần sửa hệ thống (sysctl / tiến trình chiếm) được khôi phục ở trap EXIT, kể cả khi bước đỏ.
        run: |
          set -euo pipefail
          p=gen-harness-update-request.path
          tm=gen-harness-update-request.timer
          svc=gen-harness-update-request.service
          udir="$HOME/.config/systemd/user"
          old="$(sysctl -n fs.inotify.max_user_instances)"
          mode=sysctl
          hog_pid=""
          restore() {
            if [ "$mode" = "sysctl" ]; then
              sudo sysctl -w "fs.inotify.max_user_instances=$old" >/dev/null 2>&1 || true
            fi
            if [ -n "$hog_pid" ]; then kill "$hog_pid" 2>/dev/null || true; hog_pid=""; fi
          }
          trap restore EXIT

          [ "$(systemctl --user is-active "$p" 2>&1 || true)" = "active" ] \
            || { echo "::error::$p không active trước ca inotify — các bước trước đã hỏng người gác." >&2; exit 1; }
          [ ! -e "$udir/$tm" ] || { echo "::error::timer dự phòng $tm đã có sẵn khi người gác còn khoẻ." >&2; exit 1; }

          # 1) Dựng lỗi: hết hạn mức inotify ⇒ restart .path ⇒ failed.
          if sudo sysctl -w fs.inotify.max_user_instances=1 >/dev/null 2>&1; then
            echo "hạ fs.inotify.max_user_instances: $old → 1 (sudo sysctl)"
            if systemctl --user restart "$p"; then
              echo "::error::restart $p vẫn thành công khi hạn mức inotify = 1 — không dựng được ca hết hạn mức." >&2
              exit 1
            fi
          else
            mode=hog
            echo "::warning::runner không cho hạ sysctl — dùng tiến trình python chiếm hết inotify instance của người dùng này (cách giả chạy thật)."
            systemctl --user stop "$p"
            python3 -I - >"$RUNNER_TEMP/inotify-hog.log" 2>&1 <<'PY' &
          import ctypes, time
          libc = ctypes.CDLL(None, use_errno=True)
          held = []
          printed = False
          while True:
              fd = libc.inotify_init1(0)
              if fd >= 0:
                  held.append(fd)
                  continue
              if not printed:
                  print("giữ %d inotify instance" % len(held), flush=True)
                  printed = True
              time.sleep(0.02)
          PY
            hog_pid=$!
            deadline=$((SECONDS + 20))
            until grep -q 'giữ ' "$RUNNER_TEMP/inotify-hog.log"; do
              [ "$SECONDS" -lt "$deadline" ] || { echo "::error::tiến trình chiếm inotify không chạy được." >&2; cat "$RUNNER_TEMP/inotify-hog.log" || true; exit 1; }
              sleep 0.5
            done
            cat "$RUNNER_TEMP/inotify-hog.log"
            if systemctl --user start "$p"; then
              echo "::error::start $p vẫn thành công khi đã chiếm hết inotify instance — không dựng được ca hết hạn mức." >&2
              exit 1
            fi
          fi
          st="$(systemctl --user is-active "$p" 2>&1 || true)"
          res="$(systemctl --user show "$p" -p Result --value 2>/dev/null || true)"
          echo "sau khi hết hạn mức — $p is-active: $st; Result: $res"
          [ "$st" = "failed" ] || { echo "::error::$p is-active = '$st' (cần failed) — không dựng được ca máy Owner." >&2; exit 1; }

          # 2) `genh auto-update status` tự chữa: reset-failed + restart vẫn lỗi ⇒ timer dự phòng + nói thật.
          "$GENH" auto-update status --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" | tee "$RUNNER_TEMP/au-inotify.txt"
          for want in 'Người gác yêu cầu (.path) lỗi' 'hết hạn mức inotify' 'đang dùng dự phòng quét mỗi phút' \
                      'sudo sysctl -w fs.inotify.max_user_instances=1024' 'genh auto-update enable'; do
            grep -Fq -e "$want" "$RUNNER_TEMP/au-inotify.txt" \
              || { echo "::error::genh auto-update status thiếu '$want' khi .path failed vì inotify (xem đầu ra ở trên)." >&2; exit 1; }
          done
          en="$(systemctl --user is-enabled "$tm" 2>&1 || true)"
          ac="$(systemctl --user is-active "$tm" 2>&1 || true)"
          echo "timer dự phòng — is-enabled: $en; is-active: $ac"
          [ "$en" = "enabled" ] || { echo "::error::timer dự phòng $tm is-enabled = '$en' (cần enabled)." >&2; exit 1; }
          [ "$ac" = "active" ] || { echo "::error::timer dự phòng $tm is-active = '$ac' (cần active) — yêu cầu cập nhật tay không có ai nhận." >&2; exit 1; }
          cat "$udir/$tm"
          grep -Fq 'OnUnitActiveSec=1min' "$udir/$tm" || { echo "::error::timer dự phòng không quét mỗi phút." >&2; exit 1; }
          grep -Fq "Unit=$svc" "$udir/$tm" || { echo "::error::timer dự phòng không kích cùng service với .path." >&2; exit 1; }
          lim="$(systemctl --user show "$svc" -p StartLimitIntervalUSec --value 2>/dev/null || true)"
          [ "$lim" = "0" ] || { echo "::error::$svc StartLimitIntervalUSec='$lim' (cần 0 khi chạy dự phòng — kích mỗi phút sẽ chạm giới hạn khởi động sau 5 lần)." >&2; exit 1; }
          python3 - "$GEN_HARNESS_HOME/run/nightly-status.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          w = d.get("watcher") or {}
          print(json.dumps(w, ensure_ascii=False))
          assert w.get("state") == "fallback", "nightly-status.json watcher.state=%r (cần fallback): %s" % (w.get("state"), d)
          assert w.get("reason") == "inotify", "watcher.reason=%r (cần inotify)" % w.get("reason")
          assert "inotify" in (w.get("hint") or ""), "watcher.hint thiếu 'inotify': %r" % w.get("hint")
          assert d.get("request_watcher") == "failed", "request_watcher=%r (cần failed)" % d.get("request_watcher")
          PY

          # 3) Dự phòng nhận thật: timer kích service ít nhất một lần và service chạy xong (Result=success).
          deadline=$((SECONDS + 150))
          while :; do
            last="$(systemctl --user show "$tm" -p LastTriggerUSec --value 2>/dev/null || true)"
            state="$(systemctl --user show "$svc" -p ActiveState --value 2>/dev/null || true)"
            case "$last" in
              ''|n/a|0) ;;
              *) [ "$state" = "inactive" ] && break ;;
            esac
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::sau 150 giây timer dự phòng chưa kích service (LastTriggerUSec='${last:-<rỗng>}', service '$state')." >&2; systemctl --user status "$tm" "$svc" --no-pager || true; exit 1; }
            sleep 3
          done
          result="$(systemctl --user show "$svc" -p Result --value)"
          echo "timer dự phòng đã kích service ($last); service Result=$result"
          [ "$result" = "success" ] || { echo "::error::service nhận yêu cầu do timer dự phòng kích có Result='$result'." >&2; journalctl --user -u "$svc" --no-pager | tail -50 || true; exit 1; }
          # Hồi quy (E2E v0.1.54 từng đỏ ở đây): hạn mức vẫn thấp thì dự phòng PHẢI sống sót sau lần chạy service của chính nó.
          # systemd thật: khi service mà .path kích đang chạy, `restart .path` cho .path "active (running)" mà không dựng
          # inotify nào ("If the triggered unit is already running, so are we") ⇒ tự chữa trong service từng báo sống giả,
          # gỡ dự phòng; service xong .path lại failed (resources) và không còn ai nhận yêu cầu.
          st="$(systemctl --user is-active "$p" 2>&1 || true)"
          en="$(systemctl --user is-enabled "$tm" 2>&1 || true)"
          ac="$(systemctl --user is-active "$tm" 2>&1 || true)"
          echo "sau lần chạy service của dự phòng — $p: $st; $tm is-enabled: $en; is-active: $ac"
          [ "$st" = "failed" ] || { echo "::error::$p is-active = '$st' (cần failed) khi hạn mức inotify vẫn thấp — .path sống giả?" >&2; exit 1; }
          [ "$en" = "enabled" ] && [ "$ac" = "active" ] \
            || { echo "::error::timer dự phòng bị gỡ/tắt sau lần chạy service của chính nó (is-enabled='$en', is-active='$ac') — .path sống giả trong service rồi gỡ dự phòng." >&2; exit 1; }
          [ -e "$udir/$tm" ] || { echo "::error::tệp timer dự phòng $tm biến mất khi hạn mức inotify vẫn thấp." >&2; exit 1; }

          # 4) Sửa gốc rồi `genh auto-update enable` ⇒ .path sống lại, timer dự phòng tắt + gỡ.
          restore
          trap - EXIT
          if [ "$mode" = "sysctl" ]; then
            [ "$(sysctl -n fs.inotify.max_user_instances)" = "$old" ] || { echo "::error::chưa khôi phục được fs.inotify.max_user_instances=$old." >&2; exit 1; }
          fi
          "$GENH" auto-update enable --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          st="$(systemctl --user is-active "$p" 2>&1 || true)"
          echo "sau enable — $p is-active: $st"
          [ "$st" = "active" ] || { echo "::error::sau khi sửa gốc và auto-update enable, $p is-active = '$st' (cần active)." >&2; exit 1; }
          ac="$(systemctl --user is-active "$tm" 2>&1 || true)"
          en="$(systemctl --user is-enabled "$tm" 2>&1 || true)"
          echo "timer dự phòng sau enable — is-enabled: $en; is-active: $ac"
          [ "$ac" != "active" ] && [ "$en" != "enabled" ] || { echo "::error::timer dự phòng vẫn bật sau khi .path sống lại." >&2; exit 1; }
          [ ! -e "$udir/$tm" ] || { echo "::error::tệp timer dự phòng $tm chưa được gỡ." >&2; exit 1; }
          [ ! -e "$udir/$svc.d/fallback.conf" ] || { echo "::error::drop-in StartLimit của chế độ dự phòng chưa được gỡ." >&2; exit 1; }
          python3 - "$GEN_HARNESS_HOME/run/nightly-status.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          w = d.get("watcher") or {}
          assert w.get("state") == "ok", "nightly-status.json watcher=%r sau khi sửa gốc (cần ok): %s" % (w, d)
          assert d.get("request_watcher") == "active", "request_watcher=%r (cần active)" % d.get("request_watcher")
          PY
          # Lịch đêm không bị ảnh hưởng.
          t=gen-harness-update.timer
          [ "$(systemctl --user is-enabled "$t" 2>&1 || true)" = "enabled" ] && [ "$(systemctl --user is-active "$t" 2>&1 || true)" = "active" ] \
            || { echo "::error::lịch đêm $t không còn enabled + active sau ca inotify." >&2; exit 1; }
          echo "OK: hết hạn mức inotify ⇒ dự phòng quét mỗi phút nhận thật; sửa gốc + enable ⇒ .path active, dự phòng tắt và gỡ."

      - name: (khi lỗi) In chẩn đoán systemd --user + log lịch đêm — KHÔNG in config/secrets.json hay .env
        if: failure()
        run: |
          set +e
          echo "════ systemctl --user list-timers --all ════"
          systemctl --user list-timers --all --no-pager
          echo "════ systemctl --user status 'gen-harness-*' ════"
          systemctl --user status 'gen-harness-*' --no-pager
          echo "════ journalctl --user -u 'gen-harness-*' (200 dòng cuối) ════"
          journalctl --user -u 'gen-harness-*' --no-pager | tail -200
          echo "════ tail -100 logs/auto-update.log ════"
          tail -n 100 "$GEN_HARNESS_HOME/logs/auto-update.log"
          echo "════ run/ (chỉ trạng thái, không bí mật) ════"
          ls -la "$GEN_HARNESS_HOME/run" "$GEN_HARNESS_HOME/run/request"
          for f in genh.json nightly-status.json update-status.json autostart-status.json; do
            echo "── run/$f ──"
            cat "$GEN_HARNESS_HOME/run/$f"
            echo
          done
          exit 0

      - name: genh uninstall --yes --delete-data (không tương tác, dọn sạch cả dữ liệu)
        run: |
          set -euo pipefail
          "$GENH" help >"$RUNNER_TEMP/genh-help.txt"
          if grep -q -- '--delete-data' "$RUNNER_TEMP/genh-help.txt"; then
            "$GENH" uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --delete-data
          else
            "$GENH" uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes
          fi
          for u in gen-harness-update.timer gen-harness-update-request.path; do
            en="$(systemctl --user is-enabled "$u" 2>&1 || true)"
            ac="$(systemctl --user is-active "$u" 2>&1 || true)"
            echo "$u sau uninstall — is-enabled: $en; is-active: $ac"
            { [ "$en" != "enabled" ] && [ "$ac" != "active" ]; } || { echo "::error::sau genh uninstall $u vẫn còn bật/chạy." >&2; exit 1; }
          done

      - name: (luôn) In log docker compose (tail 200) để debug
        if: always()
        run: |
          set -euo pipefail
          docker ps -a || true
          for c in $(docker ps -a --format '{{.Names}}' | grep '^gen-harness-' || true); do
            echo "════ $c ════"
            docker logs --tail 200 "$c" 2>&1 || true
          done

      - name: (luôn) In log genh (logs/) để debug
        if: always()
        run: |
          set -euo pipefail
          if [ -d "$GEN_HARNESS_HOME/logs" ]; then
            for f in "$GEN_HARNESS_HOME"/logs/*; do
              echo "── $f ──"
              tail -n 200 "$f" || true
            done
          else
            echo "không thấy $GEN_HARNESS_HOME/logs"
          fi

  # ── promote ──────────────────────────────────────────────────────────────
  # Nâng tag thành BẢN CHÍNH THỨC (latest) — chỉ khi resolve bảo promote VÀ
  # (e2e-install xanh VÀ e2e-rollback xanh VÀ e2e-offsite xanh VÀ e2e-nightly-real xanh VÀ e2e-upgrade xanh/bỏ qua), hoặc khi Owner chạy tay
  # với skip_e2e=true (promote tay, có cảnh báo). always() để job vẫn được
  # xét khi e2e-upgrade bị bỏ qua (chưa có bản chính thức cũ hơn).
  # Không bao giờ hạ cấp: latest hiện tại mới hơn thì chỉ cảnh báo.
  # Cùng MỘT lệnh `gh release edit` (một PATCH) với việc nâng latest, ghi dấu
  # `<!-- genh:promoted_at=<UTC> -->` vào cuối ghi chú Release: selfupdate
  # (apps/genh/internal/selfupdate, PromotedMarker) tính thời gian chín 24 giờ
  # của lịch đêm TỪ dấu này — published_at là lúc tạo bản thử, promote không
  # đổi nó, nên bản thử promote muộn (vd promote tay sau vài ngày) sẽ lọt
  # cổng ngay nếu chỉ dựa vào published_at. Định dạng dấu phải khớp
  # PromotedMarker (check_release_gate.py giữ).
  # v0.1.48 (F-36): KHÔNG còn ảnh GHCR `:latest` — ảnh chỉ có tag `:<version>` + `:sha-<commit>` (release.yml
  # build-images); máy Owner dùng digest ghim trong compose.release.yaml, nên job này chỉ nâng Release
  # (quyền contents: write, không cần packages: write).
  promote:
    name: nâng thành bản chính thức (promote ${{ needs.resolve.outputs.tag }})
    runs-on: ubuntu-latest
    needs: [resolve, e2e-install, e2e-upgrade, e2e-rollback, e2e-offsite, e2e-nightly-real]
    if: always() && needs.resolve.outputs.promote == 'true' && (needs.resolve.outputs.skip_e2e == 'true' || (needs.e2e-install.result == 'success' && needs.e2e-rollback.result == 'success' && needs.e2e-offsite.result == 'success' && needs.e2e-nightly-real.result == 'success' && (needs.e2e-upgrade.result == 'success' || needs.e2e-upgrade.result == 'skipped')))
    permissions:
      contents: write
    outputs:
      # true khi CHÍNH lượt này vừa nâng tag thành latest (e2e-selfupdate chỉ
      # chạy khi đó); false khi đã là latest từ trước hoặc không hạ cấp.
      promoted: ${{ steps.p.outputs.promoted }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.resolve.outputs.tag }}
      R: ${{ github.repository }}
      SKIP_E2E: ${{ needs.resolve.outputs.skip_e2e }}
    steps:
      - name: Nâng ${{ needs.resolve.outputs.tag }} thành bản chính thức (latest) + ghi dấu thời điểm promote
        id: p
        run: |
          set -euo pipefail
          # Ghi output đúng MỘT lần, ở mọi lối thoát (exit 0 sớm, exit 1, xong).
          promoted=false
          is_latest=false
          trap 'printf "promoted=%s\nis_latest=%s\n" "$promoted" "$is_latest" >>"$GITHUB_OUTPUT"' EXIT
          # Bản chính thức hiện tại; rỗng nếu 404 (không dùng `$(… || true)`:
          # khi lỗi HTTP, gh api vẫn in thân JSON lỗi ra stdout).
          latest_official() {
            local t
            if t="$(gh api "repos/$R/releases/latest" --jq .tag_name 2>/dev/null)"; then printf '%s' "$t"; fi
          }
          if [ "$SKIP_E2E" = "true" ]; then
            echo "::warning::PROMOTE TAY — đã bỏ qua E2E cho $TAG (skip_e2e=true). Ghi lý do vào HANDOFF và chạy lại E2E khi GitHub/mạng ổn."
          fi

          before="$(latest_official)"
          echo "releases/latest TRƯỚC: ${before:-<chưa có>}"

          pre="$(gh release view "$TAG" --repo "$R" --json isPrerelease --jq .isPrerelease)"
          if [ "$pre" != "true" ] && [ "$before" = "$TAG" ]; then
            echo "$TAG đã là latest (bản chính thức) — không cần làm gì."
            is_latest=true
            exit 0
          fi
          case "$TAG" in
            *-*)
              echo "::error::$TAG có hậu tố '-' (bản thử dài hạn) — không được nâng thành bản chính thức. Phát hành bản không hậu tố (tăng VERSION) nếu muốn máy Owner nhận." >&2
              exit 1
              ;;
          esac
          if [ -n "$before" ] && [ "$before" != "$TAG" ] \
            && [ "$(printf '%s\n%s\n' "$before" "$TAG" | sort -V | tail -n1)" = "$before" ]; then
            echo "::warning::bản mới hơn đã là latest ($before), không hạ cấp — $TAG giữ nguyên là bản thử."
            exit 0
          fi

          # Dấu thời điểm promote — đúng định dạng selfupdate.PromotedMarker
          # (RFC 3339, UTC, đơn vị giây). Bỏ dấu cũ (nếu bản này từng được
          # promote rồi hạ về bản thử) để ghi chú chỉ còn một dấu.
          marker="<!-- genh:promoted_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) -->"
          notes="$RUNNER_TEMP/notes-promoted.md"
          gh release view "$TAG" --repo "$R" --json body --jq .body >"$RUNNER_TEMP/notes.md"
          { grep -v 'genh:promoted_at=' "$RUNNER_TEMP/notes.md" || true; printf '\n%s\n' "$marker"; } >"$notes"
          gh release edit "$TAG" --repo "$R" --prerelease=false --latest --notes-file "$notes"

          # API releases/latest có thể trễ vài giây — chờ tối đa 60 giây.
          after=""
          deadline=$((SECONDS + 60))
          while :; do
            after="$(latest_official)"
            if [ "$after" = "$TAG" ] || [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            sleep 5
          done
          echo "releases/latest SAU: ${after:-<chưa có>}"
          if [ "$after" != "$TAG" ]; then
            echo "::error::Đã sửa Release $TAG nhưng releases/latest vẫn là '${after:-<chưa có>}' sau 60 giây — kiểm tay: gh release edit $TAG --prerelease=false --latest, rồi gh api repos/$R/releases/latest." >&2
            exit 1
          fi
          is_latest=true
          # So khớp trong bash (không `| grep -q`: grep thoát sớm → gh nhận SIGPIPE → pipefail báo nhầm là thiếu dấu).
          body_after="$(gh api "repos/$R/releases/latest" --jq .body)"
          if [[ "$body_after" != *"$marker"* ]]; then
            echo "::error::$TAG đã là latest nhưng ghi chú Release thiếu dấu $marker — lịch đêm sẽ tính 24 giờ từ published_at (lúc tạo bản thử), có thể cài ngay đêm nay. Thêm tay dòng đó vào cuối ghi chú: gh release view $TAG --repo $R --json body --jq .body > n.md; echo '$marker' >> n.md; gh release edit $TAG --repo $R --notes-file n.md" >&2
            exit 1
          fi
          promoted=true
          is_latest=true
          {
            echo "### Promote"
            echo "releases/latest: ${before:-<chưa có>} → **$after** (dấu: \`$marker\`)"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "OK: $TAG là bản chính thức — máy Owner (install.sh, genh tự cập nhật) sẽ nhận bản này; lịch đêm đợi đủ 24 giờ từ $marker."

  # ── e2e-selfupdate ───────────────────────────────────────────────────────
  # Đường MỌI máy Owner thật sự đi khi có bản mới: genh CŨ (bản chính thức
  # liền trước = PREV_TAG) tự hỏi releases/latest, tự tải genh mới + kiểm
  # checksum (internal/selfupdate), re-exec bằng --self-updated rồi nâng cấp
  # dịch vụ bằng compose.yaml NHÚNG của bản mới. Bản thử bị ẩn khỏi
  # releases/latest nên đường này chỉ kiểm được SAU promote — job này vì thế
  # KHÔNG chặn promote, nhưng chạy ngay sau đó, trong khi lịch đêm của máy
  # Owner còn đợi 24 giờ (dấu promoted_at): đỏ ⇒ còn thời gian lùi bản (xem
  # ::error ở bước cuối) trước khi máy nào tự cài.
  # Kịch bản: cài PREV_TAG → (genh cũ có cổng 24 giờ) `genh update --yes` phải
  # HOÃN, version không đổi → `genh update` (không --yes, MinAge = 0) → version
  # = TAG, /api/v1/ready xanh, compose.yaml theo ảnh của TAG, app_db_password
  # không đổi.
  e2e-selfupdate:
    name: genh ${{ needs.resolve.outputs.prev_tag }} tự cập nhật lên ${{ needs.resolve.outputs.tag }} (sau promote)
    needs: [resolve, promote]
    # always(): promote chạy nhờ always() khi e2e-upgrade/e2e-install bị bỏ
    # qua (skip_e2e) — không có always() ở đây thì job này bị bỏ qua theo.
    if: always() && needs.promote.result == 'success' && needs.promote.outputs.promoted == 'true' && needs.resolve.outputs.prev_tag != '' && needs.resolve.outputs.broken_install != 'true'
    runs-on: ubuntu-24.04
    # Chạy ngoài checkout repo: genh tìm compose.yaml theo cwd trước — xem e2e-install.
    defaults:
      run:
        working-directory: /tmp
    timeout-minutes: 45
    # contents: write — bước rollback (if: failure()) tự lùi bản chính thức.
    permissions:
      contents: write
    env:
      GH_PORT: "8445"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.tag }}
      PREV_TAG: ${{ needs.resolve.outputs.prev_tag }}
    steps:
      - name: Đặt GEN_HARNESS_HOME (thư mục cài đặt tạm của job này)
        run: echo "GEN_HARNESS_HOME=$RUNNER_TEMP/gh-selfupdate" >>"$GITHUB_ENV"

      - name: Cài sạch bản chính thức TRƯỚC ĐÓ (${{ needs.resolve.outputs.prev_tag }})
        run: |
          set -euo pipefail
          # Như e2e-upgrade: tải asset của đúng PREV_TAG, kiểm checksum, đặt vào bin/.
          mkdir -p "$GEN_HARNESS_HOME/bin"
          gh release download "$PREV_TAG" --repo "$R" \
            --pattern 'genh-linux-amd64' --pattern 'checksums.txt' --dir "$RUNNER_TEMP/prev" --clobber
          want="$(awk '$2=="genh-linux-amd64"||$2=="./genh-linux-amd64"{print $1}' "$RUNNER_TEMP/prev/checksums.txt")"
          got="$(sha256sum "$RUNNER_TEMP/prev/genh-linux-amd64" | awk '{print $1}')"
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "::error::sha256 của genh-linux-amd64 ($PREV_TAG) không khớp checksums.txt — asset Release bị thay hoặc tải hỏng; tải lại/kiểm Release $PREV_TAG." >&2; exit 1; }
          install -m 0755 "$RUNNER_TEMP/prev/genh-linux-amd64" "$GEN_HARNESS_HOME/bin/genh"
          "$GEN_HARNESS_HOME/bin/genh" version
          "$GEN_HARNESS_HOME/bin/genh" install --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-auto-update
          # v0.1.53: genh cũ chưa biết dấu "Sếp đã chủ động tắt" (config/auto-update-disabled.json) nên --no-auto-update ở
          # trên không ghi nó. Ghi sẵn để genh mới (sau nâng cấp) KHÔNG tự lành bật dòng crontab 03:00–03:29 giờ runner (UTC
          # = 10:00 VN, giờ hay phát hành) — dòng đó chạy `genh update --yes` giành genh.lock giữa bài kiểm ⇒ đỏ chập chờn
          # GH-E94A. Đúng ý nghĩa --no-auto-update của genh mới (cài kiểu này = Sếp đã tắt).
          optout="$GEN_HARNESS_HOME/config/auto-update-disabled.json"
          mkdir -p "$GEN_HARNESS_HOME/config"
          [ -e "$optout" ] || printf '{"at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >"$optout"
          chmod 600 "$optout"

      - name: Chờ /api/v1/ready xanh (bản cũ, tối đa 5 phút)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::ready không xanh (bản cũ $PREV_TAG)" >&2; exit 1; }
            sleep 3
          done

      - name: Ghi lại app_db_password TRƯỚC khi tự cập nhật
        id: before
        run: |
          set -euo pipefail
          pw="$(python3 -c "import json;print(json.load(open('${GEN_HARNESS_HOME}/config/secrets.json'))['app_db_password'])")"
          echo "::add-mask::$pw"
          echo "pw=$pw" >>"$GITHUB_OUTPUT"

      - name: Chờ releases/latest CÔNG KHAI (không token, đúng như genh hỏi) trả ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # API công khai có thể đệm vài phút sau khi promote — genh cũ hỏi
          # trước lúc đó sẽ thấy bản cũ và báo "đã mới nhất".
          deadline=$((SECONDS + 300))
          while :; do
            t="$(curl -fsS -H 'Accept: application/vnd.github+json' -H 'User-Agent: gen-harness-genh' \
              "https://api.github.com/repos/$R/releases/latest" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name",""))' 2>/dev/null || true)"
            echo "releases/latest (công khai): ${t:-<không đọc được>}"
            [ "$t" != "$TAG" ] || break
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::sau 5 phút releases/latest công khai vẫn là '${t:-<không đọc được>}', không phải $TAG — kiểm job promote." >&2; exit 1; }
            sleep 15
          done

      - name: (cổng 24 giờ) genh update --yes --quiet (như lịch đêm) phải HOÃN bản vừa promote — version giữ ${{ needs.resolve.outputs.prev_tag }}
        run: |
          set -euo pipefail
          # Cổng 24 giờ nằm trong code của genh CŨ: chỉ genh ≥ v0.1.33 có.
          # Bản cũ hơn (vd v0.1.32) gặp --yes sẽ cài luôn — bỏ qua bước này.
          if [ "$(printf '%s\n%s\n' v0.1.33 "$PREV_TAG" | sort -V | head -n1)" != v0.1.33 ]; then
            echo "genh $PREV_TAG chưa có cổng 24 giờ (có từ v0.1.33) — bỏ qua bước kiểm hoãn."
            exit 0
          fi
          # Chạy lại job này (Re-run) sau gần 24 giờ thì bản đã "chín" — --yes cài là ĐÚNG, không kiểm hoãn nữa.
          body="$(gh api "repos/$R/releases/latest" --jq .body)"
          pa="$(printf '%s\n' "$body" | sed -n 's/.*genh:promoted_at=\([0-9TZ:-]*\).*/\1/p' | tail -n1)"
          [ -n "$pa" ] || { echo "::error::ghi chú Release $TAG không có dấu genh:promoted_at — job promote chưa ghi dấu, lịch đêm sẽ tính từ published_at." >&2; exit 1; }
          age=$(( $(date -u +%s) - $(date -u -d "$pa" +%s) ))
          if [ "$age" -ge $((23 * 3600)) ]; then
            echo "promote lúc $pa (đã ${age}s) — gần/đủ 24 giờ, bỏ qua bước kiểm hoãn."
            exit 0
          fi
          log="$RUNNER_TEMP/update-yes.log"
          for attempt in 1 2 3; do
            # Đúng cờ timer đêm (internal/autoupdate): update --yes --quiet.
            "$GEN_HARNESS_HOME/bin/genh" update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --quiet 2>&1 | tee "$log"
            # Hạn mức API GitHub không xác thực (runner dùng chung IP) ⇒ genh
            # báo "không hỏi được bản mới nhất" — thử lại, không coi là lỗi mã.
            grep -q 'không hỏi được bản mới nhất' "$log" || break
            echo "::warning::lần $attempt: genh không hỏi được releases/latest (mạng/hạn mức API) — thử lại sau 60 giây."
            sleep 60
          done
          if ! grep -q 'đợi đủ 24 giờ' "$log"; then
            echo "::error::genh $PREV_TAG chạy \`genh update --yes\` KHÔNG hoãn $TAG vừa promote — cổng 24 giờ của lịch đêm không chặn (thiếu dấu promoted_at trong ghi chú Release, hoặc lỗi selfupdate). Xem log bước này." >&2
            exit 1
          fi
          out="$("$GEN_HARNESS_HOME/bin/genh" version)"
          echo "$out"
          case " $out " in
            *" $PREV_TAG "*) echo "OK: --yes hoãn $TAG, genh vẫn là $PREV_TAG" ;;
            *) echo "::error::sau \`genh update --yes\` genh báo '$out' — đáng lẽ vẫn là $PREV_TAG (bản mới chưa đủ 24 giờ)." >&2; exit 1 ;;
          esac
          if grep -q 'genh: cập nhật xong\.' "$log"; then
            echo "::error::bị hoãn mà log vẫn in 'genh: cập nhật xong.' — người đọc logs/auto-update.log sẽ tưởng đã cài." >&2
            exit 1
          fi

      - name: genh ${{ needs.resolve.outputs.prev_tag }} tự cập nhật — genh update (không --yes, như Owner gõ tay / "Cập nhật ngay")
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/update.log"
          for attempt in 1 2 3; do
            "$GEN_HARNESS_HOME/bin/genh" update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" 2>&1 | tee "$log"
            grep -q 'không hỏi được bản mới nhất' "$log" || break
            echo "::warning::lần $attempt: genh không hỏi được releases/latest (mạng/hạn mức API) — thử lại sau 60 giây."
            sleep 60
          done

      - name: Chờ /api/v1/ready xanh lại sau tự cập nhật (tối đa 5 phút)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::ready không xanh sau khi genh tự cập nhật lên $TAG" >&2; exit 1; }
            sleep 3
          done

      - name: Kiểm genh đã tự thay thành ${{ needs.resolve.outputs.tag }} và compose.yaml theo ảnh của bản đó
        run: |
          set -euo pipefail
          out="$("$GEN_HARNESS_HOME/bin/genh" version)"
          echo "$out"
          case " $out " in
            *" $TAG "*) echo "OK: genh $PREV_TAG đã tự tải và thay bằng $TAG" ;;
            *)
              echo "::error::sau \`genh update\`, genh báo '$out' chứ không phải $TAG — genh cũ KHÔNG tự lên được bản mới (xem log bước trước: dòng 'genh: …' của selfupdate)." >&2
              exit 1
              ;;
          esac
          # Phần dịch vụ phải chạy bằng code MỚI (re-exec --self-updated):
          # compose.yaml genh quản lý phải mang đúng ảnh (digest) của $TAG.
          gh release download "$TAG" --repo "$R" --pattern 'compose.release.yaml' --dir "$RUNNER_TEMP/new" --clobber
          imgs() { grep -E '^[[:space:]]*image:' "$1" | sed -E 's/^[[:space:]]*image:[[:space:]]*//' | sort -u; }
          if ! diff <(imgs "$RUNNER_TEMP/new/compose.release.yaml") <(imgs "$GEN_HARNESS_HOME/deploy/compose.yaml"); then
            echo "::error::compose.yaml sau tự cập nhật không mang ảnh của $TAG (diff ở trên: < bản $TAG, > đang dùng) — phần nâng cấp dịch vụ chưa chạy bằng genh mới (re-exec --self-updated)." >&2
            exit 1
          fi
          echo "OK: compose.yaml dùng đúng ảnh của $TAG"

      - name: Kiểm dữ liệu/bí mật KHÔNG bị tạo lại (app_db_password không đổi)
        run: |
          set -euo pipefail
          pw_after="$(python3 -c "import json;print(json.load(open('${GEN_HARNESS_HOME}/config/secrets.json'))['app_db_password'])")"
          echo "::add-mask::$pw_after"
          if [ "$pw_after" != "${{ steps.before.outputs.pw }}" ]; then
            echo "::error::app_db_password đã ĐỔI sau khi genh tự cập nhật — bí mật/dữ liệu có vẻ bị tạo lại thay vì giữ nguyên." >&2
            exit 1
          fi
          echo "OK: app_db_password giữ nguyên sau khi genh $PREV_TAG tự cập nhật lên $TAG."

      - name: Đỏ ⇒ TỰ lùi bản chính thức về ${{ needs.resolve.outputs.prev_tag }} (trước khi lịch đêm của máy Owner tự cài)
        id: rollback
        if: failure()
        run: |
          set -euo pipefail
          echo "::error::$TAG đã là bản chính thức nhưng genh $PREV_TAG (bản máy Owner đang chạy) KHÔNG tự cập nhật lên được — tự lùi bản chính thức về $PREV_TAG. Máy đã lên $TAG (bấm Cập nhật ngay) giữ nguyên, không tự hạ cấp. Sửa mã, tăng VERSION, phát hành bản mới."
          latest_now() { gh api "repos/$R/releases/latest" --jq .tag_name 2>/dev/null || echo "<không đọc được>"; }
          before="$(latest_now)"
          echo "TRƯỚC: releases/latest = $before"
          gh release edit "$TAG" --repo "$R" --prerelease=true
          gh release edit "$PREV_TAG" --repo "$R" --latest
          after="$(latest_now)"
          echo "SAU: releases/latest = $after"
          {
            echo "### ⚠️ Tự cập nhật $PREV_TAG → $TAG ĐỎ — đã tự lùi bản chính thức"
            echo "- TRƯỚC: releases/latest = $before"
            echo "- SAU: releases/latest = $after (phải là $PREV_TAG)"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$after" != "$PREV_TAG" ]; then
            echo "::error::Lùi KHÔNG thành: releases/latest là '$after', không phải $PREV_TAG. Làm tay NGAY: gh release edit $TAG --repo $R --prerelease=true && gh release edit $PREV_TAG --repo $R --latest, rồi kiểm gh api repos/$R/releases/latest --jq .tag_name." >&2
            exit 1
          fi
          echo "OK: bản chính thức đã lùi về $PREV_TAG; $TAG thành bản thử."

      - name: genh uninstall --yes --delete-data (dọn dẹp)
        if: always()
        # genh cũ không biết --delete-data (thoát 2) → thử lại không cờ (bản cũ: --yes là xoá dữ liệu).
        run: '"$GEN_HARNESS_HOME/bin/genh" uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --delete-data || "$GEN_HARNESS_HOME/bin/genh" uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes || true'

      - name: (luôn) In log docker compose (tail 200) để debug
        if: always()
        run: |
          set -euo pipefail
          docker ps -a || true
          for c in $(docker ps -a --format '{{.Names}}' | grep '^gen-harness-' || true); do
            echo "════ $c ════"
            docker logs --tail 200 "$c" 2>&1 || true
          done
